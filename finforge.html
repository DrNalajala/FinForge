    "A five-star AC uses roughly 25-30% less than a three-star one for the same cooling - the premium usually pays back in two to three summers."]}}});

add({id:"currency",cat:EV,name:"Currency converter",tags:"forex exchange rate dollar euro conversion remittance tcs",
 blurb:"Convert at a rate you enter, with the forex markup and TCS that actually apply on Indian remittances.",
 inputs:[M("amt","Amount",1000,0.01,1e9,1),M("rate","Exchange rate - rupees per unit",87,0.01,1000,0.01),
  G("dir","Direction","to",[["to","Foreign to rupees"],["from","Rupees to foreign"]]),
  P("mark","Bank or card markup",3.5,0,8,0.1),P("tcs","TCS on outward remittance",5,0,20,0.5,{hint:"20% above \u20B910 lakh a year under LRS; 5% for education and medical"})],
 run(s){const a=N(s.amt),r=N(s.rate),m=N(s.mark)/100;
  if(s.dir==="to"){const gross=a*r,net=gross*(1-m);
   return{hero:{label:"You receive",value:money(net),sub:"At "+money(r)+" per unit, after a "+N(s.mark)+"% markup"},
    kpis:[K("At the market rate",money(gross)),K("Markup cost",money(gross-net),"r"),
     K("Effective rate",money(net/a),"p"),K("Loss to markup",pct(N(s.mark),2),"a")],
    formula:"Received = amount x rate x (1 - markup) = "+money(net)}}
  const eff=r*(1+m),tcs=a*N(s.tcs)/100,fx=a/eff;
  return{hero:{label:"You get",value:num(fx,2)+" units",sub:"At an effective rate of "+money(eff)+" including the markup"},
   kpis:[K("Market rate",money(r)),K("Effective rate",money(eff),"a"),
    K("Markup cost",money(a-a/(1+m)),"r"),K("TCS collected",money(tcs),"a")],
   table:{title:"Total outgo",cols:["Line","Amount"],
    rows:[["Remittance",money(a)],["TCS at "+N(s.tcs)+"%",money(tcs)],["Total debited",money(a+tcs)],
     ["Foreign currency received",num(fx,2)]]},
   formula:"Effective rate = market rate x (1 + markup) = "+money(eff)+". TCS is collected on top and adjusted in your tax return.",
   notes:["TCS is not a tax you lose - it is credited against your income tax liability when you file. It does block your cash for months.",
    "Forex cards and specialist remittance services typically charge 0.5-1.5% against 3-4% on a debit or credit card abroad."]}}});

add({id:"breakeven",cat:EV,name:"Business break-even",tags:"break even point fixed cost variable contribution margin units safety",
 blurb:"Units and revenue needed to cover fixed costs, and the cushion above that point.",
 inputs:[M("fixed","Fixed costs a month",500000,0,1e9,10000),M("price","Selling price per unit",1200,0.01,1e8,10),
  M("var","Variable cost per unit",700,0,1e8,10),U("actual","Units you sell now",1500,0,1e7,10,"units"),
  M("target","Profit you want",300000,0,1e9,10000)],
 run(s){const f=N(s.fixed),p=N(s.price),v=N(s.var),cm=p-v,cmr=cm/p*100;
  const be=cm>0?f/cm:0,beRev=be*p,tgt=cm>0?(f+N(s.target))/cm:0;
  const act=N(s.actual),profit=act*cm-f,mos=act>0?(act-be)/act*100:0;
  const L=[],A=[],B=[];
  for(let u=0;u<=Math.max(be*2,act*1.2);u+=Math.max(Math.ceil(Math.max(be*2,act*1.2)/8),1)){L.push(inr(u));A.push(u*p);B.push(f+u*v);}
  return{hero:{label:"Break-even",value:inr(Math.ceil(be))+" units",sub:"Revenue of "+money(beRev)+" a month just to cover costs"},
   kpis:[K("Contribution per unit",money(cm),cm>0?"g":"r"),K("Contribution margin",pct(cmr,1),"p"),
    K("Profit at "+inr(act)+" units",money(profit),profit>=0?"g":"r"),K("Margin of safety",pct(mos,1),mos>20?"g":"a")],
   chart:{title:"Revenue against total cost",labels:L,
    series:[{name:"Revenue",color:C.ret,values:A,type:"line"},{name:"Total cost",color:C.tax,values:B,type:"line"}]},
   table:{title:"Key volumes",cols:["Scenario","Units","Revenue","Profit"],
    rows:[["Break-even",inr(Math.ceil(be)),money(beRev),money(0)],
     ["For "+shortI(N(s.target))+" profit",inr(Math.ceil(tgt)),money(tgt*p),money(N(s.target))],
     ["Current",inr(act),money(act*p),money(profit)]]},
   formula:F("Contribution = price - variable cost = "+money(cm),
     "Break-even units = fixed costs / contribution = "+inr(f)+" / "+inr(cm)+" = "+num(be,1),
     "Units for a target profit = (fixed + target) / contribution = "+num(tgt,1)),
   notes:["Margin of safety is how far sales can fall before you make a loss. Under 20% is a fragile business.",
    "Cutting variable cost per unit moves break-even faster than raising price, because it lifts every future unit's contribution."]}}});

add({id:"hourly",cat:EV,name:"Freelance rate & billable hours",tags:"hourly rate freelance consultant day rate utilisation project quote",
 blurb:"Work back from the income you want to the hourly rate you must charge, allowing for unbillable time.",
 inputs:[M("target","Income you want a year",2400000,100000,1e8,50000),M("cost","Business costs a year",300000,0,1e8,10000),
  U("wk","Working weeks a year",46,20,52,1,"weeks"),U("hrs","Hours a week",40,5,80,1,"hours"),
  P("bill","Share of hours actually billable",65,20,100,5),P("tax","Effective tax rate",20,0,45,1)],
 run(s){const gross=(N(s.target)/(1-N(s.tax)/100))+N(s.cost);
  const hrs=N(s.wk)*N(s.hrs),bill=hrs*N(s.bill)/100,rate=bill>0?gross/bill:0;
  return{hero:{label:"Rate you must charge",value:money(rate)+" an hour",sub:money(rate*8)+" a day, on "+inr(Math.round(bill))+" billable hours a year"},
   kpis:[K("Gross billing needed",money(gross),"p"),K("Billable hours",inr(Math.round(bill))),
    K("Unbillable hours",inr(Math.round(hrs-bill)),"a"),K("Monthly billing target",money(gross/12),"g")],
   table:{title:"Rate at different utilisation",cols:["Billable share","Billable hours","Rate needed"],
    rows:[40,50,60,70,80].map(b=>[b+"%",inr(Math.round(hrs*b/100)),money(gross/(hrs*b/100))])},
   formula:F("Gross needed = target income / (1 - tax) + business costs = "+money(gross),
     "Billable hours = "+N(s.wk)+" weeks x "+N(s.hrs)+" hours x "+N(s.bill)+"% = "+inr(Math.round(bill)),
     "Rate = gross / billable hours = "+money(rate)),
