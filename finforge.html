    "Delivery trades add a DP charge per scrip on the sell side, which hits small quantities disproportionately."]}}});

add({id:"possize",cat:MKT,name:"Position sizing",tags:"risk per trade position size stop loss capital 1 percent rule",
 blurb:"How many shares to buy so that a stop-loss hit costs you only the amount you decided to risk.",
 inputs:[M("cap","Trading capital",1000000,10000,500000000,10000),P("risk","Risk per trade",1,0.1,10,0.1),
  M("entry","Entry price",500,0.05,1000000,0.05),M("stop","Stop loss price",480,0.05,1000000,0.05),
  P("maxpos","Maximum position size",25,1,100,1)],
 run(s){const cap=N(s.cap),rk=cap*N(s.risk)/100,e=N(s.entry),st=N(s.stop);
  const per=Math.abs(e-st),qty=per>0?Math.floor(rk/per):0;
  const capped=Math.min(qty,Math.floor(cap*N(s.maxpos)/100/e)),val=capped*e;
  return{hero:{label:"Buy this many",value:inr(capped)+" shares",sub:"Position "+money(val)+", risking "+money(capped*per)+" if the stop triggers"},
   kpis:[K("Risk budget",money(rk),"a"),K("Risk per share",money(per)),K("Position value",money(val),"p"),
    K("Stop distance",pct(per/e*100,2),"a")],
   table:{title:"How many losing trades you can absorb",cols:["Consecutive losses","Capital left","Drawdown"],
    rows:[1,3,5,10].map(n=>[n,money(cap-rk*n),pct(rk*n/cap*100,1)])},
   formula:F("Quantity = (capital x risk%) / (entry - stop)",
     "  = ("+inr(cap)+" x "+N(s.risk)+"%) / "+num(per,2)+" = "+inr(qty)+" shares",
     capped<qty?"Trimmed to "+inr(capped)+" by the "+N(s.maxpos)+"% maximum position limit.":""),
   notes:["Risking 1-2% per trade is the convention that lets you survive a run of losses long enough for an edge to show.",
    "The stop distance decides the size - a wider stop means fewer shares, not more risk."]}}});

add({id:"riskreward",cat:MKT,name:"Risk-reward & win rate",tags:"risk reward ratio target stop expectancy break even win rate",
 blurb:"The reward-to-risk on a trade, and the win rate it needs to be profitable over many trades.",
 inputs:[M("entry","Entry",500,0.05,1000000,0.05),M("stop","Stop loss",480,0.05,1000000,0.05),
  M("target","Target",560,0.05,1000000,0.05),U("qty","Quantity",100,1,1000000,1,"shares"),
  P("win","Your win rate",45,1,99,1)],
 run(s){const e=N(s.entry),st=N(s.stop),t=N(s.target),q=N(s.qty),w=N(s.win)/100;
  const risk=Math.abs(e-st)*q,rew=Math.abs(t-e)*q,rr=risk>0?rew/risk:0;
  const exp=w*rew-(1-w)*risk, need=rr>0?1/(1+rr)*100:100;
  return{hero:{label:"Reward to risk",value:num(rr,2)+" : 1",sub:"Risking "+money(risk)+" to make "+money(rew)},
   kpis:[K("Expectancy per trade",money(exp),exp>=0?"g":"r"),K("Break-even win rate",pct(need,1),"p"),
    K("Your edge",pct((w*100-need),1),w*100>=need?"g":"r"),K("Over 100 trades",money(exp*100),exp>=0?"g":"r")],
   chart:{title:"Expectancy at different win rates",labels:["20%","30%","40%","50%","60%","70%"],
    series:[{name:"Per trade",color:C.ret,values:[.2,.3,.4,.5,.6,.7].map(x=>x*rew-(1-x)*risk)}]},
   formula:F("Reward:risk = (target - entry) / (entry - stop) = "+num(rr,3),
     "Break-even win rate = 1 / (1 + R:R) = "+pct(need,2),
     "Expectancy = win% x reward - loss% x risk = "+money(exp)),
   notes:["A 2:1 trade only needs to work one time in three. That is why professionals chase the ratio, not the hit rate."]}}});

add({id:"avgprice",cat:MKT,name:"Average price & averaging down",tags:"average cost basis add more shares breakeven",
 blurb:"Blended cost after adding to a position, and the price you need to get back to even.",
 inputs:[M("p1","First buy price",1000,0.05,1000000,0.05),U("q1","Quantity",100,1,1000000,1,"shares"),
  M("p2","Second buy price",800,0.05,1000000,0.05),U("q2","Quantity",100,0,1000000,1,"shares"),
  M("p3","Third buy price",0,0,1000000,0.05),U("q3","Quantity",0,0,1000000,1,"shares"),
  M("cmp","Current market price",850,0.05,1000000,0.05)],
 run(s){const L=[[N(s.p1),N(s.q1)],[N(s.p2),N(s.q2)],[N(s.p3),N(s.q3)]].filter(x=>x[0]>0&&x[1]>0);
  const q=L.reduce((a,x)=>a+x[1],0),cost=L.reduce((a,x)=>a+x[0]*x[1],0),avg=q?cost/q:0;
  const cmp=N(s.cmp),val=cmp*q,pl=val-cost;
  return{hero:{label:"Average cost",value:money(avg),sub:pl>=0?"Currently up "+money(pl):"Currently down "+money(-pl)+" - needs "+pct((avg/cmp-1)*100,2)+" to break even"},
   kpis:[K("Total shares",inr(q)),K("Invested",money(cost)),K("Market value",money(val),pl>=0?"g":"r"),
    K("Unrealised P&L",money(pl),pl>=0?"g":"r")],
   table:{title:"Lots",cols:["Lot","Price","Quantity","Value","Weight"],
    rows:L.map((x,i)=>["Buy "+(i+1),money(x[0]),inr(x[1]),money(x[0]*x[1]),pct(x[1]/q*100,1)]),
    foot:["Average",money(avg),inr(q),money(cost),"100%"]},
   formula:"Average = total cost / total quantity = "+inr(cost)+" / "+inr(q)+" = "+money(avg),
   notes:["Averaging down lowers the cost but raises the stake in a position that is already going against you. Do it on conviction about the business, never to feel better about the loss."]}}});

add({id:"pnl",cat:MKT,name:"Profit & loss target",tags:"pnl profit target percentage gain stock return",
 blurb:"Profit at any exit price, and the exit price needed for a target return.",
 inputs:[M("buy","Buy price",500,0.05,1000000,0.05),U("qty","Quantity",100,1,1000000,1,"shares"),
  M("sell","Sell price",575,0.05,1000000,0.05),P("targ","Target return",25,1,500,1)],
 run(s){const b=N(s.buy),q=N(s.qty),sl=N(s.sell),inv=b*q,pl=(sl-b)*q;
  const need=b*(1+N(s.targ)/100);
  return{hero:{label:pl>=0?"Profit":"Loss",value:money(pl),sub:pct((sl/b-1)*100,2)+" on "+money(inv)+" invested"},
   kpis:[K("Invested",money(inv)),K("Exit value",money(sl*q)),K("For "+N(s.targ)+"% sell at",money(need),"p"),
    K("Loss recovery needed",pl<0?pct((b/sl-1)*100,2):"--","r")],
   table:{title:"P&L at different exits",cols:["Exit price","Change","P&L"],
    rows:[-20,-10,-5,0,5,10,20,50].map(x=>[money(b*(1+x/100)),pct(x,0),money(b*x/100*q)])},
   formula:"P&L = (sell - buy) x quantity = ("+num(sl,2)+" - "+num(b,2)+") x "+inr(q)+" = "+money(pl),
   notes:["A 50% fall needs a 100% rise to recover. Losses are asymmetric, which is the whole argument for stop-losses."]}}});

add({id:"margin",cat:MKT,name:"Leverage & margin",tags:"margin leverage mtm mark to market intraday exposure margin call",
 blurb:"What leverage does to a position - both directions - and the move that wipes out your margin.",
 inputs:[M("cap","Margin you put up",100000,1000,100000000,1000),U("lev","Leverage",5,1,50,0.5,"x"),
  M("price","Entry price",500,0.05,1000000,0.05),P("move","Price move",2,-50,50,0.5)],
 run(s){const cap=N(s.cap),lv=N(s.lev),exp=cap*lv,q=Math.floor(exp/N(s.price));
  const mv=N(s.move)/100,pl=exp*mv,ret=pl/cap*100,wipe=100/lv;
  return{hero:{label:"P&L on a "+N(s.move)+"% move",value:money(pl),sub:pct(ret,1)+" on your margin of "+money(cap)},
   kpis:[K("Exposure",money(exp),"p"),K("Shares controlled",inr(q)),K("Margin wiped out at",pct(-wipe,2),"r"),
    K("Return multiplier",num(lv,1)+"x","a")],
   chart:{title:"Return on margin at different price moves",labels:["-10%","-5%","-2%","0","2%","5%","10%"],
    series:[{name:"Return on margin",color:C.ret,values:[-10,-5,-2,0,2,5,10].map(x=>cap*lv*x/100),type:"line"}]},
   formula:F("Exposure = margin x leverage = "+money(exp),
     "P&L = exposure x price move = "+money(pl),
     "A "+num(wipe,2)+"% adverse move erases the entire margin at "+num(lv,1)+"x."),
   warn:lv>=10?"At "+num(lv,1)+"x, a "+num(wipe,2)+"% move against you costs your whole margin - and intraday positions get squared off automatically before that.":null,
   notes:["Leverage magnifies the outcome, not the edge. It shortens the time you have to be right."]}}});

add({id:"optionbe",cat:MKT,name:"Option breakeven & payoff",tags:"call put breakeven strike premium payoff buyer seller",
 blurb:"Breakeven, maximum profit and maximum loss for a single call or put, on either side of the trade.",
 inputs:[G("type","Option","call",[["call","Call"],["put","Put"]]),
  G("side","You are the","buy",[["buy","Buyer"],["sell","Seller"]]),
  M("strike","Strike price",25000,1,1000000,50),M("prem","Premium",180,0.05,100000,0.05),
  U("lot","Lot size",75,1,10000,1,"units"),U("lots","Number of lots",1,1,1000,1,"lots"),
  M("spot","Expected spot at expiry",25600,1,1000000,50)],
 run(s){const K2=N(s.strike),pr=N(s.prem),q=N(s.lot)*N(s.lots),isC=s.type==="call",buy=s.side==="buy";
  const be=isC?K2+pr:K2-pr;
  const intr=x=>Math.max(isC?x-K2:K2-x,0);
  const pl=(buy?1:-1)*(intr(N(s.spot))-pr)*q;
  const pts=[];for(let i=-10;i<=10;i++){const sp=K2*(1+i*0.01);pts.push({x:sp,y:(buy?1:-1)*(intr(sp)-pr)*q});}
  return{hero:{label:pl>=0?"Profit at expiry":"Loss at expiry",value:money(pl),sub:"Breakeven at "+money(be)+" on the spot"},
   kpis:[K("Premium paid/received",money(pr*q),buy?"a":"g"),K("Breakeven",money(be),"p"),
    K("Maximum profit",buy?(isC?"Unlimited":money((K2-pr)*q)):money(pr*q),"g"),
    K("Maximum loss",buy?money(pr*q):(isC?"Unlimited":money((K2-pr)*q)),"r")],
   chart:{title:"Payoff at expiry",labels:pts.map(p=>inr(Math.round(p.x))),
    series:[{name:"P&L",color:C.ret,values:pts.map(p=>p.y),type:"line"}],yfmt:v=>shortI(v)},
   table:{title:"Payoff table",cols:["Spot at expiry","Intrinsic value","P&L"],
    rows:pts.filter((_,i)=>i%2===0).map(p=>[money(p.x),money(intr(p.x)),money(p.y)])},
   formula:F("Breakeven = strike "+(isC?"+":"-")+" premium = "+money(be),
     "P&L = "+(buy?"":"minus ")+"(intrinsic value at expiry - premium) x quantity",
     "Quantity = "+N(s.lot)+" x "+N(s.lots)+" = "+inr(q)+" units"),
   warn:!buy?"Selling options carries theoretically unlimited risk on the call side and requires large margins. The premium received is the maximum you can make.":null,
   notes:["This is the expiry payoff only. Before expiry, time value and volatility move the price too, which this ignores.",
    "Roughly three of four bought options expire worthless. The odds favour the seller, the risk profile does not."]}}});

add({id:"optionsprd",cat:MKT,name:"Option spread payoff",tags:"bull call spread bear put vertical spread max profit",
 blurb:"A two-leg vertical spread - buy one strike, sell another - with capped profit and capped loss.",
 inputs:[G("type","Spread","bull",[["bull","Bull call"],["bear","Bear put"]]),
  M("k1","Strike you buy",25000,1,1000000,50),M("p1","Premium paid",250,0.05,100000,0.05),
  M("k2","Strike you sell",25500,1,1000000,50),M("p2","Premium received",120,0.05,100000,0.05),
  U("lot","Lot size",75,1,10000,1,"units"),U("lots","Lots",1,1,1000,1,"lots"),
  M("spot","Spot at expiry",25600,1,1000000,50)],
 run(s){const q=N(s.lot)*N(s.lots),net=N(s.p1)-N(s.p2),bull=s.type==="bull";
  const k1=N(s.k1),k2=N(s.k2),w=Math.abs(k2-k1);
  const maxP=(w-net)*q,maxL=net*q,be=bull?k1+net:k1-net;
  const pay=x=>{const v=bull?Math.min(Math.max(x-k1,0),w):Math.min(Math.max(k1-x,0),w);return (v-net)*q;};
  const pts=[];for(let i=-8;i<=8;i++){const sp=k1*(1+i*0.01);pts.push([sp,pay(sp)]);}
  return{hero:{label:"P&L at expiry",value:money(pay(N(s.spot))),sub:"Breakeven "+money(be)+", risk capped at "+money(maxL)},
   kpis:[K("Net premium paid",money(maxL),"a"),K("Maximum profit",money(maxP),"g"),
    K("Reward to risk",num(maxP/maxL,2)+":1","p"),K("Breakeven",money(be))],
   chart:{title:"Payoff at expiry",labels:pts.map(p=>inr(Math.round(p[0]))),
    series:[{name:"P&L",color:C.ret,values:pts.map(p=>p[1]),type:"line"}],yfmt:v=>shortI(v)},
   formula:F("Net debit = "+num(N(s.p1),2)+" - "+num(N(s.p2),2)+" = "+num(net,2)+" per unit",
     "Max profit = (strike width - net debit) x qty = ("+num(w,2)+" - "+num(net,2)+") x "+inr(q)+" = "+money(maxP),
     "Max loss = net debit x qty = "+money(maxL)),
   notes:["Selling the far leg funds part of the bought leg, which lowers both the cost and the ceiling. Margin needs are far smaller than a naked sell."]}}});

add({id:"pe",cat:MKT,name:"P/E, EPS & fair value",tags:"price earnings ratio eps valuation multiple peg",
 blurb:"Earnings per share, the multiple the market is paying, and what the price implies at a different multiple.",
 inputs:[M("np","Net profit",5000000000,1000,1e13,100000),U("sh","Shares outstanding",100000000,1000,1e11,1000,"shares"),
  M("px","Current share price",250,0.05,1000000,0.5),U("fpe","Fair P/E you would pay",20,1,200,0.5,"x"),
  P("gr","Expected earnings growth",15,0,60,0.5)],
 run(s){const eps=N(s.np)/N(s.sh),px=N(s.px),pe=eps>0?px/eps:0;
  const fair=eps*N(s.fpe),peg=N(s.gr)>0?pe/N(s.gr):0,mc=px*N(s.sh),ey=eps/px*100;
  return{hero:{label:"Price to earnings",value:num(pe,2)+"x",sub:"EPS "+money(eps)+" against a price of "+money(px)},
   kpis:[K("EPS",money(eps)),K("Fair value at "+N(s.fpe)+"x",money(fair),fair>=px?"g":"r"),
    K("Upside / downside",pct((fair/px-1)*100,1),fair>=px?"g":"r"),K("PEG ratio",num(peg,2),peg<1?"g":"a")],
   kpis2:null,
   table:{title:"Value at different multiples",cols:["P/E","Implied price","Against today"],
    rows:[10,15,20,25,30,40].map(m=>[m+"x",money(eps*m),pct((eps*m/px-1)*100,1)])},
   formula:F("EPS = net profit / shares = "+inr(N(s.np))+" / "+inr(N(s.sh))+" = "+money(eps),
     "P/E = price / EPS = "+num(pe,3)+"x     Earnings yield = "+pct(ey,2),
     "PEG = P/E / growth% = "+num(peg,2)+" - under 1 is the classic Lynch screen"),
   notes:["A P/E only means something against the same company's history and its close peers. Cross-sector comparisons are noise.",
    "Market cap here works out to "+shortI(mc)+"."]}}});

add({id:"marketcap",cat:MKT,name:"Market cap & enterprise value",tags:"market capitalisation ev free float large mid small cap",
 blurb:"Market cap, enterprise value and where the company sits on the SEBI size classification.",
 inputs:[M("px","Share price",250,0.05,1000000,0.5),U("sh","Shares outstanding",100000000,1000,1e11,1000,"shares"),
  M("debt","Total debt",2000000000,0,1e13,100000),M("cash","Cash & investments",800000000,0,1e13,100000),
  P("ff","Free float",45,1,100,1)],
 run(s){const mc=N(s.px)*N(s.sh),ev=mc+N(s.debt)-N(s.cash),ffmc=mc*N(s.ff)/100;
  const band=mc>=2e11?"Large cap territory":mc>=5e10?"Mid cap territory":"Small cap territory";
  return{hero:{label:"Market capitalisation",value:shortI(mc),sub:band+" - SEBI ranks the top 100 as large, 101-250 as mid, the rest small"},
   kpis:[K("Enterprise value",shortI(ev),"p"),K("Free float market cap",shortI(ffmc)),
    K("Net debt",shortI(N(s.debt)-N(s.cash)),N(s.debt)>N(s.cash)?"a":"g"),K("EV / market cap",num(ev/mc,2)+"x")],
   donut:[{label:"Market cap",value:mc,color:C.inv,fmt:shortI(mc)},{label:"Net debt",value:Math.max(N(s.debt)-N(s.cash),0),color:C.tax,fmt:shortI(Math.max(N(s.debt)-N(s.cash),0))}],
   donutTop:"Enterprise value",donutBot:shortI(ev),
   formula:F("Market cap = price x shares = "+money(N(s.px))+" x "+inr(N(s.sh))+" = "+shortI(mc),
     "Enterprise value = market cap + debt - cash = "+shortI(ev)),
   notes:["Index weights use free-float market cap, not full market cap, which is why a promoter-heavy company carries less index weight than its size suggests."]}}});

add({id:"pbv",cat:MKT,name:"Book value & P/B",tags:"price to book value net worth per share banks valuation",
 blurb:"Book value per share and the price-to-book multiple - the ratio that matters most for banks and financials.",
 inputs:[M("eq","Shareholders equity / net worth",50000000000,1000,1e13,1000000),
  U("sh","Shares outstanding",100000000,1000,1e11,1000,"shares"),M("px","Share price",600,0.05,1000000,0.5),
  P("roe","Return on equity",15,0,60,0.5)],
 run(s){const bv=N(s.eq)/N(s.sh),pb=N(s.px)/bv,fairPb=N(s.roe)/12;
  return{hero:{label:"Price to book",value:num(pb,2)+"x",sub:"Book value per share "+money(bv)},
   kpis:[K("Book value/share",money(bv)),K("Implied fair P/B at "+N(s.roe)+"% ROE",num(fairPb,2)+"x","p"),
    K("Premium to book",pct((pb-1)*100,0),pb>1?"a":"g"),K("Fair price",money(bv*fairPb),bv*fairPb>=N(s.px)?"g":"r")],
   table:{title:"Price at different multiples",cols:["P/B","Implied price"],rows:[0.5,1,1.5,2,3,4].map(m=>[m+"x",money(bv*m)])},
   formula:F("Book value per share = equity / shares = "+shortI(N(s.eq))+" / "+inr(N(s.sh))+" = "+money(bv),
     "P/B = price / book value = "+num(pb,3)+"x",
     "A rough fair P/B is ROE divided by the cost of equity (12% used here)."),
   notes:["P/B is most useful where assets are the business - banks, NBFCs, insurers. It says little about an asset-light software or consumer company."]}}});

add({id:"roe",cat:MKT,name:"ROE, ROCE & DuPont",tags:"return on equity capital employed dupont margin asset turnover leverage",
 blurb:"Return on equity broken into its three drivers, plus return on capital employed.",
 inputs:[M("np","Net profit",5000000000,-1e12,1e13,100000),M("sales","Revenue",40000000000,1,1e13,100000),
  M("assets","Total assets",60000000000,1,1e13,100000),M("eq","Shareholders equity",25000000000,1,1e13,100000),
  M("ebit","EBIT",8000000000,-1e12,1e13,100000),M("debt","Total debt",10000000000,0,1e13,100000)],
 run(s){const np=N(s.np),sa=N(s.sales),as=N(s.assets),eq=N(s.eq);
  const nm=np/sa*100,at=sa/as,lev=as/eq,roe=nm/100*at*lev*100;
  const roce=N(s.ebit)/(eq+N(s.debt))*100,roa=np/as*100;
  return{hero:{label:"Return on equity",value:pct(roe,2),sub:pct(nm,1)+" margin x "+num(at,2)+" turnover x "+num(lev,2)+" leverage"},
   kpis:[K("Net margin",pct(nm,2),"g"),K("Asset turnover",num(at,2)+"x"),K("Leverage",num(lev,2)+"x",lev>3?"r":"a"),
    K("ROCE",pct(roce,2),roce>15?"g":"a")],
   chart:{title:"DuPont drivers",labels:["Net margin %","Asset turnover x10","Leverage x10","ROE %"],
    series:[{name:"Value",color:C.ret,values:[nm,at*10,lev*10,roe]}],yfmt:v=>num(v,1)},
   formula:F("ROE = net margin x asset turnover x equity multiplier",
     "    = "+pct(nm,2)+" x "+num(at,3)+" x "+num(lev,3)+" = "+pct(roe,2),
     "ROCE = EBIT / (equity + debt) = "+pct(roce,2)+"     ROA = "+pct(roa,2)),
   notes:["A high ROE built on leverage is fragile. Check whether the third term is doing the work - that is exactly what DuPont is for.",
    "ROCE above the cost of capital, sustained for years, is the single best marker of a quality business."]}}});

add({id:"dcf",cat:MKT,name:"Intrinsic value (DCF)",tags:"discounted cash flow valuation terminal value wacc fair value",
 blurb:"A two-stage discounted cash flow - high growth for a decade, then a terminal value - with a margin of safety.",
 inputs:[M("fcf","Free cash flow, latest year",5000000000,1,1e13,1000000),
  P("g1","Growth for the first 10 years",12,0,40,0.5),P("g2","Growth after that",4,0,8,0.25),
  P("disc","Discount rate",12,6,25,0.5),U("sh","Shares outstanding",100000000,1000,1e11,1000,"shares"),
  M("net","Cash minus debt",0,-1e13,1e13,1000000),M("px","Current price",250,0.05,1000000,0.5),
  P("mos","Margin of safety",25,0,60,5)],
 run(s){const f=N(s.fcf),g1=N(s.g1)/100,g2=N(s.g2)/100,d=N(s.disc)/100;
  let pv=0,cf=f;const rows=[],L=[],A=[];
  for(let y=1;y<=10;y++){cf=cf*(1+g1);const p=cf/pow(1+d,y);pv+=p;rows.push([y,shortI(cf),shortI(p)]);L.push("Y"+y);A.push(p);}
  const tv=d>g2?cf*(1+g2)/(d-g2):0,tvpv=tv/pow(1+d,10);
  const ev=pv+tvpv,eqv=ev+N(s.net),ips=eqv/N(s.sh),buy=ips*(1-N(s.mos)/100);
  return{hero:{label:"Intrinsic value per share",value:money(ips),
    sub:"Buy below "+money(buy)+" for a "+N(s.mos)+"% margin of safety"},
   kpis:[K("PV of 10 years",shortI(pv)),K("PV of terminal value",shortI(tvpv),"p"),
    K("Upside from "+money(N(s.px)),pct((ips/N(s.px)-1)*100,1),ips>=N(s.px)?"g":"r"),
    K("Terminal share of value",pct(tvpv/ev*100,0),tvpv/ev>0.7?"a":"g")],
   chart:{title:"Discounted cash flows by year",labels:L,series:[{name:"Present value",color:C.ret,values:A}]},
   table:{title:"Projection",cols:["Year","Free cash flow","Discounted"],rows,foot:["Terminal value","",shortI(tvpv)]},
   formula:F("Value = sum of FCF_t / (1+d)^t  +  terminal value / (1+d)^10",
     "Terminal value = FCF_10 x (1 + "+N(s.g2)+"%) / ("+N(s.disc)+"% - "+N(s.g2)+"%) = "+shortI(tv)),
   warn:tvpv/ev>0.75?"More than three quarters of the value sits in the terminal assumption. Small changes to it swing the answer wildly - treat the output as a range, not a number.":null,
   notes:["A DCF is a thinking tool, not a price target. Change the discount rate by 1% and the answer moves 15-20%.",
    "The terminal growth rate should never exceed long-run nominal GDP growth - roughly 5-6% for India."]}}});

add({id:"graham",cat:MKT,name:"Graham number & net-net",tags:"benjamin graham intrinsic value defensive investor 22.5 formula",
 blurb:"Benjamin Graham's two quick screens - the Graham number and his revised growth formula.",
 inputs:[M("eps","Earnings per share",25,-1000,100000,0.5),M("bv","Book value per share",120,0,100000,1),
  M("px","Current price",400,0.05,1000000,0.5),P("g","Expected growth",10,0,30,0.5),
  P("y","AAA corporate bond yield",7.5,3,15,0.1)],
 run(s){const e=N(s.eps),b=N(s.bv);
  const gn=e>0&&b>0?Math.sqrt(22.5*e*b):0;
  const rev=e*(8.5+2*N(s.g))*4.4/N(s.y);
  const px=N(s.px);
  return{hero:{label:"Graham number",value:money(gn),sub:gn>px?"Price is below it - the screen passes":"Price is above it - the screen fails"},
   kpis:[K("Revised Graham formula",money(rev),rev>px?"g":"r"),K("Current price",money(px)),
    K("Margin to Graham number",pct((gn/px-1)*100,1),gn>px?"g":"r"),K("P/E",num(e>0?px/e:0,2)+"x")],
   formula:F("Graham number = sqrt(22.5 x EPS x book value) = sqrt(22.5 x "+num(e,2)+" x "+num(b,2)+") = "+money(gn),
     "  22.5 comes from his limits of P/E 15 and P/B 1.5",
     "Revised formula = EPS x (8.5 + 2g) x 4.4 / bond yield = "+money(rev)),
   notes:["These screens were built for 1930s industrial companies with heavy assets. They systematically undervalue asset-light modern businesses.",
    "Use them as a filter to find candidates, never as the final word on price."]}}});

add({id:"ddm",cat:MKT,name:"Dividend discount model",tags:"gordon growth model dividend valuation required return",
 blurb:"Gordon growth valuation - what a stream of growing dividends is worth today.",
 inputs:[M("d","Dividend per share, latest",12,0.01,100000,0.5),P("g","Dividend growth rate",8,0,20,0.25),
  P("r","Your required return",13,1,40,0.25),M("px","Current price",250,0.05,1000000,0.5)],
 run(s){const d=N(s.d),g=N(s.g)/100,r=N(s.r)/100;
  const v=r>g?d*(1+g)/(r-g):0,impG=(r-d*(1+g)/N(s.px))*100;
  return{hero:{label:"Value per share",value:r>g?money(v):"Not defined",
    sub:r>g?(v>N(s.px)?"Above the market price - undervalued on this model":"Below the market price - overvalued on this model"):"Growth must be below the required return"},
   kpis:[K("Next year's dividend",money(d*(1+g))),K("Dividend yield",pct(d/N(s.px)*100,2),"g"),
    K("Upside",pct(r>g?(v/N(s.px)-1)*100:0,1),v>N(s.px)?"g":"r"),K("Growth the price implies",pct(impG,2),"p")],
   table:{title:"Sensitivity to the growth rate",cols:["Growth","Value"],
    rows:[g*100-2,g*100-1,g*100,g*100+1,g*100+2].map(x=>[pct(x,1),r*100>x?money(d*(1+x/100)/(r-x/100)):"--"])},
   formula:"V = D1 / (r - g) = "+money(d*(1+g))+" / ("+pct(r*100,2)+" - "+pct(g*100,2)+") = "+money(v),
   notes:["Only works for mature, steadily paying companies - utilities, large FMCG, some PSUs. Useless for anything that reinvests everything."]}}});

add({id:"capm",cat:MKT,name:"CAPM expected return",tags:"beta capital asset pricing model risk premium cost of equity alpha",
 blurb:"The return a stock should give for the risk it carries, and whether it actually delivered.",
 inputs:[P("rf","Risk-free rate",6.8,3,12,0.1,{hint:"10-year government bond yield"}),
  U("beta","Beta",1.2,-1,3,0.05,"x"),P("mkt","Expected market return",13,5,25,0.5),
  P("act","Actual return delivered",16,-50,100,0.5)],
 run(s){const rf=N(s.rf),b=N(s.beta),m=N(s.mkt);
  const er=rf+b*(m-rf),alpha=N(s.act)-er;
  return{hero:{label:"Expected return",value:pct(er,2),sub:"Risk premium of "+pct(b*(m-rf),2)+" over the risk-free rate"},
   kpis:[K("Equity risk premium",pct(m-rf,2)),K("Beta contribution",pct(b*(m-rf),2),"p"),
    K("Alpha",pct(alpha,2),alpha>=0?"g":"r"),K("Risk vs market",b>1?"More volatile":"Less volatile",b>1?"a":"g")],
   chart:{title:"Expected return at different betas",labels:["0.5","0.8","1.0","1.2","1.5","2.0"],
    series:[{name:"Expected return %",color:C.ret,values:[.5,.8,1,1.2,1.5,2].map(x=>rf+x*(m-rf)),type:"line"}],yfmt:v=>num(v,1)+"%"},
   formula:"E(R) = Rf + beta x (Rm - Rf) = "+pct(rf,2)+" + "+num(b,2)+" x "+pct(m-rf,2)+" = "+pct(er,2),
   notes:["Beta measures how much a stock moves with the index, not how risky the business is. A stable monopoly can have a high beta and a fragile company a low one."]}}});

add({id:"sharpe",cat:MKT,name:"Sharpe & Sortino ratio",tags:"risk adjusted return sharpe sortino volatility fund comparison",
 blurb:"Return per unit of risk - the standard way to tell a good fund from a lucky one.",
 inputs:[P("ret","Portfolio return",15,-30,60,0.25),P("rf","Risk-free rate",6.8,0,12,0.1),
  P("sd","Standard deviation",18,0.5,60,0.25),P("dd","Downside deviation",11,0.5,60,0.25)],
 run(s){const sh=(N(s.ret)-N(s.rf))/N(s.sd),so=(N(s.ret)-N(s.rf))/N(s.dd);
  const rate=sh>=2?"Excellent":sh>=1?"Good":sh>=0.5?"Acceptable":"Poor";
  return{hero:{label:"Sharpe ratio",value:num(sh,2),sub:rate+" risk-adjusted return"},
   kpis:[K("Sortino ratio",num(so,2),so>=1?"g":"a"),K("Excess return",pct(N(s.ret)-N(s.rf),2),"g"),
    K("Risk taken",pct(N(s.sd),2),"a"),K("Return per unit of risk",num(N(s.ret)/N(s.sd),2),"p")],
   formula:F("Sharpe = (return - risk free) / standard deviation = "+num(sh,3),
     "Sortino uses only downside deviation, so upside volatility is not penalised = "+num(so,3)),
   notes:["Compare Sharpe only between funds of the same category and over the same period. Across categories it misleads.",
    "A Sharpe above 1 over a full market cycle is genuinely good; above 2 usually means a short measurement window."]}}});

add({id:"volatility",cat:MKT,name:"Volatility & expected range",tags:"standard deviation annualised volatility daily sigma range",
 blurb:"Convert daily volatility to annual, and see the range a price is likely to stay within.",
 inputs:[M("px","Current price",25000,0.05,10000000,10),P("dv","Daily volatility",0.9,0.05,10,0.05),
  U("days","Days ahead",30,1,365,1,"days")],
 run(s){const px=N(s.px),dv=N(s.dv)/100;
  const ann=dv*Math.sqrt(252)*100,per=dv*Math.sqrt(N(s.days));
  return{hero:{label:"Annualised volatility",value:pct(ann,2),sub:"From a daily volatility of "+pct(N(s.dv),2)},
   kpis:[K("Move over "+N(s.days)+" days",pct(per*100,2),"p"),K("1 sigma range",money(px*(1-per))+" - "+money(px*(1+per))),
    K("2 sigma range",money(px*(1-2*per))+" - "+money(px*(1+2*per)),"a"),K("Daily expected move",money(px*dv))],
   table:{title:"Probability bands",cols:["Band","Chance of staying inside","Range"],
    rows:[["1 sigma","about 68%",money(px*(1-per))+" - "+money(px*(1+per))],
     ["2 sigma","about 95%",money(px*(1-2*per))+" - "+money(px*(1+2*per))],
     ["3 sigma","about 99.7%",money(px*(1-3*per))+" - "+money(px*(1+3*per))]]},
   formula:F("Annual volatility = daily x sqrt(252 trading days) = "+pct(N(s.dv),2)+" x 15.87 = "+pct(ann,2),
     "Over n days = daily x sqrt(n) = "+pct(per*100,2)),
   notes:["Markets have fatter tails than the normal distribution assumes, so 3-sigma days happen far more often than once in three years."]}}});

add({id:"drawdown",cat:MKT,name:"Drawdown & recovery",tags:"drawdown recovery loss percentage break even fall",
 blurb:"The gain needed to climb back from a fall, and how long that takes at a given return.",
 inputs:[M("peak","Peak value",1000000,100,1e10,1000),M("now","Current value",650000,1,1e10,1000),
  P("ret","Expected return from here",12,1,40,0.5)],
 run(s){const pk=N(s.peak),nw=N(s.now);
  const dd=(1-nw/pk)*100,rec=(pk/nw-1)*100,yrs=Math.log(pk/nw)/Math.log(1+N(s.ret)/100);
  return{hero:{label:"Drawdown",value:pct(dd,2),sub:"Needs a "+pct(rec,2)+" gain to get back to the peak"},
   kpis:[K("Amount lost",money(pk-nw),"r"),K("Gain needed",pct(rec,1),"a"),
    K("Years to recover",num(yrs,1),"p"),K("Value now",money(nw))],
   chart:{title:"Recovery needed at different drawdowns",labels:["10%","20%","30%","40%","50%","60%","70%"],
    series:[{name:"Gain needed %",color:C.tax,values:[10,20,30,40,50,60,70].map(x=>100/(1-x/100)-100),type:"line"}],yfmt:v=>num(v,0)+"%"},
   formula:F("Recovery = 1/(1 - drawdown) - 1 = 1/(1 - "+num(dd/100,4)+") - 1 = "+pct(rec,2),
     "Years = ln(peak/current) / ln(1 + return) = "+num(yrs,2)),
   notes:["The asymmetry is brutal: -50% needs +100%, -70% needs +233%. Avoiding deep losses matters more than catching big gains.",
    "Indian equity indices have had 50%+ drawdowns in 2000 and 2008, and 35-40% falls several times since."]}}});

add({id:"split",cat:MKT,name:"Split, bonus & rights",tags:"stock split bonus issue rights issue adjusted price ex date",
 blurb:"Adjusted holding and cost after a split, a bonus, or a rights issue.",
 inputs:[G("act","Corporate action","bonus",[["split","Split"],["bonus","Bonus"],["rights","Rights"]]),
  U("qty","Shares held",100,1,10000000,1,"shares"),M("cost","Average cost",1000,0.05,1000000,0.5),
  M("px","Market price before",1200,0.05,1000000,0.5),
  U("a","Ratio - you get",1,1,20,1,"new"),U("b","Ratio - for every",1,1,20,1,"held"),
  M("rp","Rights issue price",600,0.05,1000000,0.5)],
 run(s){const q=N(s.qty),c=N(s.cost),px=N(s.px),a=N(s.a),b=N(s.b);
  let nq,nc,npx,extra=0;
  if(s.act==="split"){nq=q*a/b;nc=c*b/a;npx=px*b/a;}
  else if(s.act==="bonus"){nq=q*(1+a/b);nc=c*q/nq;npx=px*q/nq;}
  else{const nr=q*a/b;extra=nr*N(s.rp);nq=q+nr;nc=(q*c+extra)/nq;npx=(q*px+extra)/nq;}
  return{hero:{label:"After the action",value:inr(Math.floor(nq))+" shares",sub:"Average cost becomes "+money(nc)+", price adjusts to about "+money(npx)},
   kpis:[K("Shares before",inr(q)),K("Shares after",inr(Math.floor(nq)),"g"),
    K("New average cost",money(nc),"p"),K(s.act==="rights"?"Cash to pay":"Value unchanged",s.act==="rights"?money(extra):money(q*px),s.act==="rights"?"a":"g")],
   table:{title:"Before and after",cols:["Line","Before","After"],
    rows:[["Shares",inr(q),inr(Math.floor(nq))],["Average cost",money(c),money(nc)],
     ["Market price",money(px),money(npx)],["Holding value",money(q*px),money(nq*npx)]]},
   formula:s.act==="rights"?"New average = (old value + rights subscription) / total shares"
     :"Total value is unchanged - only the number of shares and the per-share figures move.",
   notes:["A split or bonus creates no wealth. It only changes the unit of measurement, which helps liquidity and nothing else.",
    "For capital gains, the holding period of bonus shares runs from the date they were allotted, with a cost of zero."]}}});

add({id:"rebalance",cat:MKT,name:"Portfolio rebalancing",tags:"asset allocation rebalance equity debt gold drift target weights",
 blurb:"How far your allocation has drifted from target, and exactly what to buy and sell to fix it.",
 inputs:[M("eq","Equity value",700000,0,1e10,10000),M("dt","Debt value",200000,0,1e10,10000),
  M("gd","Gold value",100000,0,1e10,10000),M("cash","New money to add",0,0,1e10,10000),
  P("teq","Target equity",60,0,100,5),P("tdt","Target debt",30,0,100,5),P("tgd","Target gold",10,0,100,5)],
 run(s){const v=[N(s.eq),N(s.dt),N(s.gd)],tot=v.reduce((a,b)=>a+b,0)+N(s.cash);
  const tw=[N(s.teq),N(s.tdt),N(s.tgd)],tsum=tw.reduce((a,b)=>a+b,0)||100;
  const names=["Equity","Debt","Gold"];
  const rows=names.map((n,i)=>{const tgt=tot*tw[i]/tsum,act=v[i]/ (tot||1)*100,d=tgt-v[i];
    return [n,money(v[i]),pct(act,1),pct(tw[i]/tsum*100,1),money(tgt),(d>=0?"Buy ":"Sell ")+money(Math.abs(d))];});
  const maxDrift=Math.max(...names.map((_,i)=>Math.abs(v[i]/(tot||1)*100-tw[i]/tsum*100)));
  return{hero:{label:"Largest drift from target",value:pct(maxDrift,1),
    sub:maxDrift>5?"Worth rebalancing - the usual trigger is 5 percentage points":"Within tolerance, no action needed"},
   kpis:[K("Portfolio value",money(tot)),K("Equity now",pct(v[0]/(tot||1)*100,1),"p"),
    K("Debt now",pct(v[1]/(tot||1)*100,1)),K("Gold now",pct(v[2]/(tot||1)*100,1))],
   donut:names.map((n,i)=>({label:n,value:v[i],color:[C.ret,C.inv,C.tax][i],fmt:money(v[i])})),
   donutTop:"Portfolio",donutBot:shortI(tot),
   table:{title:"Action list",cols:["Asset","Current","Now %","Target %","Target value","Action"],rows},
   formula:"Target value = total portfolio x target weight. The action is the difference.",
   notes:["Rebalancing by adding new money to the underweight asset avoids capital gains tax entirely - always the first option.",
    "Rebalance on a drift band, not a calendar. Selling every year regardless of drift just generates tax and cost."]}}});

add({id:"ipo",cat:MKT,name:"IPO allotment & listing gain",tags:"ipo lot size retail hni oversubscription grey market listing",
 blurb:"Application amount, allotment odds under oversubscription, and the gain if it lists higher.",
 inputs:[M("px","Issue price",300,1,100000,1),U("lot","Lot size",50,1,10000,1,"shares"),
  U("lots","Lots applied",1,1,1000,1,"lots"),U("sub","Retail oversubscription",8,0.1,500,0.1,"times"),
  M("list","Expected listing price",380,1,1000000,1)],
 run(s){const px=N(s.px),lot=N(s.lot),lots=N(s.lots),amt=px*lot*lots;
  const sub=N(s.sub),odds=sub<=1?100:100/sub;
  const gain=(N(s.list)-px)*lot,tot=gain*(sub<=1?lots:1);
  return{hero:{label:"Application amount",value:money(amt),sub:"Blocked in your account until allotment through UPI or ASBA"},
   kpis:[K("Allotment chance",pct(odds,1),odds>50?"g":"a"),K("Gain per lot if it lists at "+money(N(s.list)),money(gain),gain>=0?"g":"r"),
    K("Return on the lot",pct((N(s.list)/px-1)*100,1),gain>=0?"g":"r"),K("Expected value",money(gain*odds/100),"p")],
   table:{title:"Outcome at different listing prices",cols:["Listing price","Change","Gain per lot"],
    rows:[-20,-10,0,10,25,50,100].map(x=>[money(px*(1+x/100)),pct(x,0),money(px*x/100*lot)])},
   formula:F("Application = issue price x lot size x lots = "+money(amt),
     "Retail applications are allotted by lottery when oversubscribed - one lot maximum per successful applicant.",
     "The retail category is capped at \u20B92 lakh per application."),
   notes:["Applying for more lots does not improve your odds in the retail category once the issue is oversubscribed - one lot per PAN is the maximum allotted.",
    "Listing gains are short-term capital gains at 20% if sold within 12 months."]}}});

add({id:"stocksip",cat:MKT,name:"Stock SIP accumulation",tags:"share accumulation monthly buy stocks rupee cost averaging units",
 blurb:"Buying a fixed rupee amount of a share every month - shares accumulated, average cost and final value.",
 inputs:[M("amt","Monthly amount",20000,500,10000000,500),M("px","Current price",500,0.05,1000000,0.5),
  P("gr","Expected price growth",14,-10,40,0.5),P("div","Dividend yield",1.5,0,15,0.1),Y("yrs","Period",10,1,30,1)],
 run(s){const a=N(s.amt),g=N(s.gr)/1200,y=N(s.yrs);let px=N(s.px),sh=0,inv=0,div=0;
  const L=[],A=[],B=[],rows=[];
  for(let k=1;k<=y;k++){for(let m=0;m<12;m++){sh+=a/px;inv+=a;div+=sh*px*N(s.div)/100/12;px*=(1+g);}
   L.push("Y"+k);A.push(inv);B.push(sh*px-inv);rows.push([k,inr(Math.floor(sh)),money(inv/sh),money(px),money(sh*px)]);}
  return{hero:{label:"Holding after "+y+" years",value:inr(Math.floor(sh))+" shares",sub:"Worth "+money(sh*px)+" against "+money(inv)+" invested"},
   kpis:[K("Average cost",money(inv/sh)),K("Price then",money(px),"p"),
    K("Capital gain",money(sh*px-inv),"g"),K("Dividends collected",money(div),"g")],
   chart:{labels:L,series:[{name:"Invested",color:C.inv,values:A},{name:"Gain",color:C.ret,values:B}]},
   table:{cols:["Year","Shares held","Average cost","Price","Value"],rows},
   formula:"Each month buys amount / price shares, so a falling price buys more - the rupee cost averaging effect.",
   notes:["A single stock has no diversification. The same discipline in an index fund carries a fraction of the risk."]}}});

add({id:"circuit",cat:MKT,name:"Circuit limits & price bands",tags:"upper lower circuit price band limit exchange freeze",
 blurb:"Upper and lower circuit prices for a stock, and the index band that halts the whole market.",
 inputs:[M("px","Previous close",500,0.05,1000000,0.5),
  S("band","Price band","10",[["2","2%"],["5","5%"],["10","10%"],["20","20%"],["0","No band (F&O stocks)"]])],
 run(s){const px=N(s.px),b=N(s.band);
  const up=px*(1+b/100),dn=px*(1-b/100);
  return{hero:{label:b?"Trading range for the day":"No individual band",
    value:b?money(dn)+" to "+money(up):"Dynamic 10% band",sub:b?"A "+b+"% band on a previous close of "+money(px):"Stocks in F&O have no fixed band, only a dynamic operating range"},
   kpis:[K("Upper circuit",money(up),"g"),K("Lower circuit",money(dn),"r"),
    K("Band width",money(up-dn)),K("Previous close",money(px))],
   table:{title:"Index-level circuit breakers",cols:["Index fall","Before 1 pm","1 pm to 2:30 pm","After 2:30 pm"],
    rows:[["10%","45 min halt","15 min halt","No halt"],["15%","1 hr 45 min halt","45 min halt","Trading stops for the day"],
     ["20%","Trading stops for the day","Trading stops for the day","Trading stops for the day"]]},
   formula:"Circuit price = previous close x (1 +/- band). Bands are set by the exchange per stock and can be revised.",
   notes:["When a stock is locked at the upper or lower circuit there is no counterparty, so you cannot exit at any price.",
    "Index circuit breakers are triggered by whichever of the Nifty 50 or Sensex breaches the level first."]}}});

/* ===================== PLAN YOUR LIFE ===================== */
const PL="Plan your life";

add({id:"emergency",cat:PL,name:"Emergency fund",tags:"contingency fund months expenses buffer job loss",
 blurb:"How large a buffer you actually need, and how long it takes to build at your current saving rate.",
 inputs:[M("exp","Monthly expenses",60000,5000,2000000,1000),M("emi","Monthly EMIs & premiums",25000,0,2000000,1000),
  U("m","Months of cover",6,3,24,1,"months"),M("have","Already set aside",100000,0,1e9,10000),
  M("save","You can save monthly",30000,0,2000000,1000)],
 run(s){const need=(N(s.exp)+N(s.emi))*N(s.m),gap=Math.max(need-N(s.have),0);
  const months=N(s.save)>0?Math.ceil(gap/N(s.save)):Infinity;
  return{hero:{label:"Emergency fund target",value:money(need),
    sub:gap>0?"You are "+money(gap)+" short - about "+months+" months of saving away":"Fully funded"},
   kpis:[K("Monthly outgo covered",money(N(s.exp)+N(s.emi))),K("Already saved",money(N(s.have)),"g"),
    K("Shortfall",money(gap),gap?"a":"g"),K("Months to fill",isFinite(months)?months:"--","p")],
   donut:[{label:"Saved",value:N(s.have),color:C.ret,fmt:money(N(s.have))},{label:"Still needed",value:gap,color:C.tax,fmt:money(gap)}],
   donutTop:"Target",donutBot:shortI(need),
   formula:"Target = (expenses + EMIs) x months of cover = "+money(N(s.exp)+N(s.emi))+" x "+N(s.m)+" = "+money(need),
   notes:["Six months is the usual advice; go to nine or twelve if you are self-employed, single-income, or in a volatile industry.",
    "Keep it in a sweep-in FD or a liquid fund - reachable the same day, not sitting in equity."]}}});

add({id:"networth",cat:PL,name:"Net worth tracker",tags:"assets liabilities net worth balance sheet personal",
 blurb:"Your personal balance sheet, with the ratios that say whether it is healthy.",
 inputs:[M("cash","Cash, savings & FDs",500000,0,1e10,10000),M("inv","Equity, mutual funds & PF",2500000,0,1e10,10000),
  M("prop","Property & land",8000000,0,1e10,100000),M("gold","Gold & other assets",600000,0,1e10,10000),
  M("home","Home loan outstanding",4000000,0,1e10,10000),M("other","Other loans & card dues",300000,0,1e10,10000),
  M("inc","Annual income",2400000,0,1e9,10000)],
 run(s){const as=[N(s.cash),N(s.inv),N(s.prop),N(s.gold)],A2=as.reduce((a,b)=>a+b,0);
  const li=N(s.home)+N(s.other),nw=A2-li;
  const liq=(N(s.cash)+N(s.inv))/(A2||1)*100,dti=li/(N(s.inc)||1);
  return{hero:{label:"Net worth",value:money(nw),sub:money(A2)+" of assets against "+money(li)+" of debt"},
   kpis:[K("Total assets",money(A2),"g"),K("Total liabilities",money(li),"a"),
    K("Liquid share of assets",pct(liq,1),liq>30?"g":"a"),K("Debt to income",num(dti,2)+"x",dti<3?"g":"r")],
   donut:[{label:"Cash & FD",value:as[0],color:C.inv,fmt:money(as[0])},{label:"Investments",value:as[1],color:C.ret,fmt:money(as[1])},
    {label:"Property",value:as[2],color:C.bal,fmt:money(as[2])},{label:"Gold & other",value:as[3],color:C.tax,fmt:money(as[3])}],
   donutTop:"Assets",donutBot:shortI(A2),
   table:{title:"Balance sheet",cols:["Line","Amount","Share"],
    rows:[["Cash, savings, FDs",money(as[0]),pct(as[0]/A2*100,1)],["Equity, funds, PF",money(as[1]),pct(as[1]/A2*100,1)],
     ["Property",money(as[2]),pct(as[2]/A2*100,1)],["Gold & other",money(as[3]),pct(as[3]/A2*100,1)],
     ["Total assets",money(A2),"100%"],["Home loan",money(-N(s.home)),""],["Other loans",money(-N(s.other)),""],
     ["Net worth",money(nw),""]]},
   notes:["Property dominating net worth is the most common Indian pattern - it looks solid but cannot be partly sold when you need cash.",
    "A rough benchmark: net worth should reach roughly age/10 times annual income by mid-career."]}}});

add({id:"budget",cat:PL,name:"50/30/20 budget",tags:"budget monthly needs wants savings rule allocation",
 blurb:"Split your take-home into needs, wants and savings - and see where yours actually goes.",
 inputs:[M("inc","Monthly take-home",100000,5000,10000000,1000),M("needs","Actual needs - rent, food, EMI, bills",55000,0,10000000,1000),
  M("wants","Actual wants - dining, travel, subscriptions",25000,0,10000000,1000),M("save","Actual savings & investments",20000,0,10000000,1000)],
 run(s){const inc=N(s.inc),ac=[N(s.needs),N(s.wants),N(s.save)];
  const tgt=[inc*.5,inc*.3,inc*.2],names=["Needs","Wants","Savings"];
  const left=inc-ac.reduce((a,b)=>a+b,0);
  const rows=names.map((n,i)=>[n,money(tgt[i]),money(ac[i]),pct(ac[i]/inc*100,1),(ac[i]-tgt[i]>0?"Over by ":"Under by ")+money(Math.abs(ac[i]-tgt[i]))]);
  return{hero:{label:"Savings rate",value:pct(ac[2]/inc*100,1),
    sub:ac[2]/inc>=0.2?"At or above the 20% benchmark":"Below the 20% benchmark - the gap is "+money(tgt[2]-ac[2])+" a month"},
   kpis:[K("Needs",pct(ac[0]/inc*100,1),ac[0]<=tgt[0]?"g":"a"),K("Wants",pct(ac[1]/inc*100,1),ac[1]<=tgt[1]?"g":"a"),
    K("Savings",pct(ac[2]/inc*100,1),ac[2]>=tgt[2]?"g":"r"),K("Unaccounted",money(left),Math.abs(left)>inc*.05?"a":"g")],
   donut:names.map((n,i)=>({label:n,value:ac[i],color:[C.inv,C.tax,C.ret][i],fmt:money(ac[i])})),
   donutTop:"Monthly",donutBot:shortI(inc),
   chart:{title:"Target against actual",labels:names,series:[{name:"Target",color:C.alt,values:tgt},{name:"Actual",color:C.ret,values:ac}]},
   table:{title:"Where it goes",cols:["Bucket","Target","Actual","% of income","Gap"],rows},
   notes:["The 20% is a floor, not a goal. In your thirties, 30-35% is what actually funds an ordinary retirement.",
    "Automate the savings on salary day. Anything left to month-end discipline tends not to survive it."]}}});

add({id:"childedu",cat:PL,name:"Child education planner",tags:"education cost inflation college fees abroad goal planning child",
 blurb:"Education inflates at around 10%. This works out the future bill and the SIP that meets it.",
 inputs:[U("age","Child's age now",5,0,17,1,"years"),U("start","Course starts at age",18,15,25,1,"years"),
  M("cost","Cost today, full course",2500000,50000,1e9,50000),P("infl","Education inflation",10,4,15,0.5),
  P("ret","Expected return",12,4,20,0.5),M("have","Already saved",200000,0,1e9,10000)],
 run(s){const y=Math.max(N(s.start)-N(s.age),1),fut=N(s.cost)*pow(1+N(s.infl)/100,y);
  const grown=N(s.have)*pow(1+N(s.ret)/100,y),gap=Math.max(fut-grown,0);
  const r=N(s.ret)/1200,sip=gap/((pow(1+r,y*12)-1)/r*(1+r));
  const L=[],A=[],B=[];let b=N(s.have);
  for(let k=1;k<=y;k++){for(let m=0;m<12;m++)b=(b+sip)*(1+r);L.push("Y"+k);A.push(b);B.push(N(s.cost)*pow(1+N(s.infl)/100,k));}
  return{hero:{label:"Cost when the course starts",value:money(fut),sub:"In "+y+" years, at "+N(s.infl)+"% education inflation"},
   kpis:[K("Monthly SIP needed",money(sip),"g"),K("Cost today",money(N(s.cost))),
    K("Existing savings grow to",money(grown),"p"),K("Shortfall to fund",money(gap),"a")],
   chart:{title:"Corpus building against a rising bill",labels:L,
    series:[{name:"Your corpus",color:C.ret,values:A,type:"line"},{name:"Cost of the course",color:C.tax,values:B,type:"line"}]},
   formula:F("Future cost = "+inr(N(s.cost))+" x (1+"+N(s.infl)+"%)^"+y+" = "+money(fut),
     "SIP = shortfall / annuity factor at "+N(s.ret)+"% = "+money(sip)),
   notes:["Shift the corpus into debt three years before the fees are due. You cannot afford a 30% equity fall in the year of admission.",
    "An education loan covers the gap and gives a full interest deduction under section 80E for eight years - worth planning for rather than avoiding."]}}});

add({id:"term",cat:PL,name:"Term life cover needed",tags:"term insurance sum assured human life value dependants cover",
 blurb:"How much cover your family actually needs - income replacement plus debts, minus what already exists.",
 inputs:[M("inc","Annual income",1800000,100000,1e9,50000),U("age","Your age",35,18,65,1,"years"),
  U("ret","Working until age",60,40,75,1,"years"),M("loan","Outstanding loans",4000000,0,1e10,100000),
  M("goals","Future goals to fund - education, marriage",5000000,0,1e10,100000),
  M("have","Existing cover",1000000,0,1e10,100000),M("assets","Liquid assets family can use",1500000,0,1e10,100000),
  P("infl","Income growth / inflation",6,0,15,0.5)],
 run(s){const y=Math.max(N(s.ret)-N(s.age),1),d=0.07,g=N(s.infl)/100;
  const real=(1+d)/(1+g)-1;
  const inc=N(s.inc)*0.7;
  const pvInc=real===0?inc*y:inc*(1-pow(1+real,-y))/real*(1+real);
  const need=pvInc+N(s.loan)+N(s.goals)-N(s.have)-N(s.assets);
  const cover=Math.max(Math.ceil(need/500000)*500000,0);
  return{hero:{label:"Additional cover needed",value:money(cover),
    sub:"On top of your existing "+shortI(N(s.have))+" - total cover of about "+shortI(cover+N(s.have))},
   kpis:[K("Income replacement value",money(pvInc),"p"),K("Debts to clear",money(N(s.loan)),"a"),
    K("Goals to fund",money(N(s.goals)),"a"),K("Cover as multiple of income",num((cover+N(s.have))/N(s.inc),1)+"x","g")],
   donut:[{label:"Income replacement",value:pvInc,color:C.ret,fmt:money(pvInc)},{label:"Loans",value:N(s.loan),color:C.tax,fmt:money(N(s.loan))},
    {label:"Goals",value:N(s.goals),color:C.bal,fmt:money(N(s.goals))}],
   donutTop:"Need",donutBot:shortI(pvInc+N(s.loan)+N(s.goals)),
   formula:F("Income to replace = 70% of "+inr(N(s.inc))+" for "+y+" years, discounted at a real rate of "+pct(real*100,2)+" = "+money(pvInc),
     "Cover = income replacement + loans + goals - existing cover - liquid assets"),
   notes:["Pure term insurance only. Endowment, ULIP and money-back plans mix insurance with investment and do both badly.",
    "Take the cover until you expect to be financially independent, not until 99. A policy running past your working life mostly adds premium.",
    "Disclose every medical detail. A claim rejected for non-disclosure defeats the entire purpose of buying it."]}}});

add({id:"healthcover",cat:PL,name:"Health insurance cover",tags:"mediclaim sum insured super top up family floater medical inflation",
 blurb:"A sensible sum insured for your city and family size, and how a top-up changes the cost.",
 inputs:[S("city","City tier","metro",[["metro","Metro"],["tier2","Tier 2"],["tier3","Tier 3 / smaller"]]),
  U("adults","Adults covered",2,1,6,1,"adults"),U("kids","Children covered",2,0,6,1,"children"),
  U("age","Age of the eldest",38,18,80,1,"years"),M("have","Current cover",500000,0,1e8,100000),
  P("minf","Medical inflation",12,5,20,0.5),Y("yrs","Look ahead",10,1,30,1)],
 run(s){const base={metro:1000000,tier2:700000,tier3:500000}[s.city];
  const rec=base+(N(s.adults)-1)*300000+N(s.kids)*200000+(N(s.age)>45?500000:0);
  const fut=rec*pow(1+N(s.minf)/100,N(s.yrs));
  const L=[],A=[];for(let k=1;k<=N(s.yrs);k++){L.push("Y"+k);A.push(rec*pow(1+N(s.minf)/100,k));}
  return{hero:{label:"Cover to aim for now",value:money(rec),
    sub:N(s.have)<rec?"You are "+money(rec-N(s.have))+" short":"Your current cover looks adequate"},
   kpis:[K("Current cover",money(N(s.have)),N(s.have)>=rec?"g":"r"),K("Equivalent cover in "+N(s.yrs)+" yrs",money(fut),"a"),
    K("People covered",N(s.adults)+N(s.kids)),K("Medical inflation used",pct(N(s.minf),1),"a")],
   chart:{title:"What today's cover must become",labels:L,series:[{name:"Cover needed",color:C.tax,values:A,type:"line"}]},
   formula:"Base for a "+s.city+" household, adjusted for family size and age, then inflated at "+N(s.minf)+"% a year.",
   notes:["A super top-up is the cheap way to get a large cover: a modest base policy plus a top-up above a deductible costs a fraction of a single large policy.",
    "Corporate cover ends with the job and usually ends before retirement, when you need it most. Keep a personal policy running alongside it so the waiting periods are already served.",
    "Waiting periods for pre-existing conditions run two to four years, so buying early is what makes the policy useful later."]}}});

add({id:"debtpayoff",cat:PL,name:"Debt payoff - snowball vs avalanche",tags:"debt free snowball avalanche credit card personal loan order",
 blurb:"Pay the smallest balance first or the costliest first - which clears your debts sooner and cheaper.",
 inputs:[M("d1","Debt 1 balance",50000,0,1e8,1000),P("r1","Rate",42,0,60,0.5),M("m1","Minimum payment",2500,0,1e7,100),
  M("d2","Debt 2 balance",300000,0,1e8,1000),P("r2","Rate",14,0,60,0.5),M("m2","Minimum payment",7000,0,1e7,100),
  M("d3","Debt 3 balance",800000,0,1e8,1000),P("r3","Rate",9.5,0,60,0.5),M("m3","Minimum payment",10000,0,1e7,100),
  M("extra","Extra you can pay each month",10000,0,1e7,500)],
 run(s){const base=[[N(s.d1),N(s.r1)/1200,N(s.m1)],[N(s.d2),N(s.r2)/1200,N(s.m2)],[N(s.d3),N(s.r3)/1200,N(s.m3)]].filter(d=>d[0]>0);
  const run2=order=>{let D=order.map(d=>d.slice()),m=0,int=0;
   while(D.some(d=>d[0]>0.5)&&m<600){let ex=N(s.extra);
    D.forEach(d=>{if(d[0]<=0)return;const ic=d[0]*d[1];int+=ic;d[0]+=ic-Math.min(d[2],d[0]+ic);});
    for(const d of D){if(d[0]<=0.5)continue;const pay=Math.min(ex,d[0]);d[0]-=pay;ex-=pay;if(ex<=0)break;}
    m++;}
   return {m,int};};
  const sn=run2(base.slice().sort((a,b)=>a[0]-b[0])), av=run2(base.slice().sort((a,b)=>b[1]-a[1]));
  const tot=base.reduce((a,d)=>a+d[0],0);
  return{hero:{label:av.int<=sn.int?"Avalanche saves more":"Both are equal here",value:money(Math.abs(sn.int-av.int)),
    sub:"Avalanche clears in "+av.m+" months, snowball in "+sn.m+" months"},
   kpis:[K("Total debt",money(tot),"a"),K("Avalanche interest",money(av.int),"g"),
    K("Snowball interest",money(sn.int),"a"),K("Monthly commitment",money(base.reduce((a,d)=>a+d[2],0)+N(s.extra)))],
   chart:{title:"Interest paid under each order",labels:["Avalanche","Snowball"],
    series:[{name:"Interest",color:C.tax,values:[av.int,sn.int]}]},
   table:{title:"Your debts",cols:["Debt","Balance","Rate","Minimum"],
    rows:base.map((d,i)=>["Debt "+(i+1),money(d[0]),pct(d[1]*1200,2),money(d[2])])},
   formula:"Avalanche sends the extra payment to the highest rate first. Snowball sends it to the smallest balance first. Minimums keep running on everything else.",
   notes:["Avalanche is always cheaper on paper. Snowball wins when you need the motivation of closing an account early - and for many people that is the difference between finishing and giving up.",
    "Clear anything above 20% before you invest a rupee. No investment reliably beats a credit card rate."]}}});

add({id:"rentvsbuy",cat:PL,name:"Rent vs buy a home",tags:"rent or buy house property emi opportunity cost break even",
 blurb:"Buying is not automatically better. This compares total wealth under both paths after the same number of years.",
 inputs:[M("price","Property price",10000000,500000,5e8,100000),P("down","Down payment",20,10,100,5),
  P("r","Home loan rate",8.5,1,20,0.05),Y("n","Loan tenure",20,1,35,1),
  M("rent","Current monthly rent",30000,1000,2000000,1000),P("rinf","Rent increase per year",7,0,20,0.5),
  P("app","Property appreciation",6,0,20,0.5),P("mret","Return if you invest instead",12,1,25,0.5),
  P("cost","Buying costs - stamp, registration, interiors",10,0,25,1),Y("hold","You will stay",10,1,40,1)],
 run(s){const px=N(s.price),dp=px*N(s.down)/100,loan=px-dp,r=N(s.r)/1200,n=N(s.n)*12;
  const e=emiOf(loan,r,n),h=N(s.hold),up=px*N(s.cost)/100;
  let bal=loan,paid=0;for(let m=0;m<Math.min(h*12,n);m++){const ic=bal*r;bal-=e-ic;paid+=e;}
  const pxEnd=px*pow(1+N(s.app)/100,h),buyNet=pxEnd-Math.max(bal,0);
  let inv=dp+up,rent=N(s.rent),rentPaid=0;const mr=N(s.mret)/1200;
  const L=[],A=[],B=[];
  for(let k=1;k<=h;k++){for(let m=0;m<12;m++){const sur=Math.max(e-rent,0);inv=(inv+sur)*(1+mr);rentPaid+=rent;}
   rent*=(1+N(s.rinf)/100);L.push("Y"+k);A.push(px*pow(1+N(s.app)/100,k)-Math.max(bal,0)*0+0);B.push(inv);}
  for(let k=0;k<h;k++){let b2=loan;for(let m=0;m<Math.min((k+1)*12,n);m++){const ic=b2*r;b2-=e-ic;}A[k]=px*pow(1+N(s.app)/100,k+1)-Math.max(b2,0);}
  const diff=buyNet-inv;
  return{hero:{label:diff>=0?"Buying is ahead by":"Renting and investing is ahead by",value:money(Math.abs(diff)),
    sub:"After "+h+" years, comparing net wealth under both paths"},
   kpis:[K("EMI",money(e),"a"),K("Home equity if you buy",money(buyNet),"g"),
    K("Corpus if you rent & invest",money(inv),"p"),K("Rent paid over "+h+" yrs",money(rentPaid),"a")],
   chart:{title:"Net wealth under each path",labels:L,
    series:[{name:"Buy - home equity",color:C.ret,values:A,type:"line"},{name:"Rent - investment corpus",color:C.bal,values:B,type:"line"}]},
   formula:F("Buy: down payment "+money(dp)+" plus "+pct(N(s.cost),0)+" of costs, EMI "+money(e)+", property grows at "+N(s.app)+"%.",
     "Rent: the same down payment and costs are invested at "+N(s.mret)+"%, plus the monthly gap between EMI and rent.",
     "Both are compared on net wealth after "+h+" years."),
   notes:["The rent-to-price ratio decides it. When annual rent is under 3% of the property price, renting and investing usually wins on the numbers.",
    "Numbers are not the whole answer - a home you own is stability, and forced EMI saving works for people who would not otherwise invest the difference.",
    "Selling property costs time and brokerage, and capital gains tax applies. Neither shows up in this comparison."]}}});

add({id:"affordability",cat:PL,name:"How much house can you afford",tags:"home affordability budget down payment emi income multiple",
 blurb:"Work from your income and savings to a realistic property budget, including the costs people forget.",
 inputs:[M("inc","Monthly take-home",150000,10000,1e7,5000),M("emi","Existing EMIs",0,0,1e7,1000),
  P("foir","EMI you are comfortable with",35,15,60,1),M("save","Savings available for down payment",2000000,0,1e9,50000),
  P("r","Home loan rate",8.5,1,20,0.05),Y("n","Tenure",20,1,35,1),
  P("cost","Stamp duty, registration & interiors",10,0,25,1),M("emerg","Keep aside as emergency fund",600000,0,1e9,50000)],
 run(s){const cap=N(s.inc)*N(s.foir)/100-N(s.emi),r=N(s.r)/1200,n=N(s.n)*12;
  const loan=cap>0?cap*(pow(1+r,n)-1)/(r*pow(1+r,n)):0;
  const dp=Math.max(N(s.save)-N(s.emerg),0);
  const px=(loan+dp)/(1+N(s.cost)/100);
  return{hero:{label:"Property budget",value:money(px),sub:"Loan of "+shortI(loan)+" plus "+shortI(dp)+" of your own money"},
   kpis:[K("Comfortable EMI",money(Math.max(cap,0)),"a"),K("Loan eligible",money(loan),"p"),
    K("Down payment available",money(dp),"g"),K("Price to income",num(px/(N(s.inc)*12),1)+"x",px/(N(s.inc)*12)<5?"g":"r")],
   donut:[{label:"Loan",value:loan,color:C.tax,fmt:money(loan)},{label:"Your money",value:dp,color:C.ret,fmt:money(dp)}],
   donutTop:"Budget",donutBot:shortI(px),
   table:{title:"Where the money goes",cols:["Line","Amount"],
    rows:[["Property price",money(px)],["Stamp duty, registration, interiors",money(px*N(s.cost)/100)],
     ["Total outlay",money(px*(1+N(s.cost)/100))],["Less: loan",money(-loan)],["From your savings",money(dp)],
     ["Emergency fund kept intact",money(N(s.emerg))]]},
   notes:["A property price above five times annual income usually strains everything else - retirement saving, holidays, job flexibility.",
    "Never drain the emergency fund into the down payment. A job loss six months after possession is the scenario that turns a home into a forced sale."]}}});

add({id:"salaryhike",cat:PL,name:"Salary hike & job switch",tags:"appraisal increment percentage hike new job ctc comparison real",
 blurb:"What a hike is worth after inflation and tax, and whether a switch is really an upgrade.",
 inputs:[M("old","Current CTC",1800000,100000,1e8,10000),M("new","New CTC",2250000,100000,1e8,10000),
  P("infl","Inflation",6,0,15,0.5),M("bonus","Variable pay in the new offer",300000,0,1e8,10000),
  P("prob","Chance the variable actually pays out",70,0,100,5),M("cost","Extra yearly cost - commute, rent, city",120000,0,1e7,10000)],
 run(s){const o=N(s.old),nn=N(s.new),hike=(nn/o-1)*100;
  const real=((1+hike/100)/(1+N(s.infl)/100)-1)*100;
  const eff=nn-N(s.bonus)*(1-N(s.prob)/100)-N(s.cost);
  return{hero:{label:"Hike",value:pct(hike,1),sub:"Real hike after "+N(s.infl)+"% inflation is "+pct(real,1)},
   kpis:[K("Increase",money(nn-o),"g"),K("Real increase",money(o*real/100),real>0?"g":"r"),
    K("Effective new CTC",money(eff),"p"),K("Effective hike",pct((eff/o-1)*100,1),eff>o?"g":"r")],
   table:{title:"Compounding effect of a hike",cols:["Years","At "+pct(hike,0)+" every year","At 8% every year"],
    rows:[1,3,5,10].map(y=>[y,money(o*pow(1+hike/100,y)),money(o*pow(1.08,y))])},
   formula:F("Hike = (new / old) - 1 = "+pct(hike,2),
     "Real hike = (1 + hike) / (1 + inflation) - 1 = "+pct(real,2),
     "Effective CTC discounts the variable by its payout probability and deducts the extra cost of the new role."),
   notes:["A hike below inflation is a pay cut in real terms, however the letter is worded.",
    "Compare fixed pay against fixed pay. Variable, ESOPs and joining bonuses are not the same currency."]}}});

add({id:"carcost",cat:PL,name:"Cost of owning a car",tags:"car ownership cost fuel insurance depreciation maintenance total",
 blurb:"The real monthly cost of a car once fuel, insurance, servicing and depreciation are counted.",
 inputs:[M("price","On-road price",1200000,100000,5e7,10000),P("down","Down payment",30,0,100,5),
  P("r","Loan rate",9.5,1,20,0.1),Y("n","Loan tenure",5,1,8,1),
  U("km","Kilometres a month",1000,50,10000,50,"km"),U("mil","Mileage",15,3,40,0.5,"km/l"),
  M("fuel","Fuel price per litre",105,50,300,1),M("ins","Insurance a year",25000,0,1000000,1000),
  M("serv","Service & tyres a year",20000,0,1000000,1000),P("dep","Depreciation a year",15,0,30,1),Y("own","You will keep it",7,1,20,1)],
 run(s){const px=N(s.price),loan=px*(1-N(s.down)/100),e=emiOf(loan,N(s.r)/1200,N(s.n)*12);
  const fuelM=N(s.km)/N(s.mil)*N(s.fuel),other=(N(s.ins)+N(s.serv))/12;
  const yr=N(s.own),resid=px*pow(1-N(s.dep)/100,yr),depM=(px-resid)/(yr*12);
  const cash=e*Math.min(N(s.n),yr)*12/(yr*12)+fuelM+other;
  const tco=depM+fuelM+other+ (loan>0?(e*N(s.n)*12-loan)/(yr*12):0);
  return{hero:{label:"True cost per month",value:money(tco),sub:money(tco/N(s.km))+" per kilometre over "+yr+" years"},
   kpis:[K("EMI",money(e),"a"),K("Fuel",money(fuelM),"a"),K("Depreciation",money(depM),"r"),
    K("Insurance & service",money(other),"a")],
   donut:[{label:"Depreciation",value:depM,color:C.tax,fmt:money(depM)},{label:"Fuel",value:fuelM,color:C.bal,fmt:money(fuelM)},
    {label:"Insurance & service",value:other,color:C.inv,fmt:money(other)},{label:"Loan interest",value:loan>0?(e*N(s.n)*12-loan)/(yr*12):0,color:C.alt,fmt:money(loan>0?(e*N(s.n)*12-loan)/(yr*12):0)}],
   donutTop:"Per month",donutBot:shortI(tco),
   table:{title:"Over "+yr+" years",cols:["Line","Total"],
    rows:[["Depreciation",money(px-resid)],["Fuel",money(fuelM*12*yr)],["Insurance & service",money(other*12*yr)],
     ["Loan interest",money(loan>0?e*N(s.n)*12-loan:0)],["Resale value",money(resid)],["Total cost of ownership",money(tco*12*yr)]]},
   notes:["Depreciation is usually the largest line and the one nobody budgets for - a new car loses 15-20% in the first year alone.",
    "Compare this monthly figure against a cab budget before buying. Under about 800 km a month, cabs often win outright."]}}});

add({id:"edloan",cat:PL,name:"Education loan",tags:"education loan moratorium 80e interest study abroad repayment",
 blurb:"Interest builds during the course. This shows the EMI after the moratorium and the section 80E benefit.",
 inputs:[M("amt","Loan amount",4000000,50000,5e7,50000),P("r","Interest rate",10.5,5,18,0.1),
  U("course","Course duration",2,1,6,0.5,"years"),U("mor","Extra moratorium after the course",0.5,0,2,0.5,"years"),
  Y("n","Repayment tenure",10,1,15,1),TG("simple","Pay simple interest during the moratorium",false),
  S("slab","Tax slab","30",[["5","5%"],["20","20%"],["30","30%"]])],
 run(s){const a=N(s.amt),r=N(s.r)/1200,mor=(N(s.course)+N(s.mor))*12;
  const bal=s.simple?a:a*pow(1+r,mor),paidDuring=s.simple?a*r*mor:0;
  const n=N(s.n)*12,e=emiOf(bal,r,n),int=e*n-bal+paidDuring;
  let b=bal,ded=0;for(let y=1;y<=N(s.n);y++){let yi=0;for(let m=0;m<12;m++){const ic=b*r;yi+=ic;b-=e-ic;}
   if(y<=8)ded+=yi*N(s.slab)/100;}
  return{hero:{label:"EMI after the moratorium",value:money(e),sub:"On a balance of "+money(bal)+" after "+num(mor/12,1)+" years of moratorium"},
   kpis:[K("Interest during moratorium",money(bal-a+paidDuring),"a"),K("Total interest",money(int),"a"),
    K("Tax saved under 80E",money(ded),"g"),K("Total repayment",money(e*n+paidDuring))],
   table:{title:"Two ways to handle the moratorium",cols:["Approach","Balance when EMI starts","EMI","Total interest"],
    rows:[["Let interest accumulate",money(a*pow(1+r,mor)),money(emiOf(a*pow(1+r,mor),r,n)),money(emiOf(a*pow(1+r,mor),r,n)*n-a)],
     ["Pay simple interest during the course",money(a),money(emiOf(a,r,n)),money(emiOf(a,r,n)*n-a+a*r*mor)]]},
   formula:F("Interest accrues through the moratorium and is capitalised unless you service it.",
     "  "+inr(a)+" x (1+"+num(r*100,4)+"%)^"+mor+" = "+money(a*pow(1+r,mor))),
   notes:["Section 80E allows the entire interest as a deduction for eight years, with no upper limit - one of the most generous deductions in the Act. Old regime only.",
    "Paying even the simple interest during the course, often from a part-time job, saves a large amount over the loan.",
    "Loans above \u20B97.5 lakh usually need collateral; below that a co-applicant is generally enough."]}}});

const EV="Everyday & business";

add({id:"percentage",cat:EV,name:"Percentage calculator",tags:"percent increase decrease change of what percentage",
 blurb:"The four percentage questions people actually ask, answered at once.",
 inputs:[M("a","Value A",250,-1e9,1e9,1),M("b","Value B",400,-1e9,1e9,1),P("p","Percentage",15,-1000,1000,0.5)],
 run(s){const a=N(s.a),b=N(s.b),p=N(s.p);

add({id:"discount",cat:EV,name:"Discount & sale price",tags:"discount off sale price mrp savings percent off stacked",
 blurb:"Sale price after one or two discounts, plus GST, and the real saving.",
 inputs:[M("mrp","Original price",4999,1,1e8,1),P("d1","First discount",40,0,95,1),
  P("d2","Extra discount on top",10,0,95,1),S("gst","GST added at checkout","0",[["0","No GST"],["5","5%"],["12","12%"],["18","18%"],["28","28%"]])],
 run(s){const m=N(s.mrp),p1=m*(1-N(s.d1)/100),p2=p1*(1-N(s.d2)/100);
  const g=N(s.gst)/100,fin=p2*(1+g),eff=(1-p2/m)*100;
  return{hero:{label:"You pay",value:money(fin),sub:"Saving "+money(m-p2)+" on a list price of "+money(m)},
   kpis:[K("After first discount",money(p1)),K("After both",money(p2),"g"),
    K("Effective discount",pct(eff,1),"p"),K("GST added",money(p2*g),"a")],
   table:{title:"Step by step",cols:["Step","Amount"],
    rows:[["List price",money(m)],[N(s.d1)+"% off",money(-(m-p1))],["Subtotal",money(p1)],
     [N(s.d2)+"% extra off",money(-(p1-p2))],["Price",money(p2)],["GST at "+N(s.gst)+"%",money(p2*g)],["You pay",money(fin)]]},
   formula:"Stacked discounts multiply, they do not add: "+N(s.d1)+"% + "+N(s.d2)+"% = "+pct(eff,1)+" effective, not "+pct(N(s.d1)+N(s.d2),0)+".",
   notes:["\"50% + 20% off\" is a 60% discount, not 70%. The second cut applies to the already reduced price."]}}});

add({id:"marginmarkup",cat:EV,name:"Margin & markup",tags:"gross margin markup selling price cost price profit business pricing",
 blurb:"The two numbers traders confuse constantly - margin is on the selling price, markup is on cost.",
 inputs:[M("cost","Cost price",700,0.01,1e9,1),M("sell","Selling price",1000,0.01,1e9,1),
  P("targ","Target margin",40,0,95,1)],
 run(s){const c=N(s.cost),sl=N(s.sell);
  const mar=(sl-c)/sl*100,mk=(sl-c)/c*100,need=c/(1-N(s.targ)/100);
  return{hero:{label:"Gross margin",value:pct(mar,2),sub:"Markup on cost is "+pct(mk,2)},
   kpis:[K("Profit per unit",money(sl-c),sl>=c?"g":"r"),K("Markup",pct(mk,2),"p"),
    K("Price for "+N(s.targ)+"% margin",money(need),"g"),K("Markup needed",pct((need/c-1)*100,1),"a")],
   table:{title:"Margin to markup",cols:["Margin","Markup","Price on this cost"],
    rows:[10,20,30,40,50,60].map(m=>[m+"%",pct(m/(100-m)*100,1),money(c/(1-m/100))])},
   formula:F("Margin = (price - cost) / price = "+pct(mar,3),
     "Markup = (price - cost) / cost = "+pct(mk,3),
     "Price for a target margin = cost / (1 - margin) = "+money(need)),
   notes:["A 50% markup is only a 33% margin. Quoting the wrong one is how retailers underprice themselves."]}}});

add({id:"tip",cat:EV,name:"Bill split & tip",tags:"tip split bill restaurant per person service charge gst",
 blurb:"Split a restaurant bill with GST, service charge and tip, evenly or by shares.",
 inputs:[M("bill","Bill before taxes",3200,1,1e7,10),P("gst","GST",5,0,28,0.5),
  P("sc","Service charge",0,0,20,0.5),P("tip","Tip",10,0,50,1),U("n","People",4,1,100,1,"people")],
 run(s){const b=N(s.bill),sc=b*N(s.sc)/100,g=(b+sc)*N(s.gst)/100,tip=b*N(s.tip)/100;
  const tot=b+sc+g+tip,per=tot/N(s.n);
  return{hero:{label:"Each person pays",value:money(per),sub:"Total bill "+money(tot)+" split "+N(s.n)+" ways"},
   kpis:[K("Food & drink",money(b)),K("GST",money(g),"a"),K("Service charge",money(sc),"a"),K("Tip",money(tip),"g")],
   table:{title:"Bill",cols:["Line","Amount","Per person"],
    rows:[["Food & drink",money(b),money(b/N(s.n))],["Service charge",money(sc),money(sc/N(s.n))],
     ["GST",money(g),money(g/N(s.n))],["Tip",money(tip),money(tip/N(s.n))],["Total",money(tot),money(per)]]},
   notes:["Service charge is voluntary in India - CCPA guidelines say restaurants cannot add it by default, and you can ask for it to be removed.",
    "GST applies on the service charge too, so refusing it saves a little more than the line itself."]}}});

add({id:"age",cat:EV,name:"Age calculator",tags:"age date of birth years months days next birthday exact",
 blurb:"Exact age in years, months and days, plus the countdown to the next birthday.",
 inputs:[{k:"dob",label:"Date of birth",type:"date",def:"1990-01-15"},{k:"on",label:"Age as on",type:"date",def:()=>today()}],
 run(s){const d1=new Date(s.dob),d2=new Date(s.on);
  if(isNaN(d1)||isNaN(d2))return{hero:{label:"Age",value:"--",sub:"Enter both dates"}};
  let y=d2.getFullYear()-d1.getFullYear(),m=d2.getMonth()-d1.getMonth(),d=d2.getDate()-d1.getDate();
  if(d<0){m--;d+=new Date(d2.getFullYear(),d2.getMonth(),0).getDate();}
  if(m<0){y--;m+=12;}
  const days=Math.floor((d2-d1)/864e5);
  let nb=new Date(d2.getFullYear(),d1.getMonth(),d1.getDate());
  if(nb<d2)nb=new Date(d2.getFullYear()+1,d1.getMonth(),d1.getDate());
  return{hero:{label:"Age",value:y+" years, "+m+" months, "+d+" days",sub:inr(days)+" days lived"},
   kpis:[K("In months",inr(y*12+m)),K("In weeks",inr(Math.floor(days/7))),
    K("Next birthday in",Math.ceil((nb-d2)/864e5)+" days","p"),K("Turning",y+1,"g")],
   table:{title:"Milestones",cols:["Milestone","Date","Status"],
    rows:[18,21,25,40,58,60,65].map(a=>{const dt=new Date(d1.getFullYear()+a,d1.getMonth(),d1.getDate());
     return ["Age "+a,dt.toISOString().slice(0,10),dt<=d2?"Passed":"In "+Math.ceil((dt-d2)/864e5)+" days"];})}}}});

add({id:"datediff",cat:EV,name:"Date difference",tags:"days between dates working days duration deadline countdown",
 blurb:"Days between two dates, working days excluded, and the date a number of days from now.",
 inputs:[{k:"a",label:"From",type:"date",def:()=>today()},{k:"b",label:"To",type:"date",def:"2027-01-01"},
  U("add","Or add this many days to the start date",90,-3650,3650,1,"days")],
 run(s){const a=new Date(s.a),b=new Date(s.b);
  if(isNaN(a)||isNaN(b))return{hero:{label:"Difference",value:"--",sub:"Enter both dates"}};
  const days=Math.round((b-a)/864e5);let wd=0;
  for(let i=0;i<Math.abs(days);i++){const d=new Date(a.getTime()+i*864e5*(days<0?-1:1));const w=d.getDay();if(w!==0&&w!==6)wd++;}
  const fut=new Date(a.getTime()+N(s.add)*864e5);
  return{hero:{label:"Difference",value:inr(Math.abs(days))+" days",
    sub:num(Math.abs(days)/365.25,2)+" years, or about "+inr(Math.floor(Math.abs(days)/7))+" weeks"},
   kpis:[K("Working days",inr(wd),"p"),K("Weekends",inr(Math.abs(days)-wd)),
    K("Months (approx)",num(Math.abs(days)/30.44,1)),K(N(s.add)+" days from start",fut.toISOString().slice(0,10),"g")],
   notes:["Working days here exclude Saturdays and Sundays only. Public holidays vary by state and are not deducted."]}}});

add({id:"bmi",cat:EV,name:"BMI calculator",tags:"body mass index height weight asian indian cut off",
 blurb:"Body mass index against the Asian-Indian cut-offs, which are lower than the international ones.",
 inputs:[U("h","Height",170,120,220,1,"cm"),U("w","Weight",72,25,250,0.5,"kg")],
 run(s){const h=N(s.h)/100,w=N(s.w),bmi=w/(h*h);
  const cat=bmi<18.5?"Underweight":bmi<23?"Normal for Asian-Indian cut-offs":bmi<25?"Overweight (Asian-Indian)":bmi<30?"Obese class I":"Obese class II";
  const lo=18.5*h*h,hi=22.9*h*h;
  return{hero:{label:"BMI",value:num(bmi,1),sub:cat},
   kpis:[K("Height",num(N(s.h),0)+" cm"),K("Weight",num(w,1)+" kg"),
    K("Normal range for your height",num(lo,1)+" - "+num(hi,1)+" kg","g"),K("International category",bmi<18.5?"Underweight":bmi<25?"Normal":bmi<30?"Overweight":"Obese","p")],
   table:{title:"Cut-offs",cols:["Category","Asian-Indian BMI","International BMI"],
    rows:[["Underweight","below 18.5","below 18.5"],["Normal","18.5 - 22.9","18.5 - 24.9"],
     ["Overweight","23 - 24.9","25 - 29.9"],["Obese","25 and above","30 and above"]]},
   formula:"BMI = weight in kg / (height in metres)^2 = "+num(w,1)+" / "+num(h*h,4)+" = "+num(bmi,2),
   notes:["Indian health guidelines use lower thresholds because cardiometabolic risk appears at a lower BMI in South Asian populations.",
    "BMI says nothing about body composition - it cannot tell muscle from fat, and it is a population screening tool rather than a personal diagnosis. Waist circumference and a doctor's assessment tell you more."]}}});

add({id:"tdee",cat:EV,name:"Daily calorie needs",tags:"bmr tdee calories maintenance mifflin activity level energy",
 blurb:"Resting metabolic rate and the energy you use in a day at your activity level.",
 inputs:[G("sex","Sex","m",[["m","Male"],["f","Female"]]),U("age","Age",32,10,90,1,"years"),
  U("h","Height",170,120,220,1,"cm"),U("w","Weight",72,25,250,0.5,"kg"),
  S("act","Activity level","1.375",[["1.2","Sedentary - desk job, no exercise"],["1.375","Light - 1 to 3 days a week"],["1.55","Moderate - 3 to 5 days"],["1.725","Active - 6 to 7 days"],["1.9","Very active - physical job or twice daily"]])],
 run(s){const bmr=10*N(s.w)+6.25*N(s.h)-5*N(s.age)+(s.sex==="m"?5:-161);
  const t=bmr*N(s.act);
  return{hero:{label:"Daily energy use",value:inr(Math.round(t))+" kcal",sub:"Resting metabolic rate is "+inr(Math.round(bmr))+" kcal"},
   kpis:[K("Resting (BMR)",inr(Math.round(bmr))+" kcal"),K("Activity multiplier",num(N(s.act),3)+"x","p"),
    K("Protein at 1.6 g/kg",Math.round(N(s.w)*1.6)+" g","g"),K("Water guide",num(N(s.w)*0.033,1)+" L")],
   table:{title:"At different activity levels",cols:["Level","Daily kcal"],
    rows:[["Sedentary",inr(Math.round(bmr*1.2))],["Light",inr(Math.round(bmr*1.375))],["Moderate",inr(Math.round(bmr*1.55))],
     ["Active",inr(Math.round(bmr*1.725))],["Very active",inr(Math.round(bmr*1.9))]]},
   formula:F("Mifflin-St Jeor: BMR = 10 x weight + 6.25 x height - 5 x age "+(s.sex==="m"?"+ 5":"- 161"),
     "  = "+inr(Math.round(bmr))+" kcal, multiplied by the activity factor "+N(s.act)+" = "+inr(Math.round(t))+" kcal"),
   notes:["These are population averages and individual metabolism varies by 10-15% either way. Treat the number as a starting estimate.",
    "For any change to your diet or training, a doctor or a registered dietitian who knows your history is the right person to plan it with."]}}});

add({id:"fuel",cat:EV,name:"Fuel & trip cost",tags:"petrol diesel mileage trip cost per km ev comparison",
 blurb:"Cost of a trip, cost per kilometre, and how petrol compares with a CNG or electric alternative.",
 inputs:[U("dist","Distance",500,1,10000,1,"km"),U("mil","Mileage",15,2,50,0.5,"km/l"),

 run(s){const d=N(s.dist),l=d/N(s.mil),c=l*N(s.price),pk=c/d;

    K("Monthly at "+N(s.trips)+" trips",money(mo),"a"),K("Saving with the alternative",money(mo-altMo),mo>altMo?"g":"r")],
   chart:{title:"Yearly cost",labels:["Current fuel","Alternative"],

   formula:F("Litres = distance / mileage = "+d+" / "+N(s.mil)+" = "+num(l,2),
     "Cost = litres x price = "+money(c)+"     Per km = "+money(pk)),

add({id:"electricity",cat:EV,name:"Electricity bill",tags:"units kwh appliance power consumption bill slab tariff ac",
 blurb:"Units an appliance consumes and what it adds to the monthly bill.",
 inputs:[U("w","Appliance power",1500,1,20000,10,"watts"),U("hrs","Hours used a day",8,0.1,24,0.5,"hours"),
  U("days","Days a month",30,1,31,1,"days"),M("rate","Tariff per unit",8,0.5,50,0.25),
  U("qty","Number of such appliances",1,1,50,1,"units")],
 run(s){const kwh=N(s.w)/1000*N(s.hrs)*N(s.days)*N(s.qty),cost=kwh*N(s.rate);
  const common=[["LED bulb (9 W)",9],["Ceiling fan (75 W)",75],["Refrigerator (150 W)",150],["1.5 ton AC (1500 W)",1500],["Geyser (2000 W)",2000]];
  return{hero:{label:"Monthly cost",value:money(cost),sub:num(kwh,1)+" units a month at "+money(N(s.rate))+" per unit"},
   kpis:[K("Units a day",num(kwh/N(s.days),2)),K("Units a month",num(kwh,1),"p"),
    K("Cost a day",money(cost/N(s.days))),K("Cost a year",money(cost*12),"a")],

    rows:common.map(c=>[c[0],num(c[1]/1000*N(s.hrs)*N(s.days),1),money(c[1]/1000*N(s.hrs)*N(s.days)*N(s.rate))])},
