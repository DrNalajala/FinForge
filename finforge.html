<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinForge - Indian Financial Calculator Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F6; --card:#FFFFFF; --card-2:#F7F9FC;
  --ink:#131A2B; --ink-2:#3A465F; --mute:#6C7891;
  --line:#D8DEEA; --line-soft:#E8ECF4;
  --jade:#0B8C63; --jade-soft:#E3F3EC;
  --amber:#B9761A; --amber-soft:#FBF0DE;
  --plum:#8E2C63; --plum-soft:#F7E7EF;
  --slate:#4C5C7A; --red:#B4372F;
  --shadow:0 1px 2px rgba(19,26,43,.06), 0 8px 24px -12px rgba(19,26,43,.18);
  --r:14px;
}
html[data-theme="dark"]{
  --paper:#0E1320; --card:#161C2C; --card-2:#1C2436;
  --ink:#EEF2FA; --ink-2:#BAC4D8; --mute:#8B97AF;
  --line:#2A3346; --line-soft:#222B3D;
  --jade:#3FBE8F; --jade-soft:#12281F;
  --amber:#DFA24A; --amber-soft:#2A2113;
  --plum:#DE7FAE; --plum-soft:#2B1622;
  --slate:#9AA9C4; --red:#E5776C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;margin:0;letter-spacing:-.015em}
button,input,select{font:inherit;color:inherit}
a{color:var(--plum)}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;background:var(--card);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:10px 18px;
}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;text-decoration:none;color:inherit}
.mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--card);
  display:grid;place-items:center;font-family:"Bricolage Grotesque",serif;font-weight:800;font-size:19px}
html[data-theme="dark"] .mark{background:var(--jade);color:#0E1320}
.brand b{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;letter-spacing:-.02em;display:block;line-height:1.1}
.brand span{font-size:10.5px;color:var(--mute);letter-spacing:.10em;text-transform:uppercase}
.search{flex:1;max-width:520px;position:relative}
.search input{
  width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;
  background:var(--card-2);outline:none;
}
.search input:focus{border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-soft)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:14px}
.hbtn{border:1px solid var(--line);background:var(--card-2);border-radius:10px;padding:8px 11px;cursor:pointer;color:var(--ink-2)}
.hbtn:hover{border-color:var(--ink-2)}
#menuBtn{display:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);gap:0;align-items:start}
nav.side{
  position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;
  border-right:1px solid var(--line);background:var(--card);padding:14px 10px 40px;
}
.cat{margin-bottom:6px}
.cat>h4{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);
  padding:10px 10px 6px;font-weight:600;font-family:"IBM Plex Sans",sans-serif}
.cat a{
  display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;
  color:var(--ink-2);text-decoration:none;font-size:13.5px;cursor:pointer;
}
.cat a:hover{background:var(--card-2);color:var(--ink)}
.cat a.on{background:var(--ink);color:var(--card);font-weight:500}
html[data-theme="dark"] .cat a.on{background:var(--jade);color:#0E1320}
.cat a .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.45;flex:0 0 auto}
main{padding:22px clamp(14px,3vw,34px) 80px;max-width:1180px}

/* ---------- calc header ---------- */
.chead{margin-bottom:18px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--plum);font-weight:600}
.chead h1{font-size:clamp(24px,3.4vw,34px);margin:6px 0 6px}
.chead p{margin:0;color:var(--mute);max-width:68ch;font-size:14.5px}

/* ---------- panels ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>.hd{padding:13px 16px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
.card>.hd h3{font-size:14px;letter-spacing:0}
.card>.bd{padding:16px}

/* ---------- inputs ---------- */
.field{margin-bottom:17px}
.field:last-child{margin-bottom:4px}
.flabel{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}
.flabel label{font-size:13.5px;color:var(--ink-2);font-weight:500}
.hint{color:var(--mute);font-size:11.5px;cursor:help;border-bottom:1px dotted var(--mute)}
.vbox{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card-2)}
.vbox .pre,.vbox .suf{padding:0 9px;font-size:12.5px;color:var(--mute);background:transparent;white-space:nowrap}
.vbox input{border:0;background:transparent;padding:7px 4px;width:100%;text-align:right;outline:none;
  font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:14px;min-width:60px}
.vbox:focus-within{border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-soft)}
.vwrap{display:grid;grid-template-columns:1fr 138px;gap:12px;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--card);border:4px solid var(--jade);margin-top:-6px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--card);border:4px solid var(--jade)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--jade-soft)}
select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card-2);outline:none}
select:focus{border-color:var(--jade)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card-2)}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;cursor:pointer;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--card);font-weight:500}
html[data-theme="dark"] .seg button.on{background:var(--jade);color:#0E1320}
.switch{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.switch i{width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;transition:.16s;flex:0 0 auto}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--card);transition:.16s}
.switch.on i{background:var(--jade)}
.switch.on i::after{transform:translateX(14px)}

/* ---------- result note (signature) ---------- */
.note{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);
  background:var(--card);box-shadow:var(--shadow)}
.note .guilloche{position:absolute;inset:0;opacity:.10;pointer-events:none;color:var(--plum)}
html[data-theme="dark"] .note .guilloche{opacity:.16}
.note .inner{position:relative;padding:20px 18px 16px}
.note .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.note .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.03em;
  font-size:clamp(30px,5.2vw,46px);line-height:1.05;margin:7px 0 2px;font-variant-numeric:tabular-nums}
.note .sub{color:var(--mute);font-size:13px}
.perf{height:10px;background:
  radial-gradient(circle at 5px 0, transparent 4.6px, var(--line) 4.7px, var(--line) 5.2px, transparent 5.3px) repeat-x;
  background-size:10px 10px;opacity:.9}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line-soft);
  border-top:1px solid var(--line-soft)}
.kpi{background:var(--card);padding:12px 14px}
.kpi .k{font-size:11px;color:var(--mute);letter-spacing:.03em;margin-bottom:3px}
.kpi .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.kpi .v.g{color:var(--jade)} .kpi .v.a{color:var(--amber)} .kpi .v.r{color:var(--red)} .kpi .v.p{color:var(--plum)}

/* ---------- misc blocks ---------- */
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.formula{background:var(--card-2);border:1px dashed var(--line);border-radius:10px;padding:11px 13px;
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2);overflow-x:auto;white-space:pre-wrap;line-height:1.65}
.notes{margin:0;padding-left:18px;color:var(--mute);font-size:13px}
.notes li{margin:5px 0}
.warn{background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);
  color:var(--amber);border-radius:10px;padding:10px 13px;font-size:13px;margin-top:14px}
.tblwrap{overflow:auto;max-height:430px;border:1px solid var(--line-soft);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 11px;text-align:right;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky;top:0;background:var(--card-2);font-weight:600;font-size:11.5px;color:var(--mute);
  letter-spacing:.05em;text-transform:uppercase;z-index:2}
tbody td{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--card-2)}
tfoot td{font-weight:600;background:var(--card-2);font-family:"IBM Plex Mono",monospace}
.stack{display:flex;flex-direction:column;gap:18px;margin-top:18px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--card-2);border-radius:9px;padding:8px 13px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--ink);color:var(--card);border-color:var(--ink)}
html[data-theme="dark"] .btn.pri{background:var(--jade);color:#0E1320;border-color:var(--jade)}
.cf{display:grid;grid-template-columns:1fr 1fr 34px;gap:8px;margin-bottom:8px}
.cf input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card-2);outline:none;width:100%}
.cf button{border:1px solid var(--line);background:var(--card-2);border-radius:8px;cursor:pointer;color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card-2);border-radius:20px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.chip:hover{border-color:var(--jade);color:var(--jade)}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:26px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.14s}
.tile:hover{border-color:var(--jade);transform:translateY(-2px)}
.tile b{display:block;font-size:14px;margin-bottom:4px;font-family:"Bricolage Grotesque",sans-serif}
.tile span{font-size:12.5px;color:var(--mute);line-height:1.45}
.sechead{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sechead h2{font-size:19px}
.sechead em{font-style:normal;color:var(--mute);font-size:12.5px}
footer{color:var(--mute);font-size:12.5px;padding:26px 4px 0;border-top:1px solid var(--line);margin-top:34px;line-height:1.7}

@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  nav.side{position:fixed;left:0;top:56px;width:270px;z-index:50;transform:translateX(-100%);transition:.2s;box-shadow:var(--shadow)}
  nav.side.open{transform:none}
  #menuBtn{display:block}
  .grid{grid-template-columns:1fr}
  .vwrap{grid-template-columns:1fr 118px}
  main{padding:16px 14px 70px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{header,nav.side,.rowbtns{display:none}.shell{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="menuBtn" aria-label="Open calculator list">&#9776;</button>
  <a class="brand" href="javascript:void 0" onclick="go('home')"><span class="mark">&#8377;</span><span><b>FinForge</b><span>Financial calculators</span></span></a>
  <div class="search"><span class="ic">&#128269;</span>
    <input id="q" type="search" placeholder="Search 100 calculators - SIP, EMI, tax, gratuity, brokerage..." autocomplete="off" aria-label="Search calculators">
  </div>
  <button class="hbtn" id="themeBtn" title="Switch theme" aria-label="Switch theme">&#9789;</button>
</header>
<div class="shell">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<script>
/* ============================================================
   FinForge - core engine
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ---------- number formatting (Indian) ---------- */
function inr(n){ if(!isFinite(n)) return "--";
  const neg=n<0; n=Math.round(Math.abs(n));
  let s=String(n), last3=s.slice(-3), rest=s.slice(0,-3);
  if(rest) s=rest.replace(/\B(?=(\d{2})+(?!\d))/g,",")+","+last3;
  return (neg?"-":"")+s; }
function money(n){ return "\u20B9"+inr(n); }
function shortI(n){ const neg=n<0; n=Math.abs(n); let o;
  if(n>=1e7) o=(n/1e7).toFixed(2).replace(/\.00$/,"")+" Cr";
  else if(n>=1e5) o=(n/1e5).toFixed(2).replace(/\.00$/,"")+" L";
  else if(n>=1e3) o=(n/1e3).toFixed(1).replace(/\.0$/,"")+" K";
  else o=String(Math.round(n));
  return (neg?"-":"")+"\u20B9"+o; }
function pct(n,d=2){ return (isFinite(n)?n.toFixed(d):"--")+"%"; }
function num(n,d=2){ return isFinite(n)?Number(n).toFixed(d):"--"; }
function yrsTxt(y){ const w=Math.floor(y), m=Math.round((y-w)*12);
  return (w?w+" yr ":"")+(m?m+" mo":"")||"0"; }

/* ---------- finance primitives ---------- */
const pow=Math.pow;
// future value of an annuity; due=true -> payment at start of period
function fvAnnuity(pmt,i,n,due=true){ if(i===0) return pmt*n;
  return pmt*((pow(1+i,n)-1)/i)*(due?(1+i):1); }
function pvAnnuity(pmt,i,n,due=true){ if(i===0) return pmt*n;
  return pmt*((1-pow(1+i,-n))/i)*(due?(1+i):1); }
function emiOf(P,i,n){ if(i===0) return P/n; return P*i*pow(1+i,n)/(pow(1+i,n)-1); }
// solve f(x)=0 by bisection - robust for all our monotone cases
function bisect(f,lo,hi,tol=1e-9,it=300){ let flo=f(lo),fhi=f(hi);
  if(!isFinite(flo)||!isFinite(fhi)||flo*fhi>0) return NaN;
  for(let k=0;k<it;k++){ const m=(lo+hi)/2, fm=f(m);
    if(Math.abs(fm)<tol||(hi-lo)/2<tol) return m;
    if(flo*fm<=0){hi=m;fhi=fm;} else {lo=m;flo=fm;} }
  return (lo+hi)/2; }
function xnpv(r,cf){ const t0=cf[0].d;
  return cf.reduce((s,c)=>s+c.a/pow(1+r,(c.d-t0)/(365*864e5)),0); }
function xirr(cf){ cf=cf.slice().sort((a,b)=>a.d-b.d);
  if(cf.length<2) return NaN;
  const f=r=>xnpv(r,cf); return bisect(f,-0.9999,50); }

/* ---------- SVG charts (no libraries) ---------- */
function svgWrap(w,h,inner,cls=""){
  return `<svg viewBox="0 0 ${w} ${h}" class="${cls}" style="width:100%;height:auto;display:block" role="img">${inner}</svg>`; }

function donut(parts,centerTop,centerBot){
  const tot=parts.reduce((s,p)=>s+Math.max(0,p.value),0)||1;
  const R=78,r=52,cx=95,cy=95; let a=-Math.PI/2,seg="";
  parts.forEach(p=>{ const frac=Math.max(0,p.value)/tot; const a2=a+frac*Math.PI*2;
    const big=frac>.5?1:0;
    const x1=cx+R*Math.cos(a), y1=cy+R*Math.sin(a), x2=cx+R*Math.cos(a2), y2=cy+R*Math.sin(a2);
    const x3=cx+r*Math.cos(a2), y3=cy+r*Math.sin(a2), x4=cx+r*Math.cos(a), y4=cy+r*Math.sin(a);
    if(frac>0.9999){ seg+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${p.color}" stroke-width="${R-r}"/>`; }
    else if(frac>0){ seg+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${big} 0 ${x4} ${y4}Z" fill="${p.color}"/>`; }
    a=a2; });
  const txt=`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="12" fill="var(--mute)" font-family="IBM Plex Sans">${centerTop||""}</text>
  <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="17" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono">${centerBot||""}</text>`;
  const leg=parts.map(p=>`<span><i style="background:${p.color}"></i>${p.label} <b class="mono">${p.fmt||shortI(p.value)}</b></span>`).join("");
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <div style="width:190px;flex:0 0 auto">${svgWrap(190,190,seg+txt)}</div>
    <div class="legend" style="flex-direction:column;gap:9px;margin:0">${leg}</div></div>`;
}

/* stacked bar / line chart. cfg={labels, series:[{name,color,values,type}], yfmt} */
function chart(cfg){
  const W=760,H=300,ml=62,mr=12,mt=14,mb=38;
  const L=cfg.labels, n=L.length, pw=(W-ml-mr)/Math.max(n,1);
  const stackSum=L.map((_,i)=>cfg.series.filter(s=>s.type!=="line").reduce((a,s)=>a+(s.values[i]||0),0));
  const lineMax=cfg.series.filter(s=>s.type==="line").reduce((m,s)=>Math.max(m,...s.values.map(v=>v||0)),0);
  let max=Math.max(...stackSum,lineMax,1);
  const step=pow(10,Math.floor(Math.log10(max)));
  max=Math.ceil(max/(step/2))*(step/2);
  const y=v=>mt+(H-mt-mb)*(1-v/max);
  let g="";
  for(let k=0;k<=4;k++){ const v=max*k/4, yy=y(v);
    g+=`<line x1="${ml}" y1="${yy}" x2="${W-mr}" y2="${yy}" stroke="var(--line-soft)" stroke-width="1"/>
    <text x="${ml-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--mute)" font-family="IBM Plex Mono">${cfg.yfmt?cfg.yfmt(v):shortI(v)}</text>`; }
  const bw=Math.max(2,Math.min(pw*0.62,42));
  L.forEach((lab,i)=>{ let base=0; const cx=ml+pw*i+pw/2;
    cfg.series.filter(s=>s.type!=="line").forEach(s=>{ const v=s.values[i]||0; if(v<=0){return;}
      const h=(H-mt-mb)*v/max; const yy=y(base+v);
      g+=`<rect x="${cx-bw/2}" y="${yy}" width="${bw}" height="${Math.max(h,0)}" fill="${s.color}" rx="2"><title>${lab} - ${s.name}: ${cfg.tfmt?cfg.tfmt(v):shortI(v)}</title></rect>`;
      base+=v; });
  });
  cfg.series.filter(s=>s.type==="line").forEach(s=>{
    const pts=s.values.map((v,i)=>`${ml+pw*i+pw/2},${y(v||0)}`).join(" ");
    g+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round"/>`;
    s.values.forEach((v,i)=>{ g+=`<circle cx="${ml+pw*i+pw/2}" cy="${y(v||0)}" r="3" fill="${s.color}"><title>${L[i]} - ${s.name}: ${cfg.tfmt?cfg.tfmt(v):shortI(v)}</title></circle>`; });
  });
  const every=Math.ceil(n/14);
  L.forEach((lab,i)=>{ if(i%every) return;
    g+=`<text x="${ml+pw*i+pw/2}" y="${H-14}" text-anchor="middle" font-size="11" fill="var(--mute)" font-family="IBM Plex Mono">${lab}</text>`; });
  if(cfg.xTitle) g+=`<text x="${(W+ml)/2}" y="${H-1}" text-anchor="middle" font-size="10.5" fill="var(--mute)">${cfg.xTitle}</text>`;
  const leg=cfg.series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join("");
  return svgWrap(W,H,g)+`<div class="legend">${leg}</div>`;
}

/* guilloche pattern for the result note */
function guilloche(){
  let p="";
  for(let k=0;k<7;k++){
    let d="",R=60+k*7,rr=26+k*3.4,ph=k*0.5;
    for(let t=0;t<=360;t+=3){ const a=t*Math.PI/180;
      const x=200+ (R*Math.cos(a)+rr*Math.cos(7*a+ph));
      const y=70 + (R*Math.sin(a)+rr*Math.sin(7*a+ph))*0.42;
      d+=(t?"L":"M")+x.toFixed(1)+" "+y.toFixed(1); }
    p+=`<path d="${d}Z" fill="none" stroke="currentColor" stroke-width="0.6"/>`; }
  return `<svg class="guilloche" viewBox="0 0 400 140" preserveAspectRatio="xMidYMid slice">${p}</svg>`;
}

/* ---------- input widgets ---------- */
function fieldHTML(f,val){
  const id="f_"+f.k;
  let ctl="";
  if(f.type==="select"){
    ctl=`<select id="${id}" data-k="${f.k}">${f.opts.map(o=>`<option value="${o.v}" ${String(o.v)===String(val)?"selected":""}>${o.t}</option>`).join("")}</select>`;
  } else if(f.type==="seg"){
    ctl=`<div class="seg" id="${id}" data-k="${f.k}">${f.opts.map(o=>`<button type="button" data-v="${o.v}" class="${String(o.v)===String(val)?"on":""}">${o.t}</button>`).join("")}</div>`;
  } else if(f.type==="toggle"){
    return `<div class="field"><div class="switch ${val?"on":""}" id="${id}" data-k="${f.k}" role="switch" tabindex="0" aria-checked="${!!val}"><i></i><label style="font-size:13.5px;cursor:pointer">${f.label}</label></div>
      ${f.hint?`<div style="font-size:11.5px;color:var(--mute);margin-top:5px">${f.hint}</div>`:""}</div>`;
  } else if(f.type==="date"){
    ctl=`<input type="date" id="${id}" data-k="${f.k}" value="${val}" style="width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card-2);outline:none">`;
  } else if(f.type==="cash"){
    ctl=`<div id="${id}" data-k="${f.k}"></div>`;
  } else {
    const pre=f.type==="money"?"\u20B9":"", suf=f.type==="pct"?"%":(f.unit||"");
    const box=`<div class="vbox"><span class="pre">${pre}</span><input type="text" inputmode="decimal" id="${id}" data-k="${f.k}" value="${val}"><span class="suf">${suf}</span></div>`;
    ctl=(f.min!==undefined)
      ? `<div class="vwrap"><input type="range" id="${id}_r" min="${f.min}" max="${f.max}" step="${f.step||1}" value="${Math.min(Math.max(val,f.min),f.max)}" aria-label="${f.label}">${box}</div>`
      : box;
  }
  const badge=f.type==="money"&&isFinite(+val)&&+val>=1000?`<span class="hint" style="border:0">${shortI(+val)}</span>`:(f.hint?`<span class="hint" title="${f.hint}">${f.hintShort||"?"}</span>`:"");
  return `<div class="field"><div class="flabel"><label for="${id}">${f.label}</label>${badge}</div>${ctl}</div>`;
}
</script>
<script>
/* ============================================================
   FinForge - app controller
   ============================================================ */
const CALCS=[];            // filled by the registry files below
const CATS=["Grow your money","Measure returns","Deposits & small savings","Retirement","Loans & EMI","Tax","Trading & markets","Plan your life","Everyday & business"];
const byId=id=>CALCS.find(c=>c.id===id);
let cur=null, state={};

function defaults(c){ const o={}; c.inputs.forEach(f=>o[f.k]=(typeof f.def==="function"?f.def():f.def)); return o; }
function load(c){ try{ const s=JSON.parse(localStorage.getItem("ff:"+c.id)||"null");
    const d=defaults(c); if(s) for(const k in d) if(s[k]!==undefined) d[k]=s[k];
    return d; }catch(e){ return defaults(c); } }
function save(){ try{ localStorage.setItem("ff:"+cur.id,JSON.stringify(state)); }catch(e){} }

/* ---------- sidebar ---------- */
function buildSide(filter=""){
  const f=filter.trim().toLowerCase();
  const html=CATS.map(cat=>{
    const list=CALCS.filter(c=>c.cat===cat&&(!f||(c.name+" "+c.blurb+" "+(c.tags||"")).toLowerCase().includes(f)));
    if(!list.length) return "";
    return `<div class="cat"><h4>${cat}</h4>${list.map(c=>
      `<a href="javascript:void 0" data-go="${c.id}" class="${cur&&cur.id===c.id?"on":""}"><span class="dot"></span>${c.name}</a>`).join("")}</div>`;
  }).join("");
  $("#side").innerHTML=html||`<div style="padding:20px;color:var(--mute);font-size:13px">Nothing matches that. Try "sip", "loan", "tax" or "gratuity".</div>`;
}

/* ---------- home ---------- */
function renderHome(){
  cur=null;
  $("#main").innerHTML=`
  <div class="chead">
    <div class="eyebrow">100 calculators &middot; India-specific &middot; works offline</div>
    <h1>Every money question, one answer sheet.</h1>
    <p>Slab-accurate tax, real amortisation schedules, month-by-month simulations instead of shortcuts, and a full working for each result so you can check the number yourself. Pick a calculator, or search above.</p>
  </div>
  ${CATS.map(cat=>`<div class="sechead"><h2>${cat}</h2><em>${CALCS.filter(c=>c.cat===cat).length} calculators</em></div>
    <div class="home-grid">${CALCS.filter(c=>c.cat===cat).map(c=>
      `<div class="tile" onclick="go('${c.id}')"><b>${c.name}</b><span>${c.blurb}</span></div>`).join("")}</div>`).join("")}
  <footer>Built for Indian investors. Every figure is an estimate from the inputs you enter - actual bank, fund house and Income Tax Department numbers can differ because of rounding conventions, value dates and rules that change with each Finance Act. Tax logic follows FY 2025-26 and FY 2026-27 rules (slabs unchanged). Verify anything you plan to act on. Not investment advice.</footer>`;
  buildSide($("#q").value);
  document.title="FinForge - Indian Financial Calculator Suite";
}

/* ---------- calculator page ---------- */
function renderCalc(c){
  cur=c; state=load(c);
  const presets=(c.presets||[]).map((p,i)=>`<button class="chip" data-p="${i}">${p.t}</button>`).join("");
  $("#main").innerHTML=`
    <div class="chead">
      <div class="eyebrow">${c.cat}</div>
      <h1>${c.name}</h1>
      <p>${c.blurb}</p>
    </div>
    ${presets?`<div class="chips">${presets}</div>`:""}
    <div class="grid">
      <div class="card"><div class="hd"><h3>What you put in</h3><button class="btn" id="resetBtn" style="padding:4px 10px;font-size:12px">Reset</button></div>
        <div class="bd" id="inputs"></div></div>
      <div id="out"></div>
    </div>
    <div class="stack" id="blocks"></div>
    <footer>Estimates from your inputs. Bank, AMC and tax-department figures can differ on rounding, value dates and rule changes. Not investment advice.</footer>`;
  $("#inputs").innerHTML=c.inputs.map(f=>fieldHTML(f,state[f.k])).join("");
  c.inputs.filter(f=>f.type==="cash").forEach(f=>renderCash(f));
  bindInputs();
  $("#resetBtn").onclick=()=>{ state=defaults(c); save(); renderCalc(c); };
  $$(".chip").forEach(b=>b.onclick=()=>{ Object.assign(state,c.presets[+b.dataset.p].v); save(); renderCalc(c); });
  compute();
  buildSide($("#q").value);
  document.title=c.name+" - FinForge";
}

function bindInputs(){
  $$("#inputs [data-k]").forEach(el=>{
    const k=el.dataset.k, f=cur.inputs.find(x=>x.k===k);
    if(f.type==="seg"){ $$("button",el).forEach(b=>b.onclick=()=>{ state[k]=b.dataset.v;
        $$("button",el).forEach(x=>x.classList.toggle("on",x===b)); commit(); }); return; }
    if(f.type==="toggle"){ const t=()=>{ state[k]=!state[k]; el.classList.toggle("on",state[k]); el.setAttribute("aria-checked",!!state[k]); commit(); };
      el.onclick=t; el.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();t();} }; return; }
    if(f.type==="cash") return;
    if(f.type==="select"||f.type==="date"){ el.onchange=()=>{ state[k]=el.value; commit(); }; return; }
    const rng=$("#f_"+k+"_r");
    el.addEventListener("input",()=>{ const v=parseFloat(String(el.value).replace(/[, ]/g,""));
      state[k]=isNaN(v)?0:v; if(rng&&isFinite(v)) rng.value=Math.min(Math.max(v,f.min),f.max); commit(true); });
    el.addEventListener("blur",()=>{ el.value=state[k]; refreshBadges(); });
    if(rng) rng.addEventListener("input",()=>{ state[k]=parseFloat(rng.value); el.value=rng.value; commit(true); });
  });
}
function refreshBadges(){ /* badge text lives in the label row; cheap re-render of that only */
  cur.inputs.forEach(f=>{ if(f.type!=="money") return;
    const lab=$("#f_"+f.k)?.closest(".field")?.querySelector(".flabel .hint");
    if(lab) lab.textContent=(+state[f.k]>=1000)?shortI(+state[f.k]):""; });
}
let tmr=null;
function commit(debounce){ save(); refreshBadges();
  if(debounce){ clearTimeout(tmr); tmr=setTimeout(compute,90); } else compute(); }

/* cashflow editor (XIRR / net worth style inputs) */
function renderCash(f){
  const host=$("#f_"+f.k); if(!host) return;
  const rows=state[f.k]||[];
  host.innerHTML=rows.map((r,i)=>`<div class="cf">
      <input type="date" value="${r.d}" data-i="${i}" data-p="d">
      <input type="text" inputmode="decimal" value="${r.a}" data-i="${i}" data-p="a" placeholder="- invest / + receive">
      <button data-del="${i}" title="Remove">&times;</button></div>`).join("")
    +`<button class="btn" id="addcf_${f.k}" style="margin-top:4px">+ Add row</button>`;
  $$("input",host).forEach(inp=>inp.onchange=()=>{ const i=+inp.dataset.i,p=inp.dataset.p;
    state[f.k][i][p]= p==="a" ? (parseFloat(String(inp.value).replace(/[, ]/g,""))||0) : inp.value; commit(); });
  $$("[data-del]",host).forEach(b=>b.onclick=()=>{ state[f.k].splice(+b.dataset.del,1); save(); renderCash(f); compute(); });
  $("#addcf_"+f.k).onclick=()=>{ const last=rows[rows.length-1];
    state[f.k].push({d:last?last.d:new Date().toISOString().slice(0,10),a:0}); save(); renderCash(f); compute(); };
}

/* ---------- compute + output ---------- */
function compute(){
  let r; try{ r=cur.run(state); }catch(e){ console.error(e); r={hero:{label:"Check the inputs",value:"--",sub:e.message}}; }
  const kpis=(r.kpis||[]).map(k=>`<div class="kpi"><div class="k">${k.k}</div><div class="v ${k.tone||""}">${k.v}</div></div>`).join("");
  $("#out").innerHTML=`<div class="note">${guilloche()}
      <div class="inner"><div class="lbl">${r.hero.label}</div>
        <div class="big">${r.hero.value}</div>
        <div class="sub">${r.hero.sub||""}</div></div>
      <div class="perf"></div>
      <div class="kpis">${kpis}</div></div>
      ${r.warn?`<div class="warn">${r.warn}</div>`:""}`;
  const b=[];
  if(r.donut) b.push(block("Where the money comes from",donut(r.donut,r.donutTop,r.donutBot)));
  if(r.chart) b.push(block(r.chart.title||"Year by year",chart(r.chart)));
  if(r.chart2) b.push(block(r.chart2.title||"Breakdown",chart(r.chart2)));
  if(r.table) b.push(block(r.table.title||"Schedule",tableHTML(r.table)));
  if(r.table2) b.push(block(r.table2.title||"Detail",tableHTML(r.table2)));
  if(r.formula) b.push(block("How this is worked out",`<div class="formula">${r.formula}</div>`));
  if(r.notes&&r.notes.length) b.push(block("Worth knowing",`<ul class="notes">${r.notes.map(n=>`<li>${n}</li>`).join("")}</ul>`));
  $("#blocks").innerHTML=b.join("");
  window.__last=r;
}
function block(title,inner){ return `<div class="card"><div class="hd"><h3>${title}</h3></div><div class="bd">${inner}</div></div>`; }
function tableHTML(t){
  const foot=t.foot?`<tfoot><tr>${t.foot.map(c=>`<td>${c}</td>`).join("")}</tr></tfoot>`:"";
  return `<div class="tblwrap"><table><thead><tr>${t.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
    <tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>${foot}</table></div>
    ${t.note?`<div style="font-size:12px;color:var(--mute);margin-top:9px">${t.note}</div>`:""}`;
}

/* ---------- routing (works inside sandboxed frames too) ---------- */
let curId="home";
function go(id){ curId=id||"home"; try{ location.hash=curId; }catch(e){} route(); }
function route(){ const c=byId(curId); try{ window.scrollTo(0,0); }catch(e){}
  if(c) renderCalc(c); else renderHome(); }
try{ window.addEventListener("hashchange",()=>{
  let h=""; try{ h=location.hash.replace(/^#/,""); }catch(e){ return; }
  if(h&&h!==curId){ curId=h; route(); } }); }catch(e){}
$("#q").addEventListener("input",e=>{ buildSide(e.target.value);
  if(e.target.value.trim()&&window.innerWidth<=900) $("#side").classList.add("open"); });
$("#menuBtn").onclick=()=>$("#side").classList.toggle("open");
$("#side").addEventListener("click",e=>{ const a=e.target.closest("a[data-go]");
  if(a){ e.preventDefault(); $("#side").classList.remove("open"); go(a.dataset.go); } });
$("#themeBtn").onclick=()=>{ const d=document.documentElement.getAttribute("data-theme")==="dark";
  document.documentElement.setAttribute("data-theme",d?"light":"dark");
  try{localStorage.setItem("ff:theme",d?"light":"dark");}catch(e){}
  $("#themeBtn").innerHTML=d?"&#9789;":"&#9788;"; if(cur) compute(); };
try{ if(localStorage.getItem("ff:theme")==="dark"){ document.documentElement.setAttribute("data-theme","dark"); $("#themeBtn").innerHTML="&#9788;"; } }catch(e){}
</script>
<script>
/* ============================================================
   Registry A - Grow your money / Measure returns
   ============================================================ */
const C={inv:"#4C5C7A",ret:"#0B8C63",tax:"#B9761A",bal:"#8E2C63",alt:"#7C8DB0",red:"#B4372F"};
const N=v=>{const x=parseFloat(String(v).replace(/[, ]/g,""));return isNaN(x)?0:x;};
const F=(...a)=>a.join("\n");
function add(c){CALCS.push(c);}
const M=(k,label,def,min,max,step,extra={})=>Object.assign({k,label,type:"money",def,min,max,step},extra);
const P=(k,label,def,min=1,max=30,step=0.1,extra={})=>Object.assign({k,label,type:"pct",def,min,max,step},extra);
const Y=(k,label,def,min=1,max=40,step=1,extra={})=>Object.assign({k,label,type:"num",unit:"years",def,min,max,step},extra);

/* ---- 1. SIP ---- */
add({id:"sip",cat:"Grow your money",name:"SIP calculator",tags:"mutual fund monthly systematic investment plan",
 blurb:"What a fixed monthly investment grows into, with the month-by-month compounding a fund actually applies.",
 presets:[{t:"Starter \u20B95,000",v:{amt:5000,rate:12,yrs:10}},{t:"Serious \u20B925,000",v:{amt:25000,rate:12,yrs:20}},{t:"Aggressive 15%",v:{amt:15000,rate:15,yrs:15}}],
 inputs:[M("amt","Monthly investment",10000,500,500000,500),P("rate","Expected return (p.a.)",12,1,30,0.5),Y("yrs","Investment period",10,1,40,1),
   {k:"due",label:"Invest at the start of each month",type:"toggle",def:true,hint:"How SIPs actually work - the first instalment gets a full month of growth. Turning this off matches calculators that assume month-end."}],
 run(s){const p=N(s.amt),r=N(s.rate)/1200,n=N(s.yrs)*12,due=!!s.due;
  const fv=fvAnnuity(p,r,n,due),inv=p*n,g=fv-inv;
  const L=[],A=[],B=[];let bal=0;const rows=[];
  for(let y=1;y<=N(s.yrs);y++){for(let m=0;m<12;m++){if(due)bal=(bal+p)*(1+r);else bal=bal*(1+r)+p;}
    const ci=p*12*y;L.push("Y"+y);A.push(ci);B.push(bal-ci);
    rows.push([y,money(p*12),money(ci),money(bal-ci),money(bal)]);}
  return{hero:{label:"Value after "+N(s.yrs)+" years",value:money(fv),sub:shortI(fv)+" from "+shortI(inv)+" invested"},
   kpis:[{k:"You invest",v:money(inv)},{k:"Wealth gained",v:money(g),tone:"g"},
     {k:"Growth multiple",v:num(fv/inv,2)+"x",tone:"p"},{k:"Absolute return",v:pct(g/inv*100,1),tone:"g"}],
   donut:[{label:"Invested",value:inv,color:C.inv,fmt:money(inv)},{label:"Returns",value:g,color:C.ret,fmt:money(g)}],
   donutTop:"Corpus",donutBot:shortI(fv),
   chart:{title:"How invested money and returns stack up",labels:L,series:[{name:"Invested",color:C.inv,values:A},{name:"Returns",color:C.ret,values:B}]},
   table:{title:"Year-wise growth",cols:["Year","Invested this year","Invested so far","Returns so far","Value"],rows,
     foot:["Total",money(inv),money(inv),money(g),money(fv)]},
   formula:F("i = "+N(s.rate)+"% / 12 = "+num(r*100,4)+"% per month     n = "+N(s.yrs)+" x 12 = "+n+" months",
     "FV = P x [ (1+i)^n - 1 ] / i"+(due?" x (1+i)":""),
     "   = "+inr(p)+" x "+num((pow(1+r,n)-1)/r,4)+(due?" x "+num(1+r,6):"")+" = "+money(fv)),
   notes:["A steady return every month is an assumption, not a promise - equity funds deliver the same average in a very uneven order, and the order matters for money you withdraw.",
    "Returns shown are before exit load, and before capital gains tax. Equity LTCG is 12.5% above \u20B91.25 lakh of gains in a year.",
    "The fund's expense ratio is already inside the NAV, so enter the return you expect net of expenses."]}}});

/* ---- 2. Step-up SIP ---- */
add({id:"stepup",cat:"Grow your money",name:"Step-up SIP",tags:"top-up increase annual sip growth",
 blurb:"Raise your SIP by a fixed percentage every year, the way a salary hike lets you. The gap against a flat SIP is usually startling.",
 inputs:[M("amt","Starting monthly investment",10000,500,500000,500),P("step","Annual increase",10,0,50,1),
   P("rate","Expected return (p.a.)",12,1,30,0.5),Y("yrs","Investment period",15,1,40,1)],
 run(s){const p0=N(s.amt),st=N(s.step)/100,r=N(s.rate)/1200,yy=N(s.yrs);
  let bal=0,inv=0,p=p0;const L=[],A=[],B=[],D=[],rows=[];let flat=0;
  for(let y=1;y<=yy;y++){for(let m=0;m<12;m++){bal=(bal+p)*(1+r);flat=(flat+p0)*(1+r);inv+=p;}
   L.push("Y"+y);A.push(inv);B.push(bal-inv);D.push(flat);
   rows.push([y,money(p),money(inv),money(bal),money(bal-flat)]);p=p*(1+st);}
  const g=bal-inv;
  return{hero:{label:"Value after "+yy+" years",value:money(bal),sub:"A flat \u20B9"+inr(p0)+" SIP would reach "+money(flat)},
   kpis:[{k:"You invest",v:money(inv)},{k:"Wealth gained",v:money(g),tone:"g"},
    {k:"Extra vs flat SIP",v:money(bal-flat),tone:"p"},{k:"Last year's SIP",v:money(p/(1+st))}],
   donut:[{label:"Invested",value:inv,color:C.inv,fmt:money(inv)},{label:"Returns",value:g,color:C.ret,fmt:money(g)}],
   donutTop:"Corpus",donutBot:shortI(bal),
   chart:{title:"Step-up corpus vs a flat SIP",labels:L,series:[{name:"Invested",color:C.inv,values:A},{name:"Returns",color:C.ret,values:B},{name:"Flat SIP corpus",color:C.bal,values:D,type:"line"}]},
   table:{title:"Year-wise",cols:["Year","Monthly SIP","Invested so far","Value","Lead over flat SIP"],rows},
   formula:F("Simulated month by month, because a step-up has no clean closed form.",
     "Every month:  balance = (balance + SIP) x (1 + i)",
     "Every 12 months:  SIP = SIP x (1 + "+N(s.step)+"%)",
     "i = "+num(r*100,4)+"% per month"),
   notes:["A 10% annual step-up roughly tracks an average salary increment, so this is usually the realistic plan and a flat SIP is the pessimistic one.",
    "Most fund platforms let you register the step-up once, at SIP registration, so it happens without you deciding again each year."]}}});

/* ---- 3. Lumpsum ---- */
add({id:"lumpsum",cat:"Grow your money",name:"Lumpsum calculator",tags:"one time investment fixed compound",
 blurb:"One-time investment compounded annually - for a bonus, a maturity payout or a windfall.",
 inputs:[M("amt","Amount invested",500000,1000,100000000,1000),P("rate","Expected return (p.a.)",12,1,30,0.5),Y("yrs","Period",10,1,40,1)],
 run(s){const p=N(s.amt),r=N(s.rate)/100,y=N(s.yrs),fv=p*pow(1+r,y),g=fv-p;
  const L=[],A=[],B=[],rows=[];
  for(let k=1;k<=y;k++){const v=p*pow(1+r,k);L.push("Y"+k);A.push(p);B.push(v-p);rows.push([k,money(v),money(v-p),pct((v/p-1)*100,1)]);}
  return{hero:{label:"Value after "+y+" years",value:money(fv),sub:num(fv/p,2)+" times your money"},
   kpis:[{k:"Invested",v:money(p)},{k:"Gain",v:money(g),tone:"g"},{k:"Multiple",v:num(fv/p,2)+"x",tone:"p"},{k:"Doubles in",v:num(Math.log(2)/Math.log(1+r),1)+" yrs"}],
   donut:[{label:"Invested",value:p,color:C.inv,fmt:money(p)},{label:"Returns",value:g,color:C.ret,fmt:money(g)}],donutTop:"Corpus",donutBot:shortI(fv),
   chart:{labels:L,series:[{name:"Invested",color:C.inv,values:A},{name:"Returns",color:C.ret,values:B}]},
   table:{cols:["Year","Value","Cumulative gain","Absolute return"],rows},
   formula:"FV = P x (1+r)^n = "+inr(p)+" x (1+"+N(s.rate)+"%)^"+y+" = "+money(fv),
   notes:["Investing a large sum in one go carries timing risk. Splitting it over 6-12 months through an STP into the same fund removes most of that risk at a small cost in expected return."]}}});

/* ---- 4. Goal SIP ---- */
add({id:"goalsip",cat:"Grow your money",name:"SIP needed for a goal",tags:"target corpus reverse sip required",
 blurb:"Work backwards from the amount you need: how much has to go in every month, allowing for what you already have and for inflation on the goal.",
 inputs:[M("goal","Amount needed (in today's money)",10000000,50000,500000000,50000),Y("yrs","Years to the goal",15,1,40,1),
   P("rate","Expected return (p.a.)",12,1,30,0.5),P("infl","Inflation on this goal",6,0,15,0.5,{hint:"Education inflates ~10%, general spending ~6%"}),
   M("have","Already saved for this",0,0,100000000,10000),P("step","Annual step-up in SIP",0,0,30,1)],
 run(s){const goalT=N(s.goal),y=N(s.yrs),r=N(s.rate)/1200,inf=N(s.infl)/100,have=N(s.have),st=N(s.step)/100;
  const goal=goalT*pow(1+inf,y),n=y*12;
  const fromHave=have*pow(1+N(s.rate)/100,y),need=Math.max(goal-fromHave,0);
  const fvOf=p=>{let b=0,q=p;for(let k=1;k<=y;k++){for(let m=0;m<12;m++)b=(b+q)*(1+r);q*=(1+st);}return b;};
  const sip=need<=0?0:(st>0?bisect(x=>fvOf(x)-need,0,need,1e-4):need/((pow(1+r,n)-1)/r*(1+r)));
  let b=0,q=sip,inv=0;const L=[],A=[],B=[],rows=[];
  for(let k=1;k<=y;k++){for(let m=0;m<12;m++){b=(b+q)*(1+r);inv+=q;}L.push("Y"+k);A.push(inv);B.push(b-inv);
   rows.push([k,money(q),money(inv),money(b+have*pow(1+N(s.rate)/100,k))]);q*=(1+st);}
  return{hero:{label:"Monthly SIP required",value:money(sip),sub:need<=0?"What you already have covers this goal":"To reach "+money(goal)+" in "+y+" years"},
   kpis:[{k:"Goal today",v:money(goalT)},{k:"Goal at "+N(s.infl)+"% inflation",v:money(goal),tone:"a"},
    {k:"Existing corpus grows to",v:money(fromHave),tone:"p"},{k:"SIP must build",v:money(need),tone:"g"}],
   donut:[{label:"From existing corpus",value:fromHave,color:C.bal,fmt:money(fromHave)},{label:"From new SIP",value:need,color:C.ret,fmt:money(need)}],
   donutTop:"Goal",donutBot:shortI(goal),
   chart:{title:"Build-up of the new SIP",labels:L,series:[{name:"Invested",color:C.inv,values:A},{name:"Returns",color:C.ret,values:B}]},
   table:{cols:["Year","Monthly SIP","Invested so far","Total corpus"],rows},
   formula:F("Goal in future money = "+inr(goalT)+" x (1+"+N(s.infl)+"%)^"+y+" = "+money(goal),
     "Less existing corpus grown at "+N(s.rate)+"%: "+money(fromHave),
     st>0?"Step-up SIP solved numerically so the corpus lands exactly on the shortfall.":"SIP = shortfall / ( [ (1+i)^n - 1 ] / i x (1+i) )"),
   notes:["Ignoring inflation on the goal is the single most common planning error. A \u20B91 crore education bill today is about \u20B94.2 crore in 15 years at 10%.",
    "If the required SIP looks impossible, the levers are: more years, a step-up, or a smaller goal - not a higher assumed return."]}}});

/* ---- 5. SWP ---- */
add({id:"swp",cat:"Grow your money",name:"SWP calculator",tags:"systematic withdrawal plan income retirement drawdown",
 blurb:"Draw a monthly income from a corpus and see how long it survives - with an option to raise the withdrawal each year for inflation.",
 inputs:[M("corpus","Corpus",10000000,100000,500000000,100000),M("draw","Monthly withdrawal",50000,1000,2000000,1000),
   P("rate","Expected return (p.a.)",9,0,25,0.5),P("hike","Annual increase in withdrawal",0,0,15,0.5),Y("yrs","Show for",25,1,50,1)],
 run(s){let bal=N(s.corpus);const r=N(s.rate)/1200;let w=N(s.draw);const hike=N(s.hike)/100,y=N(s.yrs);
  let total=0,months=0,dead=0;const L=[],A=[],B=[],rows=[];
  for(let k=1;k<=y;k++){let wy=0;
   for(let m=0;m<12;m++){ if(bal<=0){if(!dead)dead=months;break;}
     const take=Math.min(w,bal);bal-=take;total+=take;wy+=take;bal*=(1+r);months++; }
   L.push("Y"+k);A.push(Math.max(bal,0));B.push(total);
   rows.push([k,money(w),money(wy),money(Math.max(bal,0))]);w*=(1+hike);}
  if(bal>0)dead=0;
  return{hero:{label:dead?"Corpus runs out in":"Corpus left after "+y+" years",value:dead?(Math.floor(dead/12)+" yr "+(dead%12)+" mo"):money(bal),
    sub:dead?"After withdrawing "+money(total)+" in total":"You withdrew "+money(total)+" and still hold "+shortI(bal)},
   kpis:[{k:"Total withdrawn",v:money(total),tone:"g"},{k:"Withdrawal rate",v:pct(N(s.draw)*12/N(s.corpus)*100,2),tone:N(s.draw)*12/N(s.corpus)>0.06?"r":"g"},
    {k:"Balance at end",v:money(Math.max(bal,0))},{k:"Months paid",v:months}],
   chart:{title:"Balance left vs cash taken out",labels:L,series:[{name:"Balance",color:C.bal,values:A},{name:"Withdrawn so far",color:C.ret,values:B,type:"line"}]},
   table:{cols:["Year","Monthly withdrawal","Withdrawn in year","Closing balance"],rows},
   formula:F("Each month:  balance = (balance - withdrawal) x (1 + i)",
     "i = "+num(r*100,4)+"% per month. Withdrawal taken first, then growth - the conservative order."),
   warn:N(s.draw)*12/N(s.corpus)>0.06?"You are drawing "+pct(N(s.draw)*12/N(s.corpus)*100,1)+" of the corpus a year. Above roughly 6%, an ordinary run of bad early years can empty it far sooner than this straight-line view suggests.":null,
   notes:["Each SWP redemption is a partial sale, so only the gain portion is taxed - which usually makes an SWP more tax-efficient than dividends or FD interest.",
    "This assumes a steady return. Poor returns in the first few years of withdrawal do disproportionate damage, because you sell more units at low prices."]}}});

/* ---- 6. STP ---- */
add({id:"stp",cat:"Grow your money",name:"STP calculator",tags:"systematic transfer plan debt to equity staggered",
 blurb:"Park a lumpsum in a debt fund and shift it into equity in instalments. Shows both pots and the combined value.",
 inputs:[M("corpus","Lumpsum parked in the debt fund",1000000,50000,100000000,50000),M("draw","Monthly transfer into equity",50000,1000,5000000,1000),
   P("dr","Debt fund return",6.5,0,12,0.25),P("er","Equity fund return",12,0,30,0.5),Y("yrs","Total period held",5,1,30,1)],
 run(s){let d=N(s.corpus),e=0;const di=N(s.dr)/1200,ei=N(s.er)/1200,t=N(s.draw),y=N(s.yrs);
  const L=[],A=[],B=[],rows=[];let moved=0;
  for(let k=1;k<=y;k++){for(let m=0;m<12;m++){const x=Math.min(t,d);d-=x;e+=x;moved+=x;d*=(1+di);e*=(1+ei);}
   L.push("Y"+k);A.push(d);B.push(e);rows.push([k,money(d),money(e),money(d+e)]);}
  const tot=d+e,lump=N(s.corpus)*pow(1+N(s.er)/100,y);
  return{hero:{label:"Combined value after "+y+" years",value:money(tot),sub:"Straight equity lumpsum would be "+money(lump)},
   kpis:[{k:"Moved into equity",v:money(moved)},{k:"Equity pot",v:money(e),tone:"g"},{k:"Debt pot left",v:money(d)},
    {k:"vs lumpsum",v:(tot>=lump?"+":"")+shortI(tot-lump),tone:tot>=lump?"g":"r"}],
   chart:{title:"Debt pot draining into equity",labels:L,series:[{name:"Debt fund",color:C.inv,values:A},{name:"Equity fund",color:C.ret,values:B}]},
   table:{cols:["Year","Debt balance","Equity value","Total"],rows},
   formula:"Each month: transfer min(amount, debt balance), then grow both pots at their own monthly rate.",
   notes:["An STP trades a little expected return for a lot less timing regret. In a rising market a lumpsum wins; in a falling or flat one the STP does.",
    "Every transfer is a redemption from the debt fund, so gains on each instalment are taxable at your slab rate for funds bought after 1 April 2023."]}}});

/* ---- 7. Cost of delay ---- */
add({id:"delay",cat:"Grow your money",name:"Cost of delaying a SIP",tags:"procrastination start early time value",
 blurb:"What waiting a few years costs you - the most expensive number in personal finance.",
 inputs:[M("amt","Monthly SIP",10000,500,500000,500),P("rate","Expected return (p.a.)",12,1,30,0.5),
   Y("yrs","Years until you need the money",25,2,40,1),{k:"delay",label:"Delay in starting",type:"num",unit:"years",def:5,min:1,max:20,step:1}],
 run(s){const p=N(s.amt),r=N(s.rate)/1200,y=N(s.yrs),d=Math.min(N(s.delay),y-1);
  const now=fvAnnuity(p,r,y*12),later=fvAnnuity(p,r,(y-d)*12);
  const extraNeeded=now/(fvAnnuity(1,r,(y-d)*12));
  const L=[],A=[],B=[];
  for(let k=1;k<=y;k++){L.push("Y"+k);A.push(fvAnnuity(p,r,k*12));B.push(k<=d?0:fvAnnuity(p,r,(k-d)*12));}
  return{hero:{label:"Cost of waiting "+d+" year"+(d>1?"s":""),value:money(now-later),sub:"Corpus falls from "+shortI(now)+" to "+shortI(later)},
   kpis:[{k:"Start now",v:money(now),tone:"g"},{k:"Start in "+d+" yrs",v:money(later),tone:"a"},
    {k:"You skip investing",v:money(p*d*12)},{k:"To catch up you'd need",v:money(extraNeeded)+"/mo",tone:"r"}],
   chart:{title:"Two identical SIPs, "+d+" years apart",labels:L,series:[{name:"Started now",color:C.ret,values:A,type:"line"},{name:"Started later",color:C.tax,values:B,type:"line"}]},
   formula:F("Start now:   FV = P x [(1+i)^"+(y*12)+" - 1]/i x (1+i) = "+money(now),
     "Start later: FV = P x [(1+i)^"+((y-d)*12)+" - 1]/i x (1+i) = "+money(later),
     "You skipped only "+money(p*d*12)+" of instalments - the rest of the gap is compounding you never bought."),
   notes:["The loss is far larger than the instalments you skipped, because the missing years are the last ones, when the corpus is biggest.",
    "Starting small beats starting late. A \u20B92,000 SIP today usually beats a \u20B910,000 SIP five years from now over long horizons."]}}});

/* ---- 8. Compound interest ---- */
add({id:"compound",cat:"Grow your money",name:"Compound interest",tags:"ci compounding frequency quarterly monthly",
 blurb:"Generic compounding with any frequency, plus optional monthly additions.",
 inputs:[M("p","Principal",100000,0,100000000,1000),P("r","Interest rate (p.a.)",8,0,36,0.25),
   {k:"t",label:"Period",type:"num",unit:"years",def:5,min:0.5,max:50,step:0.5},
   {k:"n",label:"Compounded",type:"select",def:"4",opts:[{v:"1",t:"Yearly"},{v:"2",t:"Half-yearly"},{v:"4",t:"Quarterly"},{v:"12",t:"Monthly"},{v:"365",t:"Daily"}]},
   M("add","Added every month",0,0,1000000,500)],
 run(s){const p=N(s.p),r=N(s.r)/100,t=N(s.t),n=N(s.n);
  const base=p*pow(1+r/n,n*t);
  const mi=pow(1+r/n,n/12)-1, addFV=fvAnnuity(N(s.add),mi,Math.round(t*12),true);
  const fv=base+addFV,inv=p+N(s.add)*Math.round(t*12);
  const L=[],A=[],B=[],rows=[];
  for(let k=1;k<=Math.ceil(t);k++){const tt=Math.min(k,t);const v=p*pow(1+r/n,n*tt)+fvAnnuity(N(s.add),mi,Math.round(tt*12),true);
   const ci=p+N(s.add)*Math.round(tt*12);L.push("Y"+k);A.push(ci);B.push(v-ci);rows.push([k,money(ci),money(v-ci),money(v)]);}
  return{hero:{label:"Maturity value",value:money(fv),sub:"Effective annual rate "+pct((pow(1+r/n,n)-1)*100,3)},
   kpis:[{k:"Principal + additions",v:money(inv)},{k:"Interest",v:money(fv-inv),tone:"g"},
    {k:"Effective rate",v:pct((pow(1+r/n,n)-1)*100,3),tone:"p"},{k:"Multiple",v:num(fv/(inv||1),2)+"x"}],
   donut:[{label:"Principal",value:inv,color:C.inv,fmt:money(inv)},{label:"Interest",value:fv-inv,color:C.ret,fmt:money(fv-inv)}],
   donutTop:"Maturity",donutBot:shortI(fv),
   chart:{labels:L,series:[{name:"Principal",color:C.inv,values:A},{name:"Interest",color:C.ret,values:B}]},
   table:{cols:["Year","Principal so far","Interest so far","Value"],rows},
   formula:F("A = P x (1 + r/n)^(n x t)  = "+inr(p)+" x (1 + "+N(s.r)+"%/"+n+")^("+n+" x "+t+") = "+money(base),
     N(s.add)>0?"Monthly additions compounded at the equivalent monthly rate "+num(mi*100,4)+"%: "+money(addFV):""),
   notes:["Frequency matters more than people expect: 8% compounded quarterly is an effective 8.24%, and daily is 8.33%.",
    "Indian banks compound FDs quarterly by convention, so quarterly is the right default for a deposit."]}}});

/* ---- 9. Simple interest ---- */
add({id:"simple",cat:"Grow your money",name:"Simple interest",tags:"si flat interest hand loan",
 blurb:"Interest on the original principal only - how hand loans, some chit funds and flat-rate lending are quoted.",
 inputs:[M("p","Principal",100000,0,100000000,1000),P("r","Rate (p.a.)",12,0,60,0.25),
   {k:"t",label:"Period",type:"num",unit:"years",def:3,min:0.25,max:30,step:0.25}],
 run(s){const p=N(s.p),r=N(s.r)/100,t=N(s.t),si=p*r*t,ci=p*pow(1+r,t)-p;
  const L=[],A=[],B=[],rows=[];
  for(let k=1;k<=Math.ceil(t);k++){const tt=Math.min(k,t);L.push("Y"+k);A.push(p);B.push(p*r*tt);
   rows.push([k,money(p*r*tt),money(p+p*r*tt),money(p*pow(1+r,tt)-p)]);}
  return{hero:{label:"Total interest",value:money(si),sub:"Amount repayable "+money(p+si)},
   kpis:[{k:"Principal",v:money(p)},{k:"Interest",v:money(si),tone:"a"},{k:"Total",v:money(p+si)},
    {k:"If compounded",v:money(ci),tone:"r"}],
   chart:{labels:L,series:[{name:"Principal",color:C.inv,values:A},{name:"Simple interest",color:C.tax,values:B}]},
   table:{cols:["Year","Interest so far","Amount due","Same rate compounded"],rows},
   formula:"SI = P x R x T / 100 = "+inr(p)+" x "+N(s.r)+"% x "+t+" = "+money(si),
   notes:["A flat or simple rate always understates the real cost of a loan you repay in instalments - see the flat vs reducing calculator."]}}});

/* ---- 10. Rule of 72 ---- */
add({id:"rule72",cat:"Grow your money",name:"Doubling time (Rule of 72)",tags:"rule of 72 double money triple",
 blurb:"How long money takes to double, triple and 10x - the shortcut and the exact answer side by side.",
 inputs:[P("r","Annual return",12,0.5,40,0.25),M("p","Starting amount",100000,1000,100000000,1000)],
 run(s){const r=N(s.r)/100,p=N(s.p);
  const ex=Math.log(2)/Math.log(1+r),approx=72/N(s.r);
  const tri=Math.log(3)/Math.log(1+r),ten=Math.log(10)/Math.log(1+r);
  const L=[],A=[];const yr=Math.ceil(ten);
  for(let k=1;k<=Math.min(yr,40);k++){L.push("Y"+k);A.push(p*pow(1+r,k));}
  return{hero:{label:"Money doubles in",value:num(ex,1)+" years",sub:"Rule of 72 says "+num(approx,1)+" years"},
   kpis:[{k:"Doubles",v:num(ex,1)+" yrs",tone:"g"},{k:"Triples",v:num(tri,1)+" yrs"},{k:"10 times",v:num(ten,1)+" yrs",tone:"p"},
    {k:"After 10 yrs",v:money(p*pow(1+r,10))}],
   chart:{title:"Growth path",labels:L,series:[{name:"Value",color:C.ret,values:A,type:"line"}]},
   formula:F("Exact:  t = ln(2) / ln(1 + r) = "+num(ex,3)+" years",
     "Shortcut: t = 72 / rate% = 72 / "+N(s.r)+" = "+num(approx,2)+" years",
     "The shortcut is closest between about 6% and 10%."),
   notes:["Run it on inflation too: at 6%, prices double every 12 years, which is why a bank savings account loses purchasing power."]}}});

/* ---- 11. Expense ratio drag ---- */
add({id:"expratio",cat:"Grow your money",name:"Expense ratio drag",tags:"ter direct vs regular plan commission cost",
 blurb:"What a 1% difference between a regular and a direct plan actually removes from your corpus.",
 inputs:[{k:"mode",label:"Mode",type:"seg",def:"sip",opts:[{v:"sip",t:"Monthly SIP"},{v:"lump",t:"Lumpsum"}]},
   M("amt","Amount",10000,500,50000000,500),P("gross","Gross return before expenses",13,1,30,0.5),
   P("ter1","Regular plan expense ratio",1.8,0,3,0.05),P("ter2","Direct plan expense ratio",0.7,0,3,0.05),Y("yrs","Period",20,1,40,1)],
 run(s){const y=N(s.yrs),g=N(s.gross)/100,a=N(s.amt);
  const fvAt=ter=>{const r=(g-ter/100);return s.mode==="lump"?a*pow(1+r,y):fvAnnuity(a,r/12,y*12,true);};
  const v1=fvAt(N(s.ter1)),v2=fvAt(N(s.ter2)),inv=s.mode==="lump"?a:a*y*12;
  const L=[],A=[],B=[];
  for(let k=1;k<=y;k++){const r1=g-N(s.ter1)/100,r2=g-N(s.ter2)/100;
   L.push("Y"+k);A.push(s.mode==="lump"?a*pow(1+r2,k):fvAnnuity(a,r2/12,k*12,true));
   B.push(s.mode==="lump"?a*pow(1+r1,k):fvAnnuity(a,r1/12,k*12,true));}
  return{hero:{label:"Cost of the higher expense ratio",value:money(v2-v1),sub:"Over "+y+" years on "+shortI(inv)+" invested"},
   kpis:[{k:"Direct plan",v:money(v2),tone:"g"},{k:"Regular plan",v:money(v1),tone:"a"},
    {k:"Gap",v:pct((v2-v1)/v1*100,1),tone:"r"},{k:"Fee difference",v:pct(N(s.ter1)-N(s.ter2),2)+" p.a."}],
   chart:{title:"Direct vs regular",labels:L,series:[{name:"Direct plan",color:C.ret,values:A,type:"line"},{name:"Regular plan",color:C.tax,values:B,type:"line"}]},
   formula:F("Net return = gross return - expense ratio",
     "Direct:  "+N(s.gross)+"% - "+N(s.ter2)+"% = "+num(g*100-N(s.ter2),2)+"%  ->  "+money(v2),
     "Regular: "+N(s.gross)+"% - "+N(s.ter1)+"% = "+num(g*100-N(s.ter1),2)+"%  ->  "+money(v1)),
   notes:["The expense ratio is charged on the whole corpus every year, not on your contribution - which is why a fee that sounds tiny compounds into a large number.",
    "Direct plans are the same portfolio, same fund manager, without distributor commission. The trade-off is that you get no adviser with them."]}}});

/* ---- 12. Dividend ---- */
add({id:"dividend",cat:"Grow your money",name:"Dividend income & reinvestment",tags:"yield payout dividend stocks income",
 blurb:"Annual dividend income from a portfolio, and what reinvesting it instead of spending it does over time.",
 inputs:[M("val","Portfolio value",2000000,10000,500000000,10000),P("yld","Dividend yield",2.5,0,15,0.1),
   P("gr","Annual growth in price and dividend",10,0,25,0.5),Y("yrs","Period",15,1,40,1),
   {k:"re",label:"Reinvest the dividends",type:"toggle",def:true}],
 run(s){const v0=N(s.val),yl=N(s.yld)/100,g=N(s.gr)/100,y=N(s.yrs);
  let val=v0,cash=0;const L=[],A=[],B=[],rows=[];let totDiv=0;
  for(let k=1;k<=y;k++){const div=val*yl;totDiv+=div;
   if(s.re)val=(val+div)*(1+g);else{cash+=div;val=val*(1+g);}
   L.push("Y"+k);A.push(val);B.push(cash);rows.push([k,money(div),money(val),money(cash)]);}
  return{hero:{label:s.re?"Portfolio after "+y+" years":"Dividend income over "+y+" years",value:money(s.re?val:cash),
     sub:"First-year dividend "+money(v0*yl)+" ("+money(v0*yl/12)+" a month)"},
   kpis:[{k:"Total dividends",v:money(totDiv),tone:"g"},{k:"Portfolio value",v:money(val)},
    {k:"Cash taken out",v:money(cash),tone:"a"},{k:"Yield on original cost",v:pct(val*yl/v0*100,2),tone:"p"}],
   chart:{title:"Portfolio value and dividends taken",labels:L,series:[{name:"Portfolio",color:C.ret,values:A,type:"line"},{name:"Dividends taken as cash",color:C.tax,values:B}]},
   table:{cols:["Year","Dividend","Portfolio value","Cash collected"],rows},
   formula:s.re?"Each year: value = (value + value x yield) x (1 + growth)":"Each year: dividend paid out, value grows at "+N(s.gr)+"%",
   notes:["Dividends from Indian shares are taxed at your slab rate in your hands, and TDS at 10% applies above \u20B910,000 from one company in a year.",
    "Yield on original cost is the useful number for a long holder: a 2.5% yield growing 10% a year becomes a 6.5% yield on your original money in 10 years."]}}});

/* ============================ MEASURE RETURNS ============================ */

/* ---- 13. CAGR ---- */
add({id:"cagr",cat:"Measure returns",name:"CAGR calculator",tags:"compound annual growth rate annualised",
 blurb:"Turn a start value, an end value and a holding period into one comparable annual number.",
 inputs:[M("b","Initial value",100000,1,1000000000,1000),M("e","Final value",250000,1,1000000000,1000),
   {k:"t",label:"Period",type:"num",unit:"years",def:5,min:0.1,max:50,step:0.1}],
 run(s){const b=N(s.b),e=N(s.e),t=N(s.t);
  const cagr=(pow(e/b,1/t)-1)*100,abs=(e/b-1)*100;
  const L=[],A=[],B=[];
  for(let k=1;k<=Math.ceil(t);k++){const tt=Math.min(k,t);L.push("Y"+k);A.push(b*pow(e/b,tt/t));B.push(b*(1+abs/100*tt/t));}
  return{hero:{label:"CAGR",value:pct(cagr,2),sub:"Absolute return "+pct(abs,1)+" over "+num(t,1)+" years"},
   kpis:[{k:"Absolute return",v:pct(abs,1),tone:abs>=0?"g":"r"},{k:"Gain",v:money(e-b),tone:e>=b?"g":"r"},
    {k:"Multiple",v:num(e/b,2)+"x",tone:"p"},{k:"Doubling time",v:cagr>0?num(Math.log(2)/Math.log(1+cagr/100),1)+" yrs":"--"}],
   chart:{title:"Smoothed CAGR path vs a straight line",labels:L,series:[{name:"Compounded path",color:C.ret,values:A,type:"line"},{name:"Straight line",color:C.alt,values:B,type:"line"}]},
   formula:F("CAGR = (End / Begin)^(1/t) - 1",
     "     = ("+inr(e)+" / "+inr(b)+")^(1/"+num(t,2)+") - 1 = "+pct(cagr,4)),
   notes:["CAGR hides the journey. Two funds with the same CAGR can have wildly different worst years - check drawdown as well.",
    "CAGR is only valid for a single investment held throughout. If you added or withdrew money in between, use XIRR."]}}});

/* ---- 14. XIRR ---- */
add({id:"xirr",cat:"Measure returns",name:"XIRR calculator",tags:"irr cashflow uneven returns portfolio actual",
 blurb:"The real return on messy, dated cashflows - top-ups, redemptions, a final value. This is what your portfolio actually earned.",
 inputs:[{k:"cf",label:"Cashflows",type:"cash",def:()=>{const t=new Date();const y=t.getFullYear();
   return [{d:(y-3)+"-04-01",a:-100000},{d:(y-2)+"-04-01",a:-100000},{d:(y-1)+"-04-01",a:-100000},{d:t.toISOString().slice(0,10),a:420000}];}}],
 run(s){const cf=(s.cf||[]).filter(r=>r.d&&N(r.a)!==0).map(r=>({d:new Date(r.d).getTime(),a:N(r.a),t:r.d}));
  if(cf.length<2)return{hero:{label:"XIRR",value:"--",sub:"Add at least one outflow (negative) and one inflow (positive)"}};
  const out=cf.filter(c=>c.a<0).reduce((s,c)=>s-c.a,0),inn=cf.filter(c=>c.a>0).reduce((s,c)=>s+c.a,0);
  const r=xirr(cf)*100;
  const days=(Math.max(...cf.map(c=>c.d))-Math.min(...cf.map(c=>c.d)))/864e5;
  const sorted=cf.slice().sort((a,b)=>a.d-b.d);
  return{hero:{label:"XIRR",value:isFinite(r)?pct(r,2):"No solution",
    sub:isFinite(r)?"Over "+num(days/365,1)+" years, "+cf.length+" cashflows":"Cashflows must include both signs"},
   kpis:[{k:"Total invested",v:money(out)},{k:"Total received",v:money(inn),tone:"g"},
    {k:"Net gain",v:money(inn-out),tone:inn>=out?"g":"r"},{k:"Absolute return",v:pct((inn/out-1)*100,1),tone:inn>=out?"g":"r"}],
   table:{title:"Cashflows used",cols:["Date","Amount","Discounted to start"],
    rows:sorted.map(c=>[c.t,money(c.a),money(c.a/pow(1+r/100,(c.d-sorted[0].d)/(365*864e5)))]),
    foot:["Net present value at XIRR","",money(xnpv(r/100,sorted))],
    note:"Money you put in is negative, money you take out or the current value is positive. NPV at the correct XIRR is zero."},
   formula:F("XIRR solves for r in:   sum of [ CF_k / (1+r)^(days_k/365) ] = 0",
     "Solved by bisection between -99.99% and +5000%. This is the same definition Excel's XIRR uses."),
   notes:["Use this for a SIP: one negative row per instalment and one positive row for today's value.",
    "A fund's own 3-year return is a CAGR on a single lumpsum. Your XIRR will differ, because you bought at different prices."]}}});

/* ---- 15. Absolute vs annualised ---- */
add({id:"absret",cat:"Measure returns",name:"Absolute vs annualised return",tags:"holding period return simple annualise",
 blurb:"A 40% gain means very different things over 1 year and over 6. Convert between the two properly.",
 inputs:[M("b","Amount invested",100000,1,1000000000,1000),M("e","Value now",140000,1,1000000000,1000),
   {k:"d",label:"Held for",type:"num",unit:"days",def:900,min:1,max:14600,step:1}],
 run(s){const b=N(s.b),e=N(s.e),d=N(s.d),yrs=d/365;
  const abs=(e/b-1)*100,ann=(pow(e/b,1/yrs)-1)*100,naive=abs/yrs;
  return{hero:{label:"Annualised return",value:pct(ann,2),sub:"Absolute "+pct(abs,1)+" over "+num(yrs,2)+" years ("+d+" days)"},
   kpis:[{k:"Absolute",v:pct(abs,1),tone:abs>=0?"g":"r"},{k:"Annualised (correct)",v:pct(ann,2),tone:"g"},
    {k:"Simple average (wrong)",v:pct(naive,2),tone:"a"},{k:"Gain",v:money(e-b)}],
   formula:F("Absolute   = (End/Begin - 1) = "+pct(abs,3),
     "Annualised = (End/Begin)^(365/days) - 1 = "+pct(ann,3),
     "Dividing the absolute return by years gives "+pct(naive,3)+" - overstated, because it ignores compounding."),
   notes:["Under a year, quoting an annualised figure is misleading and SEBI does not allow funds to do it.",
    yrs>1?"Equity held over 12 months is long-term: 12.5% tax above \u20B91.25 lakh of gains a year.":"Held under 12 months, equity gains are short-term and taxed at 20%."]}}});

/* ---- 16. Inflation ---- */
add({id:"inflation",cat:"Measure returns",name:"Inflation impact",tags:"purchasing power cost of living future cost",
 blurb:"What today's expense costs later, and what today's money will be worth then.",
 inputs:[M("amt","Amount today",100000,100,500000000,1000),P("infl","Inflation rate",6,0,20,0.25),Y("yrs","Years ahead",20,1,50,1)],
 run(s){const a=N(s.amt),i=N(s.infl)/100,y=N(s.yrs);
  const fut=a*pow(1+i,y),worth=a/pow(1+i,y);
  const L=[],A=[],B=[],rows=[];
  for(let k=1;k<=y;k++){L.push("Y"+k);A.push(a*pow(1+i,k));B.push(a/pow(1+i,k));
   rows.push([k,money(a*pow(1+i,k)),money(a/pow(1+i,k)),pct((pow(1+i,k)-1)*100,0)]);}
  return{hero:{label:"What "+money(a)+" of spending costs in "+y+" years",value:money(fut),sub:"Prices rise "+num(fut/a,2)+" times at "+N(s.infl)+"% a year"},
   kpis:[{k:"Cost then",v:money(fut),tone:"a"},{k:"Today's "+shortI(a)+" will buy",v:money(worth),tone:"r"},
    {k:"Purchasing power lost",v:pct((1-worth/a)*100,1),tone:"r"},{k:"Prices double in",v:num(Math.log(2)/Math.log(1+i),1)+" yrs"}],
   chart:{title:"Cost rising, money shrinking",labels:L,series:[{name:"Future cost",color:C.tax,values:A,type:"line"},{name:"Value of today's money",color:C.inv,values:B,type:"line"}]},
   table:{cols:["Year","Cost of the same basket","Value of today's money","Cumulative inflation"],rows},
   formula:F("Future cost = A x (1+i)^n = "+inr(a)+" x (1+"+N(s.infl)+"%)^"+y+" = "+money(fut),
     "Today's money then = A / (1+i)^n = "+money(worth)),
   notes:["Your personal inflation is usually higher than headline CPI - school fees, medical care and rent all run well above the index.",
    "A 7% FD against 6% inflation is a 0.9% real return before tax, and negative after it."]}}});

/* ---- 17. Real return ---- */
add({id:"realret",cat:"Measure returns",name:"Real return after tax and inflation",tags:"post tax inflation adjusted fisher",
 blurb:"The only return that matters: what is left after the tax department and the price level have both taken their cut.",
 inputs:[P("nom","Nominal return",7.5,0,30,0.1),P("tax","Tax rate on this return",30,0,45,1,{hint:"FD interest is taxed at your slab; equity LTCG at 12.5%"}),
   P("infl","Inflation",6,0,20,0.25),M("amt","Amount invested",1000000,1000,500000000,10000),Y("yrs","Period",10,1,40,1)],
 run(s){const n=N(s.nom)/100,t=N(s.tax)/100,i=N(s.infl)/100,a=N(s.amt),y=N(s.yrs);
  const post=n*(1-t),real=(1+post)/(1+i)-1;
  const nomV=a*pow(1+n,y),postV=a*pow(1+post,y),realV=a*pow(1+real,y);
  const L=[],A=[],B=[],D=[];
  for(let k=1;k<=y;k++){L.push("Y"+k);A.push(a*pow(1+n,k));B.push(a*pow(1+post,k));D.push(a*pow(1+real,k));}
  return{hero:{label:"Real return after tax",value:pct(real*100,2),sub:real<0?"You are losing purchasing power":"Purchasing power grows at this rate"},
   kpis:[{k:"Nominal",v:pct(n*100,2)},{k:"After tax",v:pct(post*100,2),tone:"a"},
    {k:"After tax & inflation",v:pct(real*100,2),tone:real<0?"r":"g"},{k:"Real value in "+y+" yrs",v:money(realV),tone:real<0?"r":"g"}],
   chart:{title:"Three views of the same investment",labels:L,series:[{name:"Nominal",color:C.ret,values:A,type:"line"},{name:"After tax",color:C.tax,values:B,type:"line"},{name:"After tax and inflation",color:C.bal,values:D,type:"line"}]},
   formula:F("After tax = "+N(s.nom)+"% x (1 - "+N(s.tax)+"%) = "+pct(post*100,3),
     "Real = (1 + after-tax) / (1 + inflation) - 1 = "+pct(real*100,3),
     "The rough version (return - tax - inflation) gives "+pct((n-n*t-i)*100,3)+" and drifts at higher rates."),
   warn:real<0?"At these numbers the investment loses purchasing power every year, even though the balance keeps rising.":null,
   notes:["This is why a 7% FD in the 30% bracket is a losing proposition for a long-term goal - and why equity's tax treatment matters as much as its return."]}}});

/* ---- 18. Future / present value ---- */
add({id:"fvpv",cat:"Measure returns",name:"Future & present value",tags:"discounting npv time value of money",
 blurb:"Discount a future amount back to today, or push today's amount forward - the arithmetic behind every valuation.",
 inputs:[{k:"mode",label:"Direction",type:"seg",def:"fv",opts:[{v:"fv",t:"Today -> Future"},{v:"pv",t:"Future -> Today"}]},
   M("amt","Amount",1000000,1,1000000000,1000),P("r","Discount / growth rate",8,0,30,0.25),Y("yrs","Years",10,1,50,1)],
 run(s){const a=N(s.amt),r=N(s.r)/100,y=N(s.yrs);
  const out=s.mode==="fv"?a*pow(1+r,y):a/pow(1+r,y);
  const L=[],A=[];for(let k=0;k<=y;k++){L.push("Y"+k);A.push(s.mode==="fv"?a*pow(1+r,k):a/pow(1+r,y-k));}
  return{hero:{label:s.mode==="fv"?"Value in "+y+" years":"Value today",value:money(out),
    sub:s.mode==="fv"?"Discount factor "+num(pow(1+r,y),3):"Every rupee then is worth "+num(1/pow(1+r,y),3)+" now"},
   kpis:[{k:"Input",v:money(a)},{k:"Result",v:money(out),tone:"g"},{k:"Factor",v:num(out/a,4)+"x",tone:"p"},{k:"Rate",v:pct(N(s.r),2)}],
   chart:{labels:L,series:[{name:"Value",color:C.ret,values:A,type:"line"}]},
   formula:s.mode==="fv"?"FV = PV x (1+r)^n = "+inr(a)+" x "+num(pow(1+r,y),4)+" = "+money(out)
     :"PV = FV / (1+r)^n = "+inr(a)+" / "+num(pow(1+r,y),4)+" = "+money(out),
   notes:["The discount rate should be what you could otherwise earn on that money at similar risk. Use it to judge an offer of 'X lakh in 5 years'."]}}});
</script>
<script>
/* ============================================================
   Registry B - Deposits & small savings / Retirement
   ============================================================ */

/* ---- 19. FD ---- */
add({id:"fd",cat:"Deposits & small savings",name:"Fixed deposit",tags:"fd bank deposit maturity tds quarterly compounding",
 blurb:"Bank FD with the quarterly compounding Indian banks actually use, interest payout options, senior-citizen rates and TDS.",
 presets:[{t:"1 yr, 7%",v:{p:500000,r:7,y:1,m:0}},{t:"5 yr tax-saver",v:{p:150000,r:7.1,y:5,m:0}},{t:"Senior, 3 yr",v:{p:1000000,r:7.5,y:3,m:0,sr:true}}],
 inputs:[M("p","Deposit amount",500000,1000,100000000,1000),P("r","Interest rate",7,1,12,0.05),
   Y("y","Tenure - years",3,0,10,1),{k:"m",label:"Tenure - extra months",type:"num",unit:"months",def:0,min:0,max:11,step:1},
   {k:"mode",label:"Interest",type:"seg",def:"cum",opts:[{v:"cum",t:"Cumulative"},{v:"m",t:"Monthly payout"},{v:"q",t:"Quarterly payout"}]},
   {k:"sr",label:"Senior citizen (adds the usual 0.50% and a higher TDS threshold)",type:"toggle",def:false},
   {k:"slab",label:"Your tax slab",type:"select",def:"30",opts:[{v:"0",t:"No tax"},{v:"5",t:"5%"},{v:"10",t:"10%"},{v:"15",t:"15%"},{v:"20",t:"20%"},{v:"30",t:"30%"}]}],
 run(s){const p=N(s.p),rate=N(s.r)+(s.sr?0.5:0),r=rate/100,t=N(s.y)+N(s.m)/12;
  const cum=p*pow(1+r/4,4*t),intCum=cum-p;
  const perM=p*r/12,perQ=p*r/4;
  const payoutInt=s.mode==="m"?perM*Math.round(t*12):s.mode==="q"?perQ*Math.round(t*4):0;
  const gross=s.mode==="cum"?intCum:payoutInt, mat=s.mode==="cum"?cum:p;
  const perYear=gross/Math.max(t,.0001), thr=s.sr?100000:50000;
  const tds=perYear>thr?0.1*gross:0, slab=N(s.slab)/100, taxTot=gross*slab;
  const L=[],A=[],B=[],rows=[];let bal=p;
  for(let k=1;k<=Math.ceil(t);k++){const tt=Math.min(k,t);const v=p*pow(1+r/4,4*tt);
   L.push("Y"+k);A.push(p);B.push(v-p);rows.push([k,money(p*pow(1+r/4,4*(tt-1))),money(v-p*pow(1+r/4,4*(tt-1))),money(v)]);}
  return{hero:{label:s.mode==="cum"?"Maturity amount":"Total interest paid out",value:money(s.mode==="cum"?cum:payoutInt),
    sub:s.mode==="cum"?"Effective annual yield "+pct((pow(1+r/4,4)-1)*100,3):"Plus "+money(p)+" principal returned at maturity"},
   kpis:[{k:"Interest earned",v:money(gross),tone:"g"},{k:"Effective yield",v:pct((pow(1+r/4,4)-1)*100,2),tone:"p"},
    {k:"TDS deducted",v:money(tds),tone:tds?"a":""},{k:"After your slab tax",v:money(gross-taxTot),tone:"a"}],
   donut:[{label:"Principal",value:p,color:C.inv,fmt:money(p)},{label:"Interest",value:gross,color:C.ret,fmt:money(gross)}],
   donutTop:s.mode==="cum"?"Maturity":"Principal + interest",donutBot:shortI(p+gross),
   chart:{title:"Quarterly compounding at work",labels:L,series:[{name:"Principal",color:C.inv,values:A},{name:"Interest",color:C.ret,values:B}]},
   table:{title:"Year-wise (cumulative basis)",cols:["Year","Opening","Interest","Closing"],rows},
   formula:F("A = P x (1 + r/4)^(4t)   - Indian banks compound FDs quarterly",
     "  = "+inr(p)+" x (1 + "+num(rate,2)+"%/4)^(4 x "+num(t,2)+") = "+money(cum),
     s.mode!=="cum"?"Payout mode: interest is paid out as earned, so nothing compounds. Total = "+money(payoutInt):"",
     "TDS: 10% once interest crosses \u20B9"+inr(thr)+" per bank in a financial year"+(s.sr?" (senior citizen limit)":"")),
   warn:tds?"TDS applies here. It is not extra tax - you adjust it in your return. Submit Form 15G/15H only if your total income is genuinely below the taxable limit.":null,
   notes:["Interest is taxable in the year it accrues, even in a cumulative FD where you receive nothing until maturity.",
    "Breaking an FD early usually costs a 0.5-1% penalty and the rate is reset to the one applicable for the period actually held.",
    "Deposits are insured by DICGC up to \u20B95 lakh per bank per depositor, principal and interest combined."]}}});

/* ---- 20. RD ---- */
add({id:"rd",cat:"Deposits & small savings",name:"Recurring deposit",tags:"rd monthly deposit bank post office",
 blurb:"Monthly deposits into an RD, valued the way banks do it - each instalment compounded quarterly for the time it stays in.",
 inputs:[M("p","Monthly deposit",5000,100,1000000,500),P("r","Interest rate",6.7,1,12,0.05),
   {k:"n",label:"Tenure",type:"num",unit:"months",def:60,min:6,max:120,step:1}],
 run(s){const p=N(s.p),r=N(s.r)/100,n=Math.round(N(s.n));
  let mat=0;for(let i=1;i<=n;i++)mat+=p*pow(1+r/4,4*(n-i+1)/12);
  const inv=p*n,int=mat-inv;
  const L=[],A=[],B=[],rows=[];
  for(let k=1;k<=Math.ceil(n/12);k++){const mm=Math.min(k*12,n);let v=0;
   for(let i=1;i<=mm;i++)v+=p*pow(1+r/4,4*(mm-i+1)/12);
   L.push("Y"+k);A.push(p*mm);B.push(v-p*mm);rows.push([k,money(p*mm),money(v-p*mm),money(v)]);}
  return{hero:{label:"Maturity amount",value:money(mat),sub:money(p)+" x "+n+" months = "+money(inv)+" deposited"},
   kpis:[{k:"Total deposited",v:money(inv)},{k:"Interest",v:money(int),tone:"g"},
    {k:"Effective yield",v:pct(((pow(mat/inv,12/n*1)-1)*100),2),tone:"p"},{k:"Tenure",v:yrsTxt(n/12)}],
   donut:[{label:"Deposited",value:inv,color:C.inv,fmt:money(inv)},{label:"Interest",value:int,color:C.ret,fmt:money(int)}],
   donutTop:"Maturity",donutBot:shortI(mat),
   chart:{labels:L,series:[{name:"Deposited",color:C.inv,values:A},{name:"Interest",color:C.ret,values:B}]},
   table:{cols:["Year","Deposited so far","Interest so far","Value"],rows},
   formula:F("Each instalment is valued separately:",
     "M = sum over i of  R x (1 + r/4)^(4 x (n - i + 1)/12)",
     "The first instalment earns for "+n+" months, the last for 1."),
   notes:["An RD earns less than an FD of the same headline rate, because the average rupee is invested for only about half the tenure.",
    "TDS applies on RD interest above \u20B950,000 per bank in a year, the same threshold as an FD."]}}});

/* ---- 21. PPF ---- */
add({id:"ppf",cat:"Deposits & small savings",name:"PPF calculator",tags:"public provident fund 80c tax free 15 years",
 blurb:"15-year PPF schedule with extensions - tax-free interest, tax-free maturity, and a 80C deduction on the way in.",
 inputs:[M("p","Yearly deposit",150000,500,150000,500),P("r","Interest rate",7.1,4,12,0.05,{hint:"Reset every quarter by the government"}),
   Y("y","Years",15,1,50,1),{k:"when",label:"Deposit made",type:"seg",def:"start",opts:[{v:"start",t:"Before 5 April"},{v:"end",t:"End of year"}]}],
 run(s){const p=Math.min(N(s.p),150000),r=N(s.r)/100,y=N(s.y);
  let bal=0;const L=[],A=[],B=[],rows=[];let inv=0;
  for(let k=1;k<=y;k++){ if(s.when==="start"){bal=(bal+p)*(1+r);}else{bal=bal*(1+r)+p;}
   inv+=p;L.push("Y"+k);A.push(inv);B.push(bal-inv);
   rows.push([k,money(p),money(inv),money(bal-inv),money(bal)]);}
  const tax=Math.min(p,150000)*0.3;
  return{hero:{label:"Maturity after "+y+" years",value:money(bal),sub:"Entirely tax-free in your hands"},
   kpis:[{k:"You deposit",v:money(inv)},{k:"Interest earned",v:money(bal-inv),tone:"g"},
    {k:"Tax saved yearly (30% slab)",v:money(tax),tone:"p"},{k:"Tax-equivalent FD rate",v:pct(N(s.r)/0.7,2),tone:"g"}],
   donut:[{label:"Deposited",value:inv,color:C.inv,fmt:money(inv)},{label:"Interest",value:bal-inv,color:C.ret,fmt:money(bal-inv)}],
   donutTop:"Maturity",donutBot:shortI(bal),
   chart:{labels:L,series:[{name:"Deposited",color:C.inv,values:A},{name:"Interest",color:C.ret,values:B}]},
   table:{title:"Year-by-year passbook",cols:["Year","Deposit","Deposited so far","Interest so far","Closing balance"],rows},
   formula:F("Interest is calculated on the lowest balance between the 5th and the last day of each month, and credited on 31 March.",
     "Depositing before 5 April therefore earns a full year - this model uses "+(s.when==="start"?"that assumption":"an end-of-year deposit"),
     "Balance = (balance + deposit) x (1 + "+N(s.r)+"%) each year"),
   notes:["EEE status: deduction under 80C going in (old regime), tax-free interest, tax-free maturity. The 7.1% is worth about "+pct(N(s.r)/0.7,2)+" from a taxable FD in the 30% bracket.",
    "Maximum \u20B91.5 lakh a year across all PPF accounts you and your minor children hold. Minimum \u20B9500 to keep it active.",
    "Tenure is 15 full financial years, extendable in blocks of 5, with or without further deposits. Partial withdrawal is allowed from year 7, a loan from year 3."]}}});

/* ---- 22. Sukanya Samriddhi ---- */
add({id:"ssy",cat:"Deposits & small savings",name:"Sukanya Samriddhi Yojana",tags:"ssy girl child scheme 8.2 daughter",
 blurb:"Deposits run for 15 years, the account matures 21 years after opening. Tax-free throughout.",
 inputs:[M("p","Yearly deposit",150000,250,150000,500),P("r","Interest rate",8.2,4,12,0.05),
   {k:"age",label:"Girl's age at opening",type:"num",unit:"years",def:5,min:0,max:10,step:1}],
 run(s){const p=Math.min(N(s.p),150000),r=N(s.r)/100;
  let bal=0;const L=[],A=[],B=[],rows=[];let inv=0;
  for(let k=1;k<=21;k++){const dep=k<=15?p:0;bal=(bal+dep)*(1+r);inv+=dep;
   L.push("Y"+k);A.push(inv);B.push(bal-inv);rows.push([k,N(s.age)+k,money(dep),money(bal)]);}
  return{hero:{label:"Maturity after 21 years",value:money(bal),sub:"When she turns "+(N(s.age)+21)+". Fully tax-free."},
   kpis:[{k:"You deposit (15 yrs)",v:money(inv)},{k:"Interest",v:money(bal-inv),tone:"g"},
    {k:"Multiple",v:num(bal/inv,2)+"x",tone:"p"},{k:"Partial withdrawal at 18",v:money(bal*0.5*0.45)}],
   donut:[{label:"Deposited",value:inv,color:C.inv,fmt:money(inv)},{label:"Interest",value:bal-inv,color:C.ret,fmt:money(bal-inv)}],
   donutTop:"Maturity",donutBot:shortI(bal),
   chart:{labels:L,series:[{name:"Deposited",color:C.inv,values:A},{name:"Interest",color:C.ret,values:B}]},
   table:{cols:["Year","Her age","Deposit","Closing balance"],rows},
   formula:"Deposits for the first 15 years, interest compounded annually for all 21 years.",
   notes:["Open before the girl turns 10, one account per girl, up to two girls per family. Deposits stop after 15 years but interest keeps accruing to year 21.",
    "Up to 50% can be withdrawn for higher education once she turns 18 or passes class 10.",
    "SSY usually pays the highest rate among small savings schemes, and it qualifies for 80C under the old regime."]}}});

/* ---- 23. NSC ---- */
