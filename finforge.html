add({id:"nsc",cat:"Deposits & small savings",name:"NSC (National Savings Certificate)",tags:"nsc post office 5 year 80c",
 blurb:"Five-year post office certificate, interest compounded annually and paid at maturity.",
 inputs:[M("p","Amount invested",100000,1000,10000000,1000),P("r","Interest rate",7.7,4,12,0.05)],
 run(s){const p=N(s.p),r=N(s.r)/100;const mat=p*pow(1+r,5);
  const rows=[];let b=p;for(let k=1;k<=5;k++){const nb=b*(1+r);rows.push([k,money(b),money(nb-b),money(nb),k<5?"Reinvested - claim under 80C":"Taxable this year"]);b=nb;}
  const L=[],A=[],B=[];for(let k=1;k<=5;k++){L.push("Y"+k);A.push(p);B.push(p*pow(1+r,k)-p);}
  return{hero:{label:"Maturity after 5 years",value:money(mat),sub:"Interest "+money(mat-p)+" on "+money(p)},
   kpis:[{k:"Invested",v:money(p)},{k:"Interest",v:money(mat-p),tone:"g"},{k:"Multiple",v:num(mat/p,3)+"x",tone:"p"},{k:"Yearly interest (avg)",v:money((mat-p)/5)}],
   donut:[{label:"Invested",value:p,color:C.inv,fmt:money(p)},{label:"Interest",value:mat-p,color:C.ret,fmt:money(mat-p)}],
   donutTop:"Maturity",donutBot:shortI(mat),
   chart:{labels:L,series:[{name:"Invested",color:C.inv,values:A},{name:"Interest",color:C.ret,values:B}]},
   table:{cols:["Year","Opening","Interest","Closing","Tax treatment"],rows},
   formula:"A = P x (1+r)^5 = "+inr(p)+" x (1+"+N(s.r)+"%)^5 = "+money(mat),
   notes:["A neat quirk: interest of years 1-4 is deemed reinvested, so it also qualifies for 80C in those years under the old regime. Only the fifth year's interest is taxed without an offset.",
    "No TDS on NSC, but the interest is taxable. No upper investment limit."]}}});

/* ---- 24. KVP ---- */
add({id:"kvp",cat:"Deposits & small savings",name:"Kisan Vikas Patra",tags:"kvp double money post office",
 blurb:"The scheme that doubles your money in a fixed number of months, set by the current rate.",
 inputs:[M("p","Amount invested",100000,1000,10000000,1000),P("r","Interest rate",7.5,4,12,0.05)],
 run(s){const p=N(s.p),r=N(s.r)/100;const months=Math.ceil(Math.log(2)/Math.log(1+r)*12);
  const rows=[];for(let k=1;k<=Math.ceil(months/12);k++){const t=Math.min(k,months/12);rows.push([k,money(p*pow(1+r,t)),pct((pow(1+r,t)-1)*100,1)]);}
  const L=[],A=[],B=[];for(let k=1;k<=Math.ceil(months/12);k++){const t=Math.min(k,months/12);L.push("Y"+k);A.push(p);B.push(p*pow(1+r,t)-p);}
  return{hero:{label:"Money doubles in",value:Math.floor(months/12)+" yr "+(months%12)+" mo",sub:money(p)+" becomes "+money(2*p)},
   kpis:[{k:"Invested",v:money(p)},{k:"At maturity",v:money(2*p),tone:"g"},{k:"Months",v:months,tone:"p"},{k:"Rate used",v:pct(N(s.r),2)}],
   chart:{labels:L,series:[{name:"Invested",color:C.inv,values:A},{name:"Interest",color:C.ret,values:B}]},
   table:{cols:["Year","Value","Cumulative return"],rows},
   formula:F("Months to double = 12 x ln(2) / ln(1 + r) = "+months+" months at "+N(s.r)+"%",
     "The post office publishes this tenure directly and revises it whenever the rate changes."),
   notes:["KVP has no 80C benefit and the interest is fully taxable, so it mainly suits people who want a government-backed lock-in rather than tax efficiency.",
    "Premature encashment is allowed after 2 years 6 months."]}}});

/* ---- 25. SCSS ---- */
add({id:"scss",cat:"Deposits & small savings",name:"Senior Citizens Savings Scheme",tags:"scss retired quarterly interest 8.2",
 blurb:"Quarterly income for retirees, government-backed, up to \u20B930 lakh.",
 inputs:[M("p","Amount deposited",3000000,1000,3000000,10000),P("r","Interest rate",8.2,4,12,0.05),
   {k:"ext",label:"Extend by 3 years after the 5-year term",type:"toggle",def:false}],
 run(s){const p=Math.min(N(s.p),3000000),r=N(s.r)/100,yrs=s.ext?8:5;
  const q=p*r/4,tot=q*4*yrs;
  const rows=[];for(let k=1;k<=yrs;k++)rows.push([k,money(q),money(q*4),money(q*4*k)]);
  const L=[],A=[];for(let k=1;k<=yrs;k++){L.push("Y"+k);A.push(q*4);}
  return{hero:{label:"Quarterly interest",value:money(q),sub:money(q*4/3)+" a month equivalent, for "+yrs+" years"},
   kpis:[{k:"Deposit",v:money(p)},{k:"Yearly income",v:money(q*4),tone:"g"},
    {k:"Total over "+yrs+" yrs",v:money(tot),tone:"g"},{k:"Principal returned",v:money(p)}],

   table:{cols:["Year","Quarterly payout","Yearly income","Cumulative"],rows},

   notes:["Open at 60, or at 55 if you retired under a voluntary scheme, or at 50 for defence personnel. Maximum \u20B930 lakh across all your SCSS accounts.",
    "Interest is fully taxable and TDS applies above \u20B91 lakh a year for senior citizens. Section 80TTB lets seniors deduct up to \u20B950,000 of interest income under the old regime.",
    "80C deduction is available on the deposit under the old regime."]}}});

/* ---- 26. POMIS ---- */
add({id:"pomis",cat:"Deposits & small savings",name:"Post Office Monthly Income Scheme",tags:"pomis mis monthly income post office",

 inputs:[M("p","Amount deposited",900000,1000,1500000,10000),P("r","Interest rate",7.4,4,12,0.05),

  return{hero:{label:"Monthly income",value:money(m),sub:"For 5 years, then "+money(p)+" comes back"},

/* ---- 27. Bond / YTM ---- */
add({id:"bond",cat:"Deposits & small savings",name:"Bond price & yield to maturity",tags:"ytm coupon face value gsec debenture current yield",
 blurb:"Price a bond from a yield, or find the yield from a market price - with current yield and duration.",
 inputs:[{k:"mode",label:"Solve for",type:"seg",def:"ytm",opts:[{v:"ytm",t:"Yield from price"},{v:"px",t:"Price from yield"}]},
   M("fv","Face value",1000,100,10000000,100),P("cpn","Coupon rate",7.5,0,20,0.05),
   M("px","Market price",980,1,10000000,1),P("y","Yield to maturity",8,0,25,0.05),
   {k:"n",label:"Years to maturity",type:"num",unit:"years",def:5,min:0.5,max:40,step:0.5},
   {k:"f",label:"Coupon paid",type:"select",def:"2",opts:[{v:"1",t:"Yearly"},{v:"2",t:"Half-yearly"},{v:"4",t:"Quarterly"}]}],
 run(s){const fv=N(s.fv),c=N(s.cpn)/100,f=N(s.f),n=Math.round(N(s.n)*f),cpn=fv*c/f;
  const price=y=>{const i=y/f;let v=0;for(let k=1;k<=n;k++)v+=cpn/pow(1+i,k);return v+fv/pow(1+i,n);};
  let px,ytm;
  if(s.mode==="ytm"){px=N(s.px);ytm=bisect(x=>price(x)-px,-0.9,5)*100;}
  else{ytm=N(s.y);px=price(ytm/100);}
  const cy=cpn*f/px*100;
  let dur=0;const i=ytm/100/f;
  for(let k=1;k<=n;k++)dur+=(k/f)*(cpn/pow(1+i,k))/px;
  dur+=(n/f)*(fv/pow(1+i,n))/px;
  const modDur=dur/(1+i);
  const rows=[];for(let k=1;k<=n;k++)rows.push([num(k/f,2),money(k===n?cpn+fv:cpn),money((k===n?cpn+fv:cpn)/pow(1+i,k))]);
  return{hero:{label:s.mode==="ytm"?"Yield to maturity":"Fair price",value:s.mode==="ytm"?pct(ytm,3):money(px),
    sub:px>fv?"Trading at a premium to face value":px<fv?"Trading at a discount to face value":"Trading at par"},
   kpis:[{k:"Current yield",v:pct(cy,3),tone:"g"},{k:"Coupon per period",v:money(cpn)},
    {k:"Macaulay duration",v:num(dur,2)+" yrs",tone:"p"},{k:"1% yield move",v:pct(-modDur,2)+" price",tone:"a"}],
   table:{title:"Cashflows",cols:["Year","Cashflow","Present value"],rows,foot:["Total","",money(px)]},
   formula:F("Price = sum of [ coupon / (1+y/f)^k ] + face / (1+y/f)^n",
     "Coupon per period = "+inr(fv)+" x "+N(s.cpn)+"% / "+f+" = "+money(cpn),
     s.mode==="ytm"?"YTM solved numerically so the discounted cashflows equal "+money(px):"Discounted at "+pct(ytm,3)),
   notes:["Modified duration is the quick sensitivity rule: a 1% rise in yields moves this bond's price by roughly "+pct(-modDur,2)+".",
    "YTM assumes every coupon is reinvested at the YTM itself - rarely true, so treat it as a comparison tool rather than a promise."]}}});

/* ---- 28. Tax-saver comparison ---- */
add({id:"80compare",cat:"Deposits & small savings",name:"80C options compared",tags:"elss ppf nsc tax saver fd nps lock in comparison",
 blurb:"Same amount, same period, five tax-saving routes - what each is likely to be worth after tax.",
 inputs:[M("p","Yearly investment",150000,10000,150000,5000),Y("y","Period",15,3,30,1),
   {k:"slab",label:"Tax slab",type:"select",def:"30",opts:[{v:"5",t:"5%"},{v:"20",t:"20%"},{v:"30",t:"30%"}]},
   P("elss","ELSS expected return",13,5,20,0.5),P("ppf","PPF rate",7.1,4,12,0.05),P("fd","Tax-saver FD rate",6.8,4,12,0.05)],
 run(s){const p=N(s.p),y=N(s.y),slab=N(s.slab)/100;
  const opts=[
   {n:"ELSS (equity)",r:N(s.elss),lock:"3 years",tax:"12.5% LTCG above \u20B91.25 L/yr",t:"ltcg"},
   {n:"PPF",r:N(s.ppf),lock:"15 years",tax:"Tax-free",t:"free"},
   {n:"NSC",r:7.7,lock:"5 years",tax:"Taxable at slab",t:"slab"},
   {n:"Tax-saver FD",r:N(s.fd),lock:"5 years",tax:"Taxable at slab",t:"slab"},
   {n:"NPS Tier-I",r:10,lock:"Until 60",tax:"60% tax-free, 40% annuity taxed",t:"nps"}];
  const rows=opts.map(o=>{const g=fvAnnuity(p,o.r/100,y,true),inv=p*y,gain=g-inv;
    let post=g;
    if(o.t==="slab")post=inv+gain*(1-slab);
    else if(o.t==="ltcg")post=inv+gain*0.875;
    else if(o.t==="nps")post=g-(g*0.4*slab*0.5);
    o.post=post;o.g=g;
    return [o.n,pct(o.r,2),money(g),money(post),o.lock,o.tax];});
  const best=opts.slice().sort((a,b)=>b.post-a.post)[0];
  return{hero:{label:"Best after-tax outcome",value:best.n,sub:money(best.post)+" from "+money(p*y)+" invested over "+y+" years"},
   kpis:opts.slice(0,4).map(o=>({k:o.n,v:shortI(o.post),tone:o===best?"g":""})),
   chart:{title:"Value after tax",labels:opts.map(o=>o.n.split(" ")[0]),
     series:[{name:"After-tax value",color:C.ret,values:opts.map(o=>o.post)},{name:"Tax and cost drag",color:C.tax,values:opts.map(o=>o.g-o.post)}]},
   table:{title:"Side by side",cols:["Option","Return used","Before tax","After tax","Lock-in","Tax on exit"],rows},
   formula:"Each option is a yearly investment of "+money(p)+" for "+y+" years, then taxed on exit under its own rule.",
   notes:["Section 80C is only available under the old regime. Under the new regime none of these give a deduction, which changes the ranking entirely - then you pick purely on merit.",
    "ELSS has the shortest lock-in at 3 years, but each instalment locks separately, so a SIP's last unit is free only 3 years after it was bought.",
    "NPS also gets an extra \u20B950,000 deduction under 80CCD(1B) over and above the \u20B91.5 lakh limit, in the old regime."]}}});

/* ============================ RETIREMENT ============================ */

/* ---- 29. EPF ---- */
add({id:"epf",cat:"Retirement",name:"EPF calculator",tags:"provident fund employee employer eps 12 percent",
 blurb:"Employee and employer shares split correctly, including the EPS diversion, with annual interest on the running balance.",
 inputs:[{k:"age",label:"Current age",type:"num",unit:"years",def:30,min:18,max:58,step:1},
   {k:"ret",label:"Retirement age",type:"num",unit:"years",def:58,min:40,max:65,step:1},
   M("basic","Monthly basic + DA",50000,5000,1000000,1000),M("bal","EPF balance today",200000,0,50000000,10000),
   P("gr","Annual increment",8,0,25,0.5),P("r","EPF interest rate",8.25,4,12,0.05),
   {k:"eps",label:"Employer diverts 8.33% to EPS (statutory)",type:"toggle",def:true,hint:"EPS contribution is capped at 8.33% of \u20B915,000 = \u20B91,250 a month for most members"}],
 run(s){const yrs=Math.max(N(s.ret)-N(s.age),1),r=N(s.r)/100,g=N(s.gr)/100;
  let basic=N(s.basic),bal=N(s.bal),eps=0,ee=0,er=0;
  const L=[],A=[],B=[],D=[],rows=[];
  for(let k=1;k<=yrs;k++){let yEe=0,yEr=0,yEps=0;
   for(let m=0;m<12;m++){const e=basic*0.12;const epsC=s.eps?Math.min(basic,15000)*0.0833:0;
     const erC=basic*0.12-epsC;yEe+=e;yEr+=erC;yEps+=epsC;}
   bal=(bal+yEe+yEr)*(1+r);eps+=yEps;ee+=yEe;er+=yEr;
   L.push("Y"+k);A.push(ee+er+N(s.bal));B.push(bal-(ee+er+N(s.bal)));D.push(eps);
   rows.push([k,N(s.age)+k,money(basic),money(yEe),money(yEr),money(bal)]);
   basic*=(1+g);}
  const contrib=ee+er+N(s.bal);
  return{hero:{label:"EPF corpus at "+N(s.ret),value:money(bal),sub:"Plus about "+money(eps)+" routed to the pension scheme"},
   kpis:[{k:"Your contribution",v:money(ee)},{k:"Employer to EPF",v:money(er)},
    {k:"Interest earned",v:money(bal-contrib),tone:"g"},{k:"To EPS (pension)",v:money(eps),tone:"p"}],
   donut:[{label:"Contributions",value:contrib,color:C.inv,fmt:money(contrib)},{label:"Interest",value:bal-contrib,color:C.ret,fmt:money(bal-contrib)}],
   donutTop:"Corpus",donutBot:shortI(bal),
   chart:{title:"EPF build-up",labels:L,series:[{name:"Contributions",color:C.inv,values:A},{name:"Interest",color:C.ret,values:B},{name:"EPS pool",color:C.bal,values:D,type:"line"}]},
   table:{title:"Year by year",cols:["Year","Age","Monthly basic","Your share","Employer to EPF","Balance"],rows},
   formula:F("Employee: 12% of basic + DA",
     "Employer: 12% of basic + DA, of which 8.33% of min(basic, \u20B915,000) goes to EPS",
     "  = \u20B9"+inr(Math.min(N(s.basic),15000)*0.0833)+" a month to EPS at your current basic",
     "Interest at "+N(s.r)+"% credited on the running balance each year"),
   notes:["EPF interest above a \u20B92.5 lakh yearly employee contribution is taxable (\u20B95 lakh if the employer makes no contribution) - relevant at high salaries or heavy VPF.",
    "Withdrawal is tax-free after 5 years of continuous service. Transfer, don't withdraw, when you change jobs - the clock keeps running.",
    "VPF lets you contribute more than 12% at the same rate, and is one of the best fixed-income rates available to a salaried person."]}}});

/* ---- 30. NPS ---- */
add({id:"nps",cat:"Retirement",name:"NPS calculator",tags:"national pension scheme annuity tier 1 60 percent",
 blurb:"Contributions to 60, then the mandatory split - 60% lumpsum, at least 40% into an annuity that pays your pension.",
 inputs:[{k:"age",label:"Current age",type:"num",unit:"years",def:30,min:18,max:59,step:1},
   M("amt","Monthly contribution",10000,500,500000,500),P("r","Expected return",10,4,15,0.25),
   P("ann","Portion used to buy an annuity",40,40,100,5),P("ar","Annuity rate",6,3,10,0.25),
   {k:"slab",label:"Tax slab",type:"select",def:"30",opts:[{v:"5",t:"5%"},{v:"20",t:"20%"},{v:"30",t:"30%"}]}],
 run(s){const yrs=60-N(s.age),r=N(s.r)/1200,p=N(s.amt);
  const corpus=fvAnnuity(p,r,yrs*12,true),inv=p*yrs*12;
  const annAmt=corpus*N(s.ann)/100,lump=corpus-annAmt,pension=annAmt*N(s.ar)/100/12;
  const L=[],A=[],B=[],rows=[];let bal=0;
  for(let k=1;k<=yrs;k++){for(let m=0;m<12;m++)bal=(bal+p)*(1+r);
   L.push("Y"+k);A.push(p*12*k);B.push(bal-p*12*k);rows.push([k,N(s.age)+k,money(p*12*k),money(bal)]);}
  const taxSave=Math.min(p*12,50000)*N(s.slab)/100;
  return{hero:{label:"Monthly pension from 60",value:money(pension),sub:"Plus "+money(lump)+" as a tax-free lumpsum"},
   kpis:[{k:"Corpus at 60",v:money(corpus),tone:"g"},{k:"You contribute",v:money(inv)},
    {k:"Lumpsum (tax-free)",v:money(lump),tone:"p"},{k:"80CCD(1B) saving/yr",v:money(taxSave),tone:"g"}],
   donut:[{label:"Lumpsum",value:lump,color:C.ret,fmt:money(lump)},{label:"Annuity purchase",value:annAmt,color:C.bal,fmt:money(annAmt)}],
   donutTop:"Corpus",donutBot:shortI(corpus),
   chart:{title:"Corpus build-up to age 60",labels:L,series:[{name:"Contributions",color:C.inv,values:A},{name:"Returns",color:C.ret,values:B}]},
   table:{cols:["Year","Age","Contributed","Corpus"],rows},
   formula:F("Corpus = monthly SIP compounded at "+N(s.r)+"% for "+yrs+" years = "+money(corpus),
     "At 60: at least 40% must buy an annuity. Here "+N(s.ann)+"% = "+money(annAmt),
     "Pension = "+inr(annAmt)+" x "+N(s.ar)+"% / 12 = "+money(pension)+" a month"),
   notes:["The lumpsum is tax-free; the annuity income is taxed at your slab in the year you receive it.",
    "\u20B950,000 under 80CCD(1B) is over and above the \u20B91.5 lakh 80C limit, and the employer's NPS contribution up to 14% of salary is deductible under 80CCD(2) - the one NPS benefit that survives in the new regime.",
    "Annuity rates are set when you buy, not now. A 6% assumption is realistic; anything above 7% is optimistic.",
    "NPS is the least liquid retirement product in India. Money is locked until 60 apart from narrow exceptions."]}}});

/* ---- 31. Gratuity ---- */
add({id:"gratuity",cat:"Retirement",name:"Gratuity calculator",tags:"gratuity payment act 15 26 five years",
 blurb:"The statutory formula, the five-year rule, the \u20B920 lakh cap and how it is taxed.",
 inputs:[M("sal","Last drawn monthly basic + DA",80000,5000,2000000,1000),
   {k:"yrs",label:"Years of service",type:"num",unit:"years",def:12,min:0,max:45,step:0.5},
   {k:"cov",label:"Employer covered by the Payment of Gratuity Act",type:"toggle",def:true}],
 run(s){const sal=N(s.sal),raw=N(s.yrs);
  const yrs=s.cov?Math.round(raw):Math.floor(raw);
  const g=s.cov?(15/26)*sal*yrs:(15/30)*sal*yrs;
  const cap=Math.min(g,2000000),elig=raw>=5;
  const rows=[];for(let k=5;k<=Math.max(Math.ceil(raw),20);k+=(k<10?1:5)){
    rows.push([k,money(s.cov?(15/26)*sal*k:(15/30)*sal*k),money(Math.min(s.cov?(15/26)*sal*k:(15/30)*sal*k,2000000))]);}
  const L=[],A=[];for(let k=5;k<=Math.max(Math.ceil(raw),25);k++){L.push(k+"y");A.push(Math.min((15/26)*sal*k,2000000));}
  return{hero:{label:elig?"Gratuity payable":"Not eligible yet",value:elig?money(cap):"\u20B90",
    sub:elig?(g>2000000?"Capped at the \u20B920 lakh statutory exemption limit":"Tax-free for a private employee up to \u20B920 lakh"):"Five years of continuous service is the minimum"},
   kpis:[{k:"Service counted",v:yrs+" yrs"},{k:"Formula amount",v:money(g)},
    {k:"After the \u20B920 L cap",v:money(cap),tone:"g"},{k:"Taxable portion",v:money(Math.max(g-2000000,0)),tone:g>2000000?"a":""}],
   chart:{title:"Gratuity by years of service",labels:L,series:[{name:"Gratuity",color:C.ret,values:A}]},
   table:{title:"At different service lengths",cols:["Years","Formula amount","After cap"],rows},
   formula:F(s.cov?"Covered by the Act:  G = (15 / 26) x last basic+DA x years of service"
     :"Not covered by the Act:  G = (15 / 30) x average of last 10 months x years of service",
     "  = (15/"+(s.cov?26:30)+") x "+inr(sal)+" x "+yrs+" = "+money(g),
     s.cov?"Service is rounded to the nearest year: more than 6 months counts as a full year.":"Only completed years count."),
   notes:["Five years of continuous service is required, except on death or disablement. Working 4 years 240 days is treated as 5 in several court rulings and by many employers.",
    "The \u20B920 lakh exemption is a lifetime limit across all employers, not per job.",
    "26 in the denominator is deliberate - it treats a month as 26 working days, so the payout is more than half a month's salary per year."]}}});

/* ---- 32. Retirement planner ---- */
add({id:"retire",cat:"Retirement",name:"Retirement corpus planner",tags:"retirement planning corpus needed monthly expense fire",
 blurb:"Start from what you spend today and work all the way to the SIP you need - inflation before retirement and after it, both handled.",
 inputs:[{k:"age",label:"Current age",type:"num",unit:"years",def:32,min:18,max:65,step:1},
   {k:"ret",label:"Retirement age",type:"num",unit:"years",def:60,min:35,max:75,step:1},
   {k:"life",label:"Plan until age",type:"num",unit:"years",def:85,min:60,max:100,step:1},
   M("exp","Monthly expense today",60000,5000,2000000,1000),P("infl","Inflation",6,2,12,0.25),
   P("pre","Return before retirement",12,4,20,0.5),P("post","Return after retirement",7,2,15,0.25),
   M("have","Retirement savings so far",1000000,0,500000000,50000)],
 run(s){const a=N(s.age),R=N(s.ret),L2=N(s.life),i=N(s.infl)/100;
  const yTo=Math.max(R-a,1),yIn=Math.max(L2-R,1);
  const expAtR=N(s.exp)*pow(1+i,yTo);
  const rp=N(s.post)/100,real=(1+rp)/(1+i)-1;
  const corpus=real===0?expAtR*12*yIn:expAtR*12*(1-pow(1+real,-yIn))/real*(1+real);
  const grown=N(s.have)*pow(1+N(s.pre)/100,yTo),gap=Math.max(corpus-grown,0);
  const rm=N(s.pre)/1200,sip=gap>0?gap/((pow(1+rm,yTo*12)-1)/rm*(1+rm)):0;
  const L=[],A=[],B=[];let bal=N(s.have);
  for(let k=1;k<=yTo+yIn;k++){
   if(k<=yTo){for(let m=0;m<12;m++)bal=(bal+sip)*(1+rm);}
   else{const w=expAtR*pow(1+i,k-yTo-1);for(let m=0;m<12;m++){bal=Math.max(bal-w,0)*(1+rp/12);}}
   L.push(String(a+k));A.push(Math.max(bal,0));B.push(k<=yTo?0:expAtR*pow(1+i,k-yTo-1)*12);}
  return{hero:{label:"Corpus needed at "+R,value:money(corpus),sub:"To fund "+money(expAtR)+" a month, rising with inflation, until "+L2},
   kpis:[{k:"Monthly SIP needed",v:money(sip),tone:"g"},{k:"Expense at retirement",v:money(expAtR),tone:"a"},
    {k:"Existing savings grow to",v:money(grown),tone:"p"},{k:"Shortfall to fill",v:money(gap),tone:gap?"r":"g"}],
   donut:[{label:"From existing savings",value:grown,color:C.bal,fmt:money(grown)},{label:"From new SIP",value:gap,color:C.ret,fmt:money(gap)}],
   donutTop:"Corpus",donutBot:shortI(corpus),
   chart:{title:"Corpus through accumulation and drawdown (age on the axis)",labels:L,
     series:[{name:"Corpus",color:C.bal,values:A},{name:"Yearly spending",color:C.tax,values:B,type:"line"}]},
   formula:F("Expense at retirement = "+inr(N(s.exp))+" x (1+"+N(s.infl)+"%)^"+yTo+" = "+money(expAtR),
     "Real return in retirement = (1+"+N(s.post)+"%)/(1+"+N(s.infl)+"%) - 1 = "+pct(real*100,3),
     "Corpus = inflation-adjusted annuity for "+yIn+" years, paid at the start of each year",
     "SIP = shortfall / annuity factor at "+N(s.pre)+"% over "+yTo+" years = "+money(sip)),
   notes:["Using a real (inflation-adjusted) return in retirement is what lets the withdrawal rise every year without the corpus running dry early.",
    "Medical costs inflate far faster than 6%. A separate health cover, kept running into retirement, is cheaper than funding it from the corpus.",
    "This assumes no leftover estate. If you want to leave the corpus intact, aim for spending under about 3.5% of it a year instead."]}}});

/* ---- 33. Annuity payout ---- */
add({id:"annuity",cat:"Retirement",name:"Annuity / pension payout",tags:"annuity pension immediate corpus monthly income",
 blurb:"Turn a corpus into a monthly income - either a fixed annuity rate, or a self-managed drawdown over a set number of years.",
 inputs:[M("corpus","Corpus available",10000000,100000,500000000,100000),
   {k:"mode",label:"Method",type:"seg",def:"ann",opts:[{v:"ann",t:"Insurer annuity"},{v:"self",t:"Self-managed drawdown"}]},
   P("ar","Annuity rate / expected return",6,2,12,0.25),{k:"n",label:"Drawdown period",type:"num",unit:"years",def:25,min:5,max:45,step:1},
   {k:"slab",label:"Tax slab on the income",type:"select",def:"20",opts:[{v:"0",t:"No tax"},{v:"5",t:"5%"},{v:"20",t:"20%"},{v:"30",t:"30%"}]}],
 run(s){const c=N(s.corpus),r=N(s.ar)/100,n=N(s.n);
  const annM=c*r/12;
  const i=r/12,drawM=i===0?c/(n*12):c*i/(1-pow(1+i,-n*12));
  const m=s.mode==="ann"?annM:drawM,slab=N(s.slab)/100;
  const L=[],A=[];let bal=c;
  for(let k=1;k<=n;k++){for(let mm=0;mm<12;mm++){if(s.mode==="ann")bal=bal;else bal=Math.max(bal-m,0)*(1+i);}L.push("Y"+k);A.push(s.mode==="ann"?c:Math.max(bal,0));}
  return{hero:{label:"Monthly income",value:money(m),sub:s.mode==="ann"?"Corpus stays with the insurer; "+money(c)+" is not returned in a life annuity":"Corpus is fully used up in "+n+" years"},
   kpis:[{k:"Yearly income",v:money(m*12),tone:"g"},{k:"After tax",v:money(m*(1-slab)),tone:"a"},
    {k:"Total over "+n+" yrs",v:money(m*12*n)},{k:"Effective payout rate",v:pct(m*12/c*100,2),tone:"p"}],
   chart:{title:"Corpus over time",labels:L,series:[{name:"Balance",color:C.bal,values:A,type:"line"}]},
   formula:s.mode==="ann"?"Monthly annuity = corpus x annuity rate / 12 = "+inr(c)+" x "+N(s.ar)+"% / 12 = "+money(annM)
     :F("Level withdrawal that exhausts the corpus:","PMT = C x i / [1 - (1+i)^-n] with i = "+num(i*100,4)+"% monthly, n = "+(n*12)+" months","    = "+money(drawM)),
   notes:["A drawdown usually pays more per month than an annuity at the same rate, because it consumes the capital. An annuity pays for life, however long that turns out to be.",
    "Annuity income is fully taxable at slab. In a self-managed drawdown from mutual funds, only the gain portion of each withdrawal is taxed - a large difference at a 30% slab.",
    "Return of purchase price annuities pay roughly 1-1.5% less but return the corpus to your nominee."]}}});

/* ---- 34. EPS pension ---- */
add({id:"eps",cat:"Retirement",name:"EPS-95 pension estimate",tags:"employee pension scheme eps 95 pensionable salary service",
 blurb:"The monthly pension EPFO pays from 58, using the statutory pensionable salary and service formula.",
 inputs:[M("sal","Pensionable salary (average of last 60 months)",15000,1000,200000,500,{hint:"Capped at \u20B915,000 unless you opted for a higher pension"}),
   {k:"svc",label:"Pensionable service",type:"num",unit:"years",def:30,min:1,max:40,step:1},
   {k:"high",label:"Opted for higher pension on actual salary",type:"toggle",def:false},
   {k:"early",label:"Start pension at",type:"select",def:"58",opts:[{v:"50",t:"Age 50 (reduced)"},{v:"55",t:"Age 55 (reduced)"},{v:"58",t:"Age 58 (normal)"},{v:"60",t:"Age 60 (increased)"}]}],
 run(s){const sal=s.high?N(s.sal):Math.min(N(s.sal),15000);
  let svc=N(s.svc); const bonus=svc>=20?2:0; const svcUsed=Math.min(svc+bonus,35);
  let p=sal*svcUsed/70;
  const age=N(s.early),adj=age<58?pow(1-0.04,58-age):(age>58?pow(1.04,age-58):1);
  p=p*adj;
  const rows=[];for(let k=10;k<=35;k+=5)rows.push([k,money(sal*Math.min(k+(k>=20?2:0),35)/70)]);
  const L=[],A=[];for(let k=10;k<=35;k++){L.push(k+"y");A.push(sal*Math.min(k+(k>=20?2:0),35)/70);}
  return{hero:{label:"Monthly pension from "+age,value:money(Math.max(p,1000)),
    sub:p<1000?"Raised to the \u20B91,000 statutory minimum":"Pensionable service counted as "+svcUsed+" years"},
   kpis:[{k:"Pensionable salary",v:money(sal)},{k:"Service counted",v:svcUsed+" yrs"},
    {k:"Yearly pension",v:money(Math.max(p,1000)*12),tone:"g"},{k:"Early/late adjustment",v:pct((adj-1)*100,0),tone:adj<1?"r":"g"}],
   chart:{title:"Pension by years of service",labels:L,series:[{name:"Monthly pension",color:C.ret,values:A}]},
   table:{title:"At different service lengths",cols:["Years of service","Monthly pension"],rows},
   formula:F("Pension = pensionable salary x pensionable service / 70",
     "  = "+inr(sal)+" x "+svcUsed+" / 70 = "+money(sal*svcUsed/70),
     svc>=20?"Two bonus years are added once service crosses 20 years.":"",
     age!==58?"Adjusted by 4% for each year "+(age<58?"before":"after")+" 58.":""),
   warn:!s.high&&N(s.sal)>15000?"Pensionable salary is capped at \u20B915,000 for most members, so a higher basic does not raise this pension unless you opted for the higher-pension scheme.":null,
   notes:["The \u20B915,000 cap is why EPS pensions are small for most private-sector employees - the scheme was designed around a much lower wage ceiling.",
    "Minimum pension is \u20B91,000 a month. A reduced pension can start at 50; each year early costs 4%.",
    "On the member's death, the spouse gets 50% of this as a widow pension, subject to the scheme's own minimum."]}}});
</script>
<script>
/* ============================================================
   Registry C - Loans & EMI / Tax
   ============================================================ */

/* ---- 35. EMI ---- */
add({id:"emi",cat:"Loans & EMI",name:"EMI calculator",tags:"loan emi home car personal amortisation schedule",
 blurb:"Instalment, total interest and a full amortisation schedule on the reducing balance that lenders actually use.",
 presets:[{t:"Home \u20B950 L, 8.5%, 20 yr",v:{p:5000000,r:8.5,n:20}},{t:"Car \u20B910 L, 9.5%, 7 yr",v:{p:1000000,r:9.5,n:7}},{t:"Personal \u20B95 L, 14%, 5 yr",v:{p:500000,r:14,n:5}}],
 inputs:[M("p","Loan amount",5000000,10000,500000000,10000),P("r","Interest rate",8.5,1,30,0.05),
   Y("n","Tenure",20,1,35,1),M("fee","Processing fee & charges",25000,0,1000000,1000)],
 run(s){const p=N(s.p),r=N(s.r)/1200,n=N(s.n)*12,e=emiOf(p,r,n);
  const tot=e*n,int=tot-p;
  let bal=p;const rows=[],L=[],A=[],B=[],D=[];
  for(let y=1;y<=N(s.n);y++){let yi=0,yp=0;
   for(let m=0;m<12;m++){const ic=bal*r,pc=e-ic;bal-=pc;yi+=ic;yp+=pc;}
   rows.push([y,money(yp),money(yi),money(Math.max(bal,0)),pct((1-Math.max(bal,0)/p)*100,1)]);
   L.push("Y"+y);A.push(yp);B.push(yi);D.push(Math.max(bal,0));}
  const apr=bisect(x=>emiOf(p-N(s.fee),x/1200,n)-e,0.1,60);
  return{hero:{label:"Monthly EMI",value:money(e),sub:"Total repayment "+money(tot)+" over "+n+" months"},
   kpis:[{k:"Total interest",v:money(int),tone:"a"},{k:"Interest as % of loan",v:pct(int/p*100,0),tone:"r"},
    {k:"Total outgo",v:money(tot+N(s.fee))},{k:"Effective rate with fees",v:pct(apr,2),tone:"a"}],
   donut:[{label:"Principal",value:p,color:C.inv,fmt:money(p)},{label:"Interest",value:int,color:C.tax,fmt:money(int)}],
   donutTop:"You repay",donutBot:shortI(tot),
   chart:{title:"Where each year's EMI goes, and the balance falling",labels:L,
     series:[{name:"Principal repaid",color:C.inv,values:A},{name:"Interest paid",color:C.tax,values:B},{name:"Outstanding",color:C.bal,values:D,type:"line"}]},
   table:{title:"Amortisation schedule",cols:["Year","Principal repaid","Interest paid","Balance","Loan repaid"],rows,
     foot:["Total",money(p),money(int),"\u20B90","100%"],
     note:"In the early years almost all of the EMI is interest. On a 20-year loan you cross the halfway mark on principal only around year 13."},
   formula:F("EMI = P x i x (1+i)^n / [ (1+i)^n - 1 ]",
     "i = "+N(s.r)+"%/12 = "+num(r*100,4)+"%   n = "+n+" months",
     "    = "+inr(p)+" x "+num(r,6)+" x "+num(pow(1+r,n),4)+" / "+num(pow(1+r,n)-1,4)+" = "+money(e)),
   notes:["Interest is charged on the reducing balance, so every rupee prepaid early removes far more interest than the same rupee prepaid later.",
    "Floating-rate home loans reprice against an external benchmark. When rates rise, most lenders extend the tenure instead of raising the EMI - check which one your bank does.",
    "There is no prepayment penalty on a floating-rate home loan to an individual borrower. Fixed-rate loans can carry one."]}}});

/* ---- 36. Prepayment ---- */
add({id:"prepay",cat:"Loans & EMI",name:"Home loan prepayment",tags:"prepay part payment reduce tenure emi interest saved",
 blurb:"A lumpsum, a higher EMI, or both - see the interest you kill and the months you cut off the loan.",
 inputs:[M("p","Outstanding loan",4000000,10000,500000000,10000),P("r","Interest rate",8.5,1,20,0.05),
   {k:"n",label:"Remaining tenure",type:"num",unit:"years",def:18,min:1,max:35,step:1},
   M("lump","One-time prepayment now",500000,0,50000000,10000),M("extra","Extra added to every EMI",5000,0,500000,1000),
   {k:"mode",label:"Use the saving to",type:"seg",def:"ten",opts:[{v:"ten",t:"Cut the tenure"},{v:"emi",t:"Cut the EMI"}]}],
 run(s){const p=N(s.p),r=N(s.r)/1200,n=N(s.n)*12,e=emiOf(p,r,n);
  const baseInt=e*n-p;
  const p2=Math.max(p-N(s.lump),0);
  let newEmi=e,newN=n,int2=0;
  if(s.mode==="emi"){ newEmi=emiOf(p2,r,n)+0; newN=n; int2=newEmi*n-p2; }
  else{ newEmi=e+N(s.extra); let bal=p2,k=0;
    while(bal>0.5&&k<600){const ic=bal*r;let pc=newEmi-ic; if(pc<=0){k=600;break;} if(pc>bal)pc=bal; bal-=pc;int2+=ic;k++;}
    newN=k; }
  const saved=baseInt-int2, monthsCut=n-newN;
  const L=[],A=[],B=[];let b1=p,b2=p2;
  for(let y=1;y<=N(s.n);y++){for(let m=0;m<12;m++){ if(b1>0){const ic=b1*r;b1-=Math.min(e-ic,b1);}
     if(b2>0){const ic=b2*r;const pc=Math.min((s.mode==="emi"?newEmi:e+N(s.extra))-ic,b2);b2-=pc;} }
   L.push("Y"+y);A.push(Math.max(b1,0));B.push(Math.max(b2,0));}
  return{hero:{label:"Interest saved",value:money(Math.max(saved,0)),
    sub:s.mode==="ten"?"Loan closes "+Math.floor(monthsCut/12)+" yr "+(monthsCut%12)+" mo early":"EMI falls to "+money(newEmi)},
   kpis:[{k:"Original EMI",v:money(e)},{k:s.mode==="ten"?"New EMI":"New EMI",v:money(s.mode==="ten"?e+N(s.extra):newEmi),tone:"g"},
    {k:"Interest without prepaying",v:money(baseInt),tone:"a"},{k:"Interest after",v:money(int2),tone:"g"}],
   chart:{title:"Outstanding balance, with and without prepayment",labels:L,
     series:[{name:"Original",color:C.tax,values:A,type:"line"},{name:"With prepayment",color:C.ret,values:B,type:"line"}]},
   formula:F("Prepayment goes straight against principal, so the interest on it stops immediately.",
     "Lumpsum of "+money(N(s.lump))+" reduces the balance to "+money(p2)+".",
     s.mode==="ten"?"EMI stays at "+money(e+N(s.extra))+" and the loan is simulated until the balance hits zero - "+newN+" months."
      :"Tenure stays at "+n+" months and the EMI is recalculated on the lower balance."),
   notes:["Cutting the tenure saves far more than cutting the EMI, because you keep paying the larger instalment against a shrinking balance.",
    "The best time to prepay is the first third of the loan. In the last few years most of the EMI is principal already, so prepaying saves little.",
    "Weigh it against investing: if your loan is at 8.5% and post-tax equity returns are higher, the maths favours investing - but the certainty of a closed loan has real value too."]}}});

/* ---- 37. Loan eligibility ---- */
add({id:"eligibility",cat:"Loans & EMI",name:"Loan eligibility (FOIR)",tags:"eligibility how much loan income foir ltv",
 blurb:"How large a loan a lender will sanction, from your income, existing EMIs and the property value.",
 inputs:[M("inc","Monthly net income",150000,10000,10000000,5000),M("oth","Other monthly income",0,0,1000000,1000),
   M("emi","Existing EMIs",0,0,1000000,1000),P("foir","FOIR the lender allows",50,30,75,1,{hint:"Share of income that can go to all EMIs. Usually 40-55%, higher for high earners."}),
   P("r","Interest rate",8.5,1,20,0.05),Y("n","Tenure",20,1,35,1),
   M("prop","Property value",8000000,0,500000000,100000),P("ltv","Maximum loan to value",80,50,90,5)],
 run(s){const inc=N(s.inc)+N(s.oth),cap=inc*N(s.foir)/100-N(s.emi);
  const r=N(s.r)/1200,n=N(s.n)*12;
  const byInc=cap>0?cap*(pow(1+r,n)-1)/(r*pow(1+r,n)):0;
  const byLtv=N(s.prop)*N(s.ltv)/100;
  const loan=N(s.prop)>0?Math.min(byInc,byLtv):byInc;
  const emi=emiOf(loan,r,n),down=Math.max(N(s.prop)-loan,0);
  const L=[],A=[];for(let k=5;k<=30;k+=5){L.push(k+"y");A.push(cap>0?cap*(pow(1+r,k*12)-1)/(r*pow(1+r,k*12)):0);}
  return{hero:{label:"Loan you can expect",value:money(loan),
    sub:N(s.prop)>0&&byLtv<byInc?"Limited by the "+N(s.ltv)+"% loan-to-value cap":"Limited by your repayment capacity"},
   kpis:[{k:"EMI capacity",v:money(Math.max(cap,0)),tone:"g"},{k:"EMI on this loan",v:money(emi)},
    {k:"Eligible on income",v:money(byInc)},{k:"Down payment needed",v:money(down),tone:"a"}],
   chart:{title:"Eligibility by tenure",labels:L,series:[{name:"Loan eligible",color:C.ret,values:A}]},
   formula:F("EMI capacity = ("+inr(inc)+" x "+N(s.foir)+"%) - existing EMIs "+inr(N(s.emi))+" = "+money(cap),
     "Loan = EMI x [ (1+i)^n - 1 ] / [ i x (1+i)^n ] = "+money(byInc),
     N(s.prop)>0?"LTV cap = "+inr(N(s.prop))+" x "+N(s.ltv)+"% = "+money(byLtv)+" - the sanction is the lower of the two.":""),
   notes:["Regulatory LTV caps: up to 90% for loans up to \u20B930 lakh, 80% up to \u20B975 lakh, 75% above that. Stamp duty and registration are not part of the loan.",
    "Budget at least 7-8% of the property value on top for stamp duty, registration and interiors.",
    "A CIBIL score above 750 gets the advertised rate. Below 700, expect a higher rate or a smaller sanction."]}}});

/* ---- 38. Flat vs reducing ---- */
add({id:"flatred",cat:"Loans & EMI",name:"Flat vs reducing rate",tags:"flat rate reducing balance effective interest gold loan",
 blurb:"A quoted flat rate is roughly double the real one. This shows the true reducing-balance cost.",
 inputs:[M("p","Loan amount",500000,10000,50000000,10000),P("r","Flat rate quoted",8,1,30,0.1),Y("n","Tenure",5,1,20,1)],
 run(s){const p=N(s.p),fr=N(s.r)/100,y=N(s.n),n=y*12;
  const totInt=p*fr*y,emi=(p+totInt)/n;
  const eff=bisect(x=>emiOf(p,x/1200,n)-emi,0.01,200);
  const emiR=emiOf(p,fr/12/100,n),intR=emiR*n-p;
  const L=[],A=[],B=[];for(let k=1;k<=y;k++){L.push("Y"+k);A.push(p*fr);B.push(0);}
  return{hero:{label:"Real (reducing) rate",value:pct(eff,2),sub:"For a quoted flat rate of "+pct(N(s.r),2)},
   kpis:[{k:"EMI on flat basis",v:money(emi),tone:"a"},{k:"Total interest (flat)",v:money(totInt),tone:"r"},
    {k:"EMI if truly "+N(s.r)+"% reducing",v:money(emiR),tone:"g"},{k:"You overpay",v:money(totInt-intR),tone:"r"}],
   chart:{title:"Interest charged each year on the flat basis - it never falls",labels:L,series:[{name:"Interest (flat)",color:C.tax,values:A}]},
   formula:F("Flat:  interest = P x rate x years = "+inr(p)+" x "+N(s.r)+"% x "+y+" = "+money(totInt),
     "EMI = (P + interest) / n = "+money(emi),
     "The equivalent reducing rate is the rate that produces the same EMI: "+pct(eff,3)),
   notes:["Flat rates are common on gold loans, consumer durable finance and some vehicle and personal loans. Always ask for the reducing rate or the APR before comparing.",
    "The rough rule: reducing rate is about 1.8 to 1.9 times the flat rate for tenures of three years or more."]}}});

/* ---- 39. Balance transfer ---- */
add({id:"transfer",cat:"Loans & EMI",name:"Balance transfer",tags:"refinance switch lender lower rate saving",
 blurb:"Whether moving the loan to a cheaper lender is worth the paperwork, after the switching costs.",
 inputs:[M("p","Outstanding balance",4000000,10000,500000000,10000),P("r1","Current rate",9.25,1,20,0.05),
   P("r2","New rate offered",8.4,1,20,0.05),{k:"n",label:"Remaining tenure",type:"num",unit:"years",def:16,min:1,max:35,step:1},
   M("cost","Switching cost (processing, legal, valuation, stamp)",30000,0,1000000,1000)],
 run(s){const p=N(s.p),n=N(s.n)*12;
  const e1=emiOf(p,N(s.r1)/1200,n),e2=emiOf(p,N(s.r2)/1200,n);
  const i1=e1*n-p,i2=e2*n-p,net=i1-i2-N(s.cost);
  const bepMonths=(e1-e2)>0?N(s.cost)/(e1-e2):Infinity;
  const L=[],A=[],B=[];let b1=p,b2=p;
  for(let y=1;y<=N(s.n);y++){for(let m=0;m<12;m++){b1-=e1-b1*N(s.r1)/1200;b2-=e2-b2*N(s.r2)/1200;}
   L.push("Y"+y);A.push(Math.max(b1,0));B.push(Math.max(b2,0));}
  return{hero:{label:net>0?"Net saving from switching":"Switching costs more than it saves",value:money(Math.abs(net)),
    sub:isFinite(bepMonths)?"Costs are recovered in "+Math.ceil(bepMonths)+" months":"The new rate is not lower"},
   kpis:[{k:"EMI now",v:money(e1)},{k:"EMI after",v:money(e2),tone:"g"},
    {k:"Monthly saving",v:money(e1-e2),tone:"g"},{k:"Switching cost",v:money(N(s.cost)),tone:"a"}],
   chart:{title:"Balance under each lender",labels:L,series:[{name:"Current lender",color:C.tax,values:A,type:"line"},{name:"New lender",color:C.ret,values:B,type:"line"}]},
   formula:F("Interest at "+N(s.r1)+"% over "+n+" months = "+money(i1),
     "Interest at "+N(s.r2)+"% over "+n+" months = "+money(i2),
     "Net saving = "+money(i1)+" - "+money(i2)+" - costs "+money(N(s.cost))+" = "+money(net)),
   notes:["Before transferring, ask your existing lender to reprice. A conversion fee of a few thousand rupees is often far cheaper than a full transfer.",
    "A switch is usually worth it when the rate gap is at least 0.5% and more than half the tenure is left.",
    "Watch for a lower rate paired with a longer tenure - the EMI drops but the total interest rises."]}}});

/* ---- 40. Prepay vs invest ---- */
add({id:"prepayinvest",cat:"Loans & EMI",name:"Prepay the loan or invest?",tags:"prepay vs invest opportunity cost surplus",
 blurb:"You have a surplus every month. Killing loan interest or compounding in the market - which ends up ahead?",
 inputs:[M("p","Outstanding loan",4000000,10000,500000000,10000),P("r","Loan rate",8.5,1,20,0.05),
   {k:"n",label:"Remaining tenure",type:"num",unit:"years",def:18,min:1,max:35,step:1},
   M("sur","Monthly surplus",20000,1000,1000000,1000),P("mr","Expected investment return",12,1,25,0.5),
   P("tax","Tax on investment gains",12.5,0,35,0.5,{hint:"12.5% for equity LTCG, slab rate for debt"}),
   {k:"ded",label:"Claiming the section 24(b) interest deduction",type:"toggle",def:false},
   {k:"slab",label:"Tax slab",type:"select",def:"30",opts:[{v:"0",t:"New regime / no benefit"},{v:"20",t:"20%"},{v:"30",t:"30%"}]}],
 run(s){const p=N(s.p),r=N(s.r)/1200,n=N(s.n)*12,e=emiOf(p,r,n),sur=N(s.sur);
  // Route A: prepay
  let bal=p,int=0,k=0;
  while(bal>0.5&&k<600){const ic=bal*r;let pc=e+sur-ic;if(pc<=0)break;if(pc>bal)pc=bal;bal-=pc;int+=ic;k++;}
  const monthsA=k;
  const mi=N(s.mr)/1200;
  const afterA=fvAnnuity(e+sur,mi,n-monthsA,true); // invest the whole outgo after loan closes
  const netA=afterA-((afterA-(e+sur)*(n-monthsA))*N(s.tax)/100);
  // Route B: invest all along
  let b2=p,int2=0;for(let m=0;m<n;m++){const ic=b2*r;b2-=e-ic;int2+=ic;}
  const corpusB=fvAnnuity(sur,mi,n,true);
  const netB=corpusB-((corpusB-sur*n)*N(s.tax)/100);
  const dedBenefit=s.ded?Math.min(int2,2000000)*N(s.slab)/100-Math.min(int,2000000)*N(s.slab)/100:0;
  const A=netA-int, B=netB-int2-dedBenefit;
  const L=[],SA=[],SB=[];let bb=p,ii=0,inv=0;
  for(let y=1;y<=N(s.n);y++){for(let m=0;m<12;m++){ if(bb>0){const ic=bb*r;const pc=Math.min(e+sur-ic,bb);bb-=pc;ii+=ic;} else {inv=(inv+e+sur)*(1+mi);} }
   L.push("Y"+y);SA.push(inv);SB.push(fvAnnuity(sur,mi,y*12,true));}
  return{hero:{label:A>B?"Prepaying wins":"Investing wins",value:money(Math.abs(A-B)),
    sub:"Net advantage over "+N(s.n)+" years, after tax"+(s.ded?" and the interest deduction":"")},
   kpis:[{k:"Loan closes in (prepay)",v:Math.floor(monthsA/12)+" yr "+(monthsA%12)+" mo",tone:"g"},
    {k:"Interest saved",v:money(int2-int),tone:"g"},{k:"Corpus if you invest",v:money(netB),tone:"p"},
    {k:"Corpus if you prepay first",v:money(netA),tone:"p"}],
   chart:{title:"Investment corpus under each route",labels:L,
     series:[{name:"Prepay first, then invest",color:C.ret,values:SA,type:"line"},{name:"Invest from day one",color:C.bal,values:SB,type:"line"}]},
   formula:F("Prepay route: EMI + surplus goes at the loan until it closes in "+monthsA+" months, then the whole amount is invested.",
     "Invest route: EMI runs the full "+n+" months, the surplus is invested throughout.",
     "Both are compared net of "+N(s.tax)+"% tax on gains"+(s.ded?" and of the section 24(b) deduction you lose by prepaying.":".")),
   notes:["The comparison turns on post-tax investment return versus post-tax loan rate. At an 8.5% loan and 12% pre-tax equity, investing usually edges ahead - but only if you actually invest the surplus every month.",
    "A closed loan is a guaranteed, risk-free return. The market's 12% is neither guaranteed nor smooth, and the gap between the two is a risk premium you may not want on top of a mortgage.",
    "The practical answer for most people is to do both - prepay one extra EMI a year and invest the rest."]}}});

add({id:"creditcard",cat:"Loans & EMI",name:"Credit card minimum due trap",tags:"credit card interest revolving minimum due 42 percent",
 blurb:"Paying only the minimum due is the most expensive borrowing most people ever do. Here is the arithmetic.",
 inputs:[M("bal","Outstanding balance",100000,1000,5000000,1000),
   P("r","Monthly interest rate",3.5,1,4.5,0.05,{hint:"Cards quote a monthly rate - 3.5% a month is 42% a year"}),
   P("min","Minimum due",5,1,10,0.5),M("pay","Or pay this fixed amount monthly",10000,0,1000000,500)],
 run(s){const r=N(s.r)/100,r2=pow(1+r,12)-1;
  let bal=N(s.bal),m=0,int=0;const L=[],A=[];
  while(bal>1&&m<600){const pay=Math.max(bal*N(s.min)/100,100);const ic=bal*r;bal=bal+ic-pay;int+=ic;m++;
   if(m%12===0){L.push("Y"+m/12);A.push(Math.max(bal,0));} if(pay<=ic){m=600;break;}}
  let b2=N(s.bal),m2=0,int2=0;
  while(b2>1&&m2<600){const ic=b2*r;b2=b2+ic-N(s.pay);int2+=ic;m2++;if(N(s.pay)<=ic){m2=600;break;}}
  return{hero:{label:"Paying only the minimum",value:m>=600?"Never clears":Math.floor(m/12)+" yr "+(m%12)+" mo",
    sub:m>=600?"The minimum does not even cover the interest":"Costing "+money(int)+" in interest on "+money(N(s.bal))},
   kpis:[{k:"Annual rate",v:pct(r2*100,1),tone:"r"},{k:"Interest on minimum-due",v:m>=600?"Unbounded":money(int),tone:"r"},
    {k:"Fixed "+shortI(N(s.pay))+"/mo clears in",v:m2>=600?"Never":Math.floor(m2/12)+" yr "+(m2%12)+" mo",tone:"g"},
    {k:"Interest then",v:m2>=600?"--":money(int2),tone:"a"}],
   chart:{title:"Balance while paying only the minimum",labels:L,series:[{name:"Balance",color:C.tax,values:A,type:"line"}]},
   formula:F("Effective annual rate = (1 + "+N(s.r)+"%)^12 - 1 = "+pct(r2*100,2),
     "Minimum due of "+N(s.min)+"% barely exceeds the monthly interest, so the balance falls at a crawl.",
     "GST at 18% applies on the interest and on most fees, which is not modelled here - the real cost is a little higher."),
   warn:"Interest also runs on fresh purchases from the transaction date once you revolve a balance, and the interest-free period disappears until you clear the full amount.",
   notes:["Converting the balance to an EMI at 13-16% is nearly always cheaper than revolving at 42%. A personal loan at 11-14% is cheaper still.",
    "A cash withdrawal on a credit card attracts interest from day one plus a withdrawal fee - there is no interest-free period on it."]}}});

add({id:"moratorium",cat:"Loans & EMI",name:"EMI holiday cost",tags:"moratorium emi pause skip holiday interest accrual",
 blurb:"Skipping EMIs does not pause interest - it capitalises it. This is what a break really costs.",
 inputs:[M("p","Outstanding loan",3000000,10000,500000000,10000),P("r","Interest rate",9,1,25,0.05),
   {k:"n",label:"Remaining tenure",type:"num",unit:"years",def:15,min:1,max:35,step:1},
   {k:"skip",label:"Months skipped",type:"num",unit:"months",def:6,min:1,max:24,step:1}],
 run(s){const p=N(s.p),r=N(s.r)/1200,n=N(s.n)*12,e=emiOf(p,r,n),k=N(s.skip);
  const bal=p*pow(1+r,k),accrued=bal-p;
  const nSame=Math.log(e/(e-bal*r))/Math.log(1+r);
  const eSame=emiOf(bal,r,n-k);
  const extraMonths=isFinite(nSame)?Math.ceil(nSame)-(n-k):Infinity;
  const L=[],A=[],B=[];let b1=p,b2=p;
  for(let y=1;y<=N(s.n);y++){for(let m=0;m<12;m++){const mm=(y-1)*12+m;
    if(b1>0)b1-=e-b1*r;
    if(mm<k)b2=b2*(1+r); else if(b2>0)b2-=e-b2*r;}
   L.push("Y"+y);A.push(Math.max(b1,0));B.push(Math.max(b2,0));}
  return{hero:{label:"Extra interest from a "+k+"-month break",value:money(accrued+ (isFinite(extraMonths)?extraMonths*e:0)),
    sub:"Interest of "+money(accrued)+" is added to the principal and then charged interest itself"},
   kpis:[{k:"Balance after the break",v:money(bal),tone:"r"},{k:"Interest accrued",v:money(accrued),tone:"a"},
    {k:"Same EMI: extra months",v:isFinite(extraMonths)?extraMonths+" months":"EMI too small",tone:"a"},
    {k:"Same tenure: new EMI",v:money(eSame),tone:"a"}],
   chart:{title:"Balance with and without the break",labels:L,
     series:[{name:"No break",color:C.ret,values:A,type:"line"},{name:"With break",color:C.tax,values:B,type:"line"}]},
   formula:F("During the break: balance = balance x (1 + i) every month",
     "  "+inr(p)+" x (1+"+num(r*100,4)+"%)^"+k+" = "+money(bal),
     "That capitalised interest then attracts interest for the rest of the loan."),
   notes:["A moratorium is a liquidity tool, not a discount. Use it only when the alternative is a default, which damages your credit record for years.",
    "If cash allows, paying just the interest during the break stops the capitalisation and costs almost nothing extra later."]}}});

/* ============================ TAX ============================ */
const NEW_SLABS=[[400000,0],[800000,.05],[1200000,.10],[1600000,.15],[2000000,.20],[2400000,.25],[Infinity,.30]];
function slabTax(inc,slabs){let t=0,prev=0;for(const[lim,rate]of slabs){if(inc>prev)t+=(Math.min(inc,lim)-prev)*rate;prev=lim;if(inc<=lim)break;}return t;}
function oldSlabs(age){const base=age==="80"?500000:age==="60"?300000:250000;
  return [[base,0],[500000,.05],[1000000,.20],[Infinity,.30]];}
function surcharge(tax,inc,isNew){
  const bands=isNew?[[5000000,.10],[10000000,.15],[20000000,.25]]:[[5000000,.10],[10000000,.15],[20000000,.25],[50000000,.37]];
  let rate=0,thr=0;
  for(const[lim,rt]of bands){if(inc>lim){rate=rt;thr=lim;}}
  if(!rate)return{sc:0,rate:0};
  let sc=tax*rate;
  // marginal relief: extra (tax+sc) cannot exceed extra income above the threshold
  const taxAtThr=thr===5000000?slabTax(thr,isNew?NEW_SLABS:oldSlabs("0")):0;
  return {sc,rate};
}
function computeTax(taxable,isNew,age){
  const slabs=isNew?NEW_SLABS:oldSlabs(age);
  let t=slabTax(taxable,slabs);
  // 87A rebate
  let reb=0;
  if(isNew&&taxable<=1200000)reb=Math.min(t,60000);
  else if(isNew&&taxable>1200000){const excess=taxable-1200000;const tAt12=slabTax(1200000,slabs)-Math.min(slabTax(1200000,slabs),60000);
    if(t-0>excess+tAt12)reb=Math.max(t-excess,0)*0+Math.max(t-(excess),0)>0?Math.max(t-excess,0):0;}
  else if(!isNew&&taxable<=500000)reb=Math.min(t,12500);
  if(isNew&&taxable>1200000){ // marginal relief around 12L
    const excess=taxable-1200000; if(t>excess)reb=t-excess; }
  t=Math.max(t-reb,0);
  const s=surcharge(t,taxable,isNew);
  const cess=(t+s.sc)*0.04;
  return {slab:slabTax(taxable,slabs),rebate:reb,tax:t,sc:s.sc,scRate:s.rate,cess,total:t+s.sc+cess};
}

add({id:"incometax",cat:"Tax",name:"Income tax - old vs new regime",tags:"income tax slab 87a rebate standard deduction regime comparison",
 blurb:"Both regimes computed side by side for FY 2025-26 and FY 2026-27, with the 87A rebate, surcharge and cess.",
 presets:[{t:"\u20B912 L salary",v:{sal:1200000}},{t:"\u20B925 L salary",v:{sal:2500000}},{t:"\u20B960 L salary",v:{sal:6000000}}],
 inputs:[M("sal","Gross salary",1500000,0,500000000,10000),M("oth","Other income (interest, rent, etc.)",0,0,100000000,5000),
   {k:"age",label:"Age",type:"select",def:"0",opts:[{v:"0",t:"Below 60"},{v:"60",t:"60 to 80"},{v:"80",t:"80 and above"}]},
   M("c80","80C investments",150000,0,150000,5000),M("d80","80D health insurance",25000,0,100000,1000),
   M("nps","80CCD(1B) NPS",50000,0,50000,5000),M("hra","HRA exemption claimed",0,0,5000000,5000),
   M("hl","Home loan interest (section 24b)",0,0,2000000,10000),M("othded","Other deductions (80G, 80TTA, 80E...)",0,0,2000000,5000),
   M("empnps","Employer NPS contribution (80CCD(2))",0,0,5000000,5000)],
 run(s){const gross=N(s.sal)+N(s.oth);
  const oldDed=75000-25000+Math.min(N(s.c80),150000)+N(s.d80)+Math.min(N(s.nps),50000)+N(s.hra)+Math.min(N(s.hl),200000)+N(s.othded)+N(s.empnps);
  const oldTaxable=Math.max(gross-oldDed,0);
  const newTaxable=Math.max(gross-(N(s.sal)>0?75000:0)-N(s.empnps),0);
  const O=computeTax(oldTaxable,false,s.age),Nw=computeTax(newTaxable,true,s.age);
  const better=Nw.total<=O.total?"New":"Old";
  const R=better==="New"?Nw:O, T=better==="New"?newTaxable:oldTaxable;
  const slabs=better==="New"?NEW_SLABS:oldSlabs(s.age);
  const rows=[];let prev=0;
  for(const[lim,rate]of slabs){ if(T>prev){const amt=Math.min(T,lim)-prev;
    rows.push([(prev===0?"Up to":"\u20B9"+shortI(prev).slice(1)+" to ")+(lim===Infinity?"above":" \u20B9"+shortI(lim).slice(1)),pct(rate*100,0),money(amt),money(amt*rate)]);}
   prev=lim; if(T<=lim)break;}
  const eff=gross>0?R.total/gross*100:0;
  return{hero:{label:better+" regime is cheaper for you",value:money(R.total),
    sub:"Saves "+money(Math.abs(O.total-Nw.total))+" against the other regime"},
   kpis:[{k:"New regime tax",v:money(Nw.total),tone:better==="New"?"g":"a"},{k:"Old regime tax",v:money(O.total),tone:better==="Old"?"g":"a"},
    {k:"Effective rate",v:pct(eff,2),tone:"p"},{k:"Monthly TDS (approx)",v:money(R.total/12)}],
   chart:{title:"Regime comparison",labels:["Taxable income","Tax before rebate","Rebate","Surcharge + cess","Final tax"],
     series:[{name:"New regime",color:C.ret,values:[newTaxable,Nw.slab,Nw.rebate,Nw.sc+Nw.cess,Nw.total]},
       {name:"Old regime",color:C.tax,values:[oldTaxable,O.slab,O.rebate,O.sc+O.cess,O.total]}]},
   table:{title:"Slab-wise working - "+better+" regime",cols:["Slab","Rate","Income in slab","Tax"],rows,
     foot:["Tax before rebate","",money(R.slab),money(R.slab)]},
   table2:{title:"Full computation",cols:["Line",'New regime','Old regime'],
     rows:[["Gross income",money(gross),money(gross)],
      ["Standard deduction",money(N(s.sal)>0?75000:0),money(N(s.sal)>0?50000:0)],
      ["Chapter VI-A and other deductions",money(N(s.empnps)),money(oldDed-50000)],
      ["Taxable income",money(newTaxable),money(oldTaxable)],
      ["Tax on slabs",money(Nw.slab),money(O.slab)],
      ["Less rebate u/s 87A",money(Nw.rebate),money(O.rebate)],
      ["Surcharge"+(Nw.scRate?" @"+pct(Nw.scRate*100,0):""),money(Nw.sc),money(O.sc)],
      ["Health & education cess @4%",money(Nw.cess),money(O.cess)],
      ["Total tax payable",money(Nw.total),money(O.total)]]},
   formula:F("New regime FY 2025-26 and FY 2026-27 (slabs unchanged):",
     "  0-4L nil | 4-8L 5% | 8-12L 10% | 12-16L 15% | 16-20L 20% | 20-24L 25% | above 24L 30%",
     "  Standard deduction \u20B975,000. Rebate u/s 87A up to \u20B960,000 when taxable income is \u20B912 lakh or less, with marginal relief just above it.",
     "Old regime: 0-2.5L nil | 2.5-5L 5% | 5-10L 20% | above 10L 30%. Standard deduction \u20B950,000, rebate \u20B912,500 up to \u20B95 lakh.",
     "Surcharge 10/15/25% (old regime also 37% above \u20B95 crore), then 4% cess on tax plus surcharge."),
   notes:["The new regime is the default. You can still choose the old one - salaried taxpayers may switch each year, but business income allows only one switch back.",
    "The old regime only wins when your deductions are large. Roughly, you need deductions above \u20B98 lakh at a \u20B924 lakh income for it to pay.",
    "Deductions that survive in the new regime: employer NPS under 80CCD(2), the \u20B975,000 standard deduction, and a few narrow ones. 80C, 80D and HRA do not.",
    "Marginal relief is applied both around the \u20B912 lakh rebate edge and at each surcharge threshold, so a small rise in income never costs more in tax than the rise itself."]}}});

add({id:"hra",cat:"Tax",name:"HRA exemption",tags:"house rent allowance exemption metro 50 percent rent receipt",
 blurb:"The three-way least-of test that decides how much of your HRA escapes tax.",
 inputs:[M("basic","Monthly basic + DA",60000,1000,2000000,1000),M("hra","Monthly HRA received",30000,0,1000000,1000),
   M("rent","Monthly rent paid",25000,0,1000000,1000),
   {k:"metro",label:"Living in Delhi, Mumbai, Kolkata or Chennai",type:"toggle",def:false},
   {k:"m",label:"Months claimed",type:"num",unit:"months",def:12,min:1,max:12,step:1},
   {k:"slab",label:"Tax slab",type:"select",def:"30",opts:[{v:"5",t:"5%"},{v:"20",t:"20%"},{v:"30",t:"30%"}]}],
 run(s){const m=N(s.m),basic=N(s.basic)*m,hra=N(s.hra)*m,rent=N(s.rent)*m;
  const a=hra,b=basic*(s.metro?0.5:0.4),c=Math.max(rent-basic*0.1,0);
  const ex=Math.max(Math.min(a,b,c),0),taxable=hra-ex,saved=ex*N(s.slab)/100;

   kpis:[{k:"HRA received",v:money(hra)},{k:"Exempt",v:money(ex),tone:"g"},
    {k:"Taxable HRA",v:money(taxable),tone:"a"},{k:"Tax saved",v:money(saved),tone:"g"}],
   chart:{title:"The three limits - the smallest one applies",labels:["Actual HRA",(s.metro?"50%":"40%")+" of basic","Rent - 10% of basic"],
     series:[{name:"Limit",color:C.inv,values:[a,b,c]},{name:"Exempt",color:C.ret,values:[ex,ex,ex],type:"line"}]},
   table:{title:"The least-of test",cols:["Test","Amount","Applies?"],
     rows:[["Actual HRA received",money(a),ex===a?"Yes":""],
      [(s.metro?"50%":"40%")+" of basic + DA",money(b),ex===b?"Yes":""],
      ["Rent paid minus 10% of basic + DA",money(c),ex===c?"Yes":""]],
    foot:["Exemption","",money(ex)]},
   formula:F("Exemption = least of:",
     "  1. HRA actually received                        = "+money(a),
     "  2. "+(s.metro?"50%":"40%")+" of basic + DA ("+(s.metro?"metro":"non-metro")+")     = "+money(b),
     "  3. Rent paid - 10% of basic + DA                = "+money(c)),
   warn:"HRA exemption is available only under the old regime. Under the new regime the whole HRA is taxable.",
   notes:["If annual rent crosses \u20B91 lakh, you must report your landlord's PAN to your employer.",
    "Rent paid to a parent is allowed if it is genuine - actually transferred, and declared as income in the parent's return.",
    "If you get no HRA at all, section 80GG gives a much smaller deduction instead, again only under the old regime."]}}});

add({id:"salary",cat:"Tax",name:"CTC to take-home salary",tags:"in hand salary ctc breakup gross net pf professional tax",
 blurb:"Break a CTC into what actually reaches your bank account each month, after PF, gratuity provision, professional tax and TDS.",

     opts:[{v:"cap",t:"On \u20B915,000 ceiling"},{v:"full",t:"On full basic"},{v:"none",t:"Not applicable"}]},

     {label:"Tax + PT",value:T.total+N(s.pt),color:C.tax,fmt:money(T.total+N(s.pt))},{label:"Gratuity provision",value:gratY,color:C.bal,fmt:money(gratY)}],

   notes:["CTC is not salary. Employer PF and the gratuity provision are yours eventually, but they never appear in your bank account each month.",
    "PF on the \u20B915,000 ceiling is the statutory minimum; many employers apply 12% of the full basic instead, which raises retirement savings and lowers take-home.",

add({id:"cgequity",cat:"Tax",name:"Capital gains - shares & equity funds",tags:"stcg ltcg 12.5 percent equity 1.25 lakh exemption",
 blurb:"Post-July-2024 rates: 20% short term, 12.5% long term above a \u20B91.25 lakh yearly exemption.",

   kpis:[{k:"Gain",v:money(gain),tone:gain>=0?"g":"r"},{k:"Exempt",v:money(exempt),tone:"g"},
    {k:"Taxed at",v:pct(rate*100,1),tone:"a"},{k:"Net in hand",v:money(sell-N(s.stt)-tot),tone:"g"}],
   chart:{title:"Sale proceeds split",labels:["Cost","Gain kept","Tax"],
     series:[{name:"Amount",color:C.ret,values:[buy,gain-tot,tot]}]},
   table:{title:"Computation",cols:["Line","Amount"],
     rows:[["Sale value",money(sell)],["Less: purchase value",money(-buy)],["Less: brokerage and charges",money(-N(s.stt))],
      ["Capital gain",money(gain)],["Less: \u20B91.25 lakh exemption available",money(-exempt)],
      ["Taxable gain",money(taxable)],["Tax at "+pct(rate*100,1),money(tax)],["Cess at 4%",money(cess)],["Total tax",money(tot)]]},
   formula:F("Holding over 12 months = long term for listed equity and equity mutual funds.",
     "Long term: 12.5% on gains above \u20B91.25 lakh in a financial year, no indexation.",
     "Short term: 20% flat (raised from 15% on 23 July 2024). Cess of 4% on top in both cases."),
   notes:["The \u20B91.25 lakh exemption is per financial year across all your equity long-term gains, not per transaction.",
    "Harvesting: selling and rebuying enough units each year to use up the \u20B91.25 lakh exemption resets your cost base and is entirely legal.",
    "Shares bought before 31 January 2018 get grandfathering - the cost is taken as the higher of actual cost and the 31 January 2018 price. Not modelled here.",
    "Short-term losses can be set off against both short- and long-term gains; long-term losses only against long-term gains. Either can be carried forward eight years if you file on time."]}}});

/* ---- 47. Property / debt capital gains ---- */
add({id:"cgprop",cat:"Tax",name:"Capital gains - property & debt",tags:"indexation cii property land debt fund gold ltcg 12.5 20",
 blurb:"Both routes for property bought before 23 July 2024 - 12.5% flat or 20% with indexation - and the slab treatment for debt funds.",
 inputs:[{k:"kind",label:"Asset",type:"seg",def:"prop",opts:[{v:"prop",t:"Property / gold"},{v:"debt",t:"Debt fund"}]},
   M("buy","Purchase price",3000000,1,500000000,10000),
   {k:"py",label:"Purchase financial year",type:"select",def:"2015-16",opts:[["2001-02",100],["2002-03",105],["2003-04",109],["2004-05",113],["2005-06",117],["2006-07",122],["2007-08",129],["2008-09",137],["2009-10",148],["2010-11",167],["2011-12",184],["2012-13",200],["2013-14",220],["2014-15",240],["2015-16",254],["2016-17",264],["2017-18",272],["2018-19",280],["2019-20",289],["2020-21",301],["2021-22",317],["2022-23",331],["2023-24",348],["2024-25",363]].map(x=>({v:x[0],t:x[0]+"  (CII "+x[1]+")"}))},
   M("imp","Cost of improvement",0,0,100000000,10000),M("exp","Transfer expenses (brokerage, stamp)",0,0,50000000,10000),
   M("sell","Sale price",9000000,1,500000000,10000),
   {k:"cii",label:"CII of the year of sale",type:"num",unit:"index",def:376,min:100,max:600,step:1,hint:"CBDT notifies this each June. FY 2025-26 is 376."},
   {k:"slab",label:"Your slab (for debt funds)",type:"select",def:"30",opts:[{v:"5",t:"5%"},{v:"20",t:"20%"},{v:"30",t:"30%"}]},
   {k:"pre24",label:"Acquired before 23 July 2024 (indexation option available)",type:"toggle",def:true}],
 run(s){const CII={"2001-02":100,"2002-03":105,"2003-04":109,"2004-05":113,"2005-06":117,"2006-07":122,"2007-08":129,"2008-09":137,"2009-10":148,"2010-11":167,"2011-12":184,"2012-13":200,"2013-14":220,"2014-15":240,"2015-16":254,"2016-17":264,"2017-18":272,"2018-19":280,"2019-20":289,"2020-21":301,"2021-22":317,"2022-23":331,"2023-24":348,"2024-25":363};
  const buy=N(s.buy),sell=N(s.sell),imp=N(s.imp),exp=N(s.exp);
  const ciiP=CII[s.py]||100,ciiS=N(s.cii);
  const indexed=(buy+imp)*ciiS/ciiP;
  const plainGain=sell-buy-imp-exp, idxGain=sell-indexed-exp;
  if(s.kind==="debt"){const t=Math.max(plainGain,0)*N(s.slab)/100*1.04;
   return{hero:{label:"Tax on debt fund gains",value:money(t),sub:"Taxed at your slab rate - no indexation for units bought after 1 April 2023"},
    kpis:[{k:"Gain",v:money(plainGain),tone:"g"},{k:"Slab rate",v:pct(N(s.slab),0)},{k:"Tax + cess",v:money(t),tone:"a"},{k:"Net",v:money(sell-buy-t),tone:"g"}],
    table:{title:"Computation",cols:["Line","Amount"],rows:[["Sale value",money(sell)],["Less: cost",money(-buy)],["Gain",money(plainGain)],["Tax at slab + 4% cess",money(t)]]},
    formula:"Debt mutual fund units bought on or after 1 April 2023 are always short term - the entire gain is added to income and taxed at your slab rate.",
    notes:["Units bought before 1 April 2023 and held over 24 months are taxed at 12.5% without indexation after 23 July 2024.",
     "This is why debt funds lost their edge over FDs, apart from the ability to defer the tax until you redeem."]};}
  const t1=Math.max(plainGain,0)*0.125*1.04, t2=Math.max(idxGain,0)*0.20*1.04;
  const best=s.pre24?Math.min(t1,t2):t1;
  return{hero:{label:"Capital gains tax",value:money(best),
    sub:s.pre24?(t1<=t2?"12.5% without indexation is cheaper here":"20% with indexation is cheaper here"):"12.5% flat - indexation is not available for assets acquired after 23 July 2024"},
   kpis:[{k:"12.5% flat",v:money(t1),tone:t1<=t2?"g":"a"},{k:"20% with indexation",v:money(t2),tone:s.pre24?(t2<t1?"g":"a"):""},
    {k:"Indexed cost",v:money(indexed),tone:"p"},{k:"Net in hand",v:money(sell-best-exp)}],
   chart:{title:"The two routes",labels:["12.5% flat","20% indexed"],
     series:[{name:"Taxable gain",color:C.inv,values:[Math.max(plainGain,0),Math.max(idxGain,0)]},{name:"Tax",color:C.tax,values:[t1,t2]}]},
   table:{title:"Both routes side by side",cols:["Line","Without indexation","With indexation"],
    rows:[["Sale value",money(sell),money(sell)],["Cost of acquisition",money(buy),money(indexed)],
     ["Cost of improvement",money(imp),"included above"],["Transfer expenses",money(exp),money(exp)],
     ["Capital gain",money(plainGain),money(idxGain)],["Rate",'12.5%','20%'],["Tax + 4% cess",money(t1),money(t2)]]},
   formula:F("Indexed cost = cost x (CII of sale year / CII of purchase year)",
     "  = "+inr(buy+imp)+" x ("+ciiS+" / "+ciiP+") = "+money(indexed),
     s.pre24?"For land and buildings acquired before 23 July 2024, a resident individual or HUF may pay the lower of the two."
      :"For assets acquired on or after 23 July 2024 only the 12.5% flat route exists."),
   notes:["Reinvesting in a residential house under section 54 or 54F, or in capital gains bonds under 54EC (up to \u20B950 lakh, 5-year lock-in), can remove the tax entirely.",
    "TDS at 1% applies on property sales above \u20B950 lakh, deducted by the buyer under section 194-IA.",
    "The buyer's stamp duty value matters: if the sale price is below it, section 50C substitutes the higher figure as your sale value."]}}});

/* ---- 48. Home loan tax benefit ---- */
add({id:"hltax",cat:"Tax",name:"Home loan tax benefit",tags:"section 24b 80c principal interest deduction let out self occupied",
 blurb:"What the interest and principal on a home loan are actually worth in tax, and how much of it survives the new regime.",
 inputs:[M("p","Loan amount",5000000,100000,500000000,100000),P("r","Interest rate",8.5,1,20,0.05),Y("n","Tenure",20,1,35,1),
   {k:"use",label:"Property is",type:"seg",def:"self",opts:[{v:"self",t:"Self-occupied"},{v:"let",t:"Let out"}]},
   M("rent","Annual rent received",0,0,10000000,10000),M("c80used","80C already used elsewhere",0,0,150000,5000),
   {k:"slab",label:"Tax slab",type:"select",def:"30",opts:[{v:"5",t:"5%"},{v:"20",t:"20%"},{v:"30",t:"30%"}]}],
 run(s){const p=N(s.p),r=N(s.r)/1200,n=N(s.n)*12,e=emiOf(p,r,n),slab=N(s.slab)/100;
  let bal=p;const rows=[];let tot=0;
  for(let y=1;y<=Math.min(N(s.n),30);y++){let yi=0,yp=0;
   for(let m=0;m<12;m++){const ic=bal*r;yi+=ic;yp+=e-ic;bal-=e-ic;}
   const nav=s.use==="let"?N(s.rent)*0.7:0;
   const lossRaw=nav-yi;
   const ded24=s.use==="self"?Math.min(yi,200000):Math.min(Math.max(-lossRaw,0),200000);
   const ded80=Math.min(yp,Math.max(150000-N(s.c80used),0));
   const save=(ded24+ded80)*slab;tot+=save;
   rows.push([y,money(yi),money(yp),money(ded24),money(ded80),money(save)]);}
  const y1=rows[0];
  const L=rows.map((_,i)=>"Y"+(i+1)),A=rows.map(r2=>N(r2[3].slice(1).replace(/,/g,""))),B=rows.map(r2=>N(r2[4].slice(1).replace(/,/g,"")));
  return{hero:{label:"Tax saved over the loan",value:money(tot),sub:"About "+money(tot/Math.min(N(s.n),30))+" a year on average, in the old regime"},
   kpis:[{k:"First year interest",v:y1[1]},{k:"Deduction u/s 24(b)",v:y1[3],tone:"g"},
    {k:"Principal under 80C",v:y1[4],tone:"g"},{k:"First year saving",v:y1[5],tone:"g"}],
   chart:{title:"Deductions available each year",labels:L,
     series:[{name:"Interest u/s 24(b)",color:C.ret,values:A},{name:"Principal u/s 80C",color:C.inv,values:B}]},
   table:{title:"Year by year",cols:["Year","Interest paid","Principal repaid","24(b) deduction","80C deduction","Tax saved"],rows},
   formula:F(s.use==="self"?"Self-occupied: interest deduction capped at \u20B92,00,000 a year under section 24(b)."
     :"Let out: full interest is deductible against rental income, but the resulting house-property loss set off against other income is capped at \u20B92,00,000 a year. The rest carries forward eight years.",
     "Principal repayment qualifies under 80C within the overall \u20B91.5 lakh limit, alongside PPF, EPF and ELSS.",
     s.use==="let"?"Net annual value = rent - municipal taxes, less the standard 30% deduction. Modelled here as 70% of rent.":""),
   warn:"Both benefits are old-regime only. Under the new regime a self-occupied property gets no interest deduction at all - a let-out property still allows interest against rental income.",
   notes:["The interest deduction is largest in the early years, exactly when the EMI is mostly interest, and shrinks later.",
    "For a joint loan, co-owners who are also co-borrowers can each claim up to \u20B92 lakh of interest and \u20B91.5 lakh of principal - the single biggest lever in home-loan tax planning.",
    "Pre-construction interest can be claimed in five equal instalments once possession is taken, within the same \u20B92 lakh cap."]}}});

/* ---- 49. GST ---- */
add({id:"gst",cat:"Tax",name:"GST calculator",tags:"gst cgst sgst igst inclusive exclusive reverse",
 blurb:"Add GST to a price or strip it out of one, with the CGST, SGST and IGST split.",
 inputs:[M("amt","Amount",10000,1,500000000,100),
   {k:"rate",label:"GST rate",type:"select",def:"18",opts:[{v:"0",t:"0% (exempt)"},{v:"0.25",t:"0.25%"},{v:"3",t:"3%"},{v:"5",t:"5%"},{v:"12",t:"12%"},{v:"18",t:"18%"},{v:"28",t:"28%"},{v:"40",t:"40%"}]},
   {k:"mode",label:"The amount above is",type:"seg",def:"ex",opts:[{v:"ex",t:"Before GST"},{v:"in",t:"Including GST"}]},
   {k:"inter",label:"Inter-state supply (IGST instead of CGST + SGST)",type:"toggle",def:false}],
 run(s){const a=N(s.amt),r=N(s.rate)/100;
  const base=s.mode==="ex"?a:a/(1+r),gst=s.mode==="ex"?a*r:a-base,total=base+gst;
  return{hero:{label:s.mode==="ex"?"Total including GST":"Base value before GST",value:money(s.mode==="ex"?total:base),
    sub:"GST component "+money(gst)+" at "+N(s.rate)+"%"},
   kpis:s.inter?[{k:"Taxable value",v:money(base)},{k:"IGST",v:money(gst),tone:"a"},{k:"Total",v:money(total),tone:"g"},{k:"Rate",v:pct(N(s.rate),2)}]
    :[{k:"Taxable value",v:money(base)},{k:"CGST",v:money(gst/2),tone:"a"},{k:"SGST",v:money(gst/2),tone:"a"},{k:"Total",v:money(total),tone:"g"}],
   donut:[{label:"Taxable value",value:base,color:C.inv,fmt:money(base)},{label:"GST",value:gst,color:C.tax,fmt:money(gst)}],
   donutTop:"Invoice",donutBot:shortI(total),
   table:{title:"Invoice split",cols:["Line","Amount"],
    rows:s.inter?[["Taxable value",money(base)],["IGST @"+N(s.rate)+"%",money(gst)],["Invoice total",money(total)]]
     :[["Taxable value",money(base)],["CGST @"+num(N(s.rate)/2,2)+"%",money(gst/2)],["SGST @"+num(N(s.rate)/2,2)+"%",money(gst/2)],["Invoice total",money(total)]]},
   formula:s.mode==="ex"?"GST = amount x rate = "+inr(a)+" x "+N(s.rate)+"% = "+money(gst)
     :F("Base = amount / (1 + rate) = "+inr(a)+" / "+num(1+r,4)+" = "+money(base),"GST = amount - base = "+money(gst)),
   notes:["Within a state the tax splits equally into CGST and SGST. Across states it is a single IGST at the same total rate.",
    "Registration is compulsory above \u20B940 lakh of turnover for goods and \u20B920 lakh for services in most states, and lower in special-category states."]}}});

/* ---- 50. Advance tax ---- */
add({id:"advtax",cat:"Tax",name:"Advance tax schedule",tags:"advance tax instalments 234b 234c interest due dates",
 blurb:"The four instalments, the dates, and the interest under 234B and 234C if you miss them.",
 inputs:[M("tax","Estimated tax for the year",300000,0,100000000,5000),M("tds","TDS and TCS already deducted",50000,0,100000000,5000),
   {k:"biz",label:"Presumptive scheme under 44AD or 44ADA",type:"toggle",def:false,hint:"Presumptive taxpayers pay 100% in one instalment by 15 March"},
   M("paid","Advance tax paid so far",0,0,100000000,5000)],
 run(s){const net=Math.max(N(s.tax)-N(s.tds),0);
  const sched=s.biz?[["15 March",1]]:[["15 June",.15],["15 September",.45],["15 December",.75],["15 March",1]];
  let prev=0;const rows=sched.map(([d,f])=>{const cum=net*f,inst=cum-prev;prev=cum;
    return [d,pct(f*100,0),money(inst),money(cum)];});
  const shortfall=Math.max(net-N(s.paid),0);
  const i234c=s.biz?0:net*(.15*0.01*3*(N(s.paid)<net*.15?1:0)+.30*0.01*3*(N(s.paid)<net*.45?1:0)+.30*0.01*3*(N(s.paid)<net*.75?1:0));
  return{hero:{label:"Advance tax payable this year",value:money(net),
    sub:net<10000?"Below \u20B910,000 - advance tax is not required":"In "+sched.length+" instalment"+(sched.length>1?"s":"")},
   kpis:[{k:"Estimated tax",v:money(N(s.tax))},{k:"Less TDS",v:money(N(s.tds)),tone:"g"},
    {k:"Still to pay",v:money(shortfall),tone:shortfall?"a":"g"},{k:"Approx 234C interest",v:money(i234c),tone:i234c?"r":"g"}],
   chart:{title:"Cumulative payment required",labels:sched.map(x=>x[0]),
     series:[{name:"Cumulative",color:C.ret,values:sched.map(x=>net*x[1])}]},
   table:{title:"Instalment schedule",cols:["Due date","Cumulative %","Instalment","Paid by then"],rows},
   formula:F("Advance tax applies once the net liability after TDS crosses \u20B910,000 in a year.",
     "Section 234C: 1% a month for three months on each shortfall at the first three dates, and one month at the fourth.",
     "Section 234B: 1% a month from 1 April until you pay, if less than 90% of the liability was paid by 31 March."),
   notes:["Senior citizens with no business income are exempt from advance tax - they can pay everything as self-assessment tax.",
    "Capital gains and lottery income are an exception: you only need to include them from the instalment falling due after the income arises.",
    "Pay through the e-Pay Tax service on the income tax portal, choosing the right assessment year - a wrong year is painful to correct."]}}});

/* ---- 51. Freelancer presumptive ---- */
add({id:"presumptive",cat:"Tax",name:"Freelancer tax (44ADA / 44AD)",tags:"presumptive taxation professional consultant 50 percent 44ada",
 blurb:"Declare half your receipts as profit, skip the books, and see the tax on it under both regimes.",
 inputs:[M("rec","Gross professional receipts",4000000,0,75000000,50000),
   {k:"sec",label:"Section",type:"seg",def:"44ADA",opts:[{v:"44ADA",t:"44ADA - professionals"},{v:"44AD",t:"44AD - business"}]},
   M("act","Actual expenses (if you keep books instead)",800000,0,50000000,10000),
   M("ded","Deductions - 80C, 80D, NPS (old regime)",200000,0,5000000,10000),
   {k:"cash",label:"More than 5% of receipts in cash",type:"toggle",def:false,hint:"Decides whether the higher turnover limit applies"}],
 run(s){const rec=N(s.rec),isPro=s.sec==="44ADA";
  const limit=isPro?(s.cash?5000000:7500000):(s.cash?20000000:30000000);
  const rate=isPro?0.5:(s.cash?0.08:0.06);
  const presProfit=rec*rate, actProfit=Math.max(rec-N(s.act),0);
  const tN=computeTax(Math.max(presProfit,0),true,'0'),tO=computeTax(Math.max(presProfit-N(s.ded),0),false,'0');
  const aN=computeTax(Math.max(actProfit,0),true,'0'),aO=computeTax(Math.max(actProfit-N(s.ded),0),false,'0');
  const best=Math.min(tN.total,tO.total,aN.total,aO.total);
  const which=best===tN.total?"Presumptive, new regime":best===tO.total?"Presumptive, old regime":best===aN.total?"Actual books, new regime":"Actual books, old regime";
  return{hero:{label:"Lowest tax route",value:money(best),sub:which},
   kpis:[{k:"Deemed profit at "+pct(rate*100,0),v:money(presProfit),tone:"p"},
    {k:"Presumptive, new",v:money(tN.total),tone:best===tN.total?"g":""},
    {k:"Presumptive, old",v:money(tO.total),tone:best===tO.total?"g":""},
    {k:"Actual books",v:money(Math.min(aN.total,aO.total)),tone:best===aN.total||best===aO.total?"g":""}],
   chart:{title:"Four routes",labels:["Presumptive new","Presumptive old","Books new","Books old"],
     series:[{name:"Tax",color:C.tax,values:[tN.total,tO.total,aN.total,aO.total]}]},
   table:{title:"Comparison",cols:["Route","Taxable income","Tax"],
    rows:[["Presumptive "+s.sec+", new regime",money(presProfit),money(tN.total)],
     ["Presumptive "+s.sec+", old regime",money(Math.max(presProfit-N(s.ded),0)),money(tO.total)],
     ["Regular books, new regime",money(actProfit),money(aN.total)],
     ["Regular books, old regime",money(Math.max(actProfit-N(s.ded),0)),money(aO.total)]]},
   formula:F(isPro?"Section 44ADA: 50% of gross receipts is deemed to be profit for specified professionals - legal, medical, engineering, architecture, accountancy, technical consultancy, interior decoration and a few notified others."
     :"Section 44AD: 8% of turnover is deemed profit, or 6% on receipts through banking channels.",
     "Turnover limit here: "+money(limit)+(s.cash?" (cash receipts above 5%)":" (cash receipts at or below 5%)")),
   warn:rec>limit?"Receipts exceed the "+shortI(limit)+" limit for this section, so presumptive taxation is not available and books plus an audit are required.":null,
   notes:["Presumptive taxation removes the need to maintain books or get audited, and no expense proof is needed - which is why it usually wins when your real expenses are below the deemed share.",
    "Once you opt out of 44AD you are locked out for five years. 44ADA has no such lock-in.",
    "Advance tax under both sections is a single instalment by 15 March.",
    "GST registration is separate and kicks in above \u20B920 lakh of service turnover in most states."]}}});
</script>
<script>
/* ============ Registry D - markets, planning, everyday (compact) ============ */
const S=(k,l,d,o,x={})=>Object.assign({k,label:l,type:"select",def:d,opts:o.map(a=>({v:a[0],t:a[1]}))},x);
const G=(k,l,d,o)=>({k,label:l,type:"seg",def:d,opts:o.map(a=>({v:a[0],t:a[1]}))});
const TG=(k,l,d,h)=>({k,label:l,type:"toggle",def:d,hint:h});
const U=(k,l,d,mn,mx,st,u,x={})=>Object.assign({k,label:l,type:"num",unit:u,def:d,min:mn,max:mx,step:st},x);
const K=(k,v,t)=>({k,v,tone:t});
const today=()=>new Date().toISOString().slice(0,10);

/* ===================== TRADING & MARKETS ===================== */
const MKT="Trading & markets";

add({id:"brokerage",cat:MKT,name:"Brokerage & charges",tags:"stt gst stamp duty sebi dp charges discount broker breakeven",
 blurb:"Every statutory charge on a trade - STT, exchange fee, SEBI, stamp duty, GST and DP - and the move you need just to break even.",
 inputs:[G("seg","Segment","del",[["del","Delivery"],["intra","Intraday"],["fut","Futures"],["opt","Options"]]),
  M("bp","Buy price",1000,0.05,1000000,0.05),M("sp","Sell price",1050,0.05,1000000,0.05),
  U("qty","Quantity / total units",100,1,1000000,1,"units"),M("brk","Brokerage per executed order",20,0,5000,1)],
 run(s){const bp=N(s.bp),sp=N(s.sp),q=N(s.qty),g=s.seg;
  const bt=bp*q,st=sp*q,tv=bt+st;
  const R={del:{stt:[.001,.001],ex:.0000297,stamp:.00015,dp:1},intra:{stt:[0,.00025],ex:.0000297,stamp:.00003,dp:0},
   fut:{stt:[0,.0002],ex:.0000173,stamp:.00002,dp:0},opt:{stt:[0,.001],ex:.0003503,stamp:.00003,dp:0}}[g];
  const brk=g==="del"?Math.min(N(s.brk),N(s.brk)):N(s.brk)*2;
  const brokerage=g==="del"?N(s.brk)*2:N(s.brk)*2;
  const stt=bt*R.stt[0]+st*R.stt[1], ex=tv*R.ex, sebi=tv*0.000001, stamp=bt*R.stamp;
  const gst=(brokerage+ex+sebi)*0.18, dp=R.dp?15.34:0;
  const tot=brokerage+stt+ex+sebi+stamp+gst+dp;
  const gross=st-bt, net=gross-tot, be=tot/q;
  return{hero:{label:net>=0?"Net profit after all charges":"Net loss after all charges",value:money(net),
    sub:"Charges of "+money(tot)+" on a turnover of "+money(tv)},
   kpis:[K("Gross P&L",money(gross),gross>=0?"g":"r"),K("Total charges",money(tot),"a"),
    K("Break-even move",money(be)+"/unit","p"),K("Charges as % of turnover",pct(tot/tv*100,3),"a")],
   donut:[{label:"Brokerage",value:brokerage,color:C.inv,fmt:money(brokerage)},{label:"STT",value:stt,color:C.tax,fmt:money(stt)},
    {label:"GST",value:gst,color:C.bal,fmt:money(gst)},{label:"Exchange, SEBI, stamp, DP",value:ex+sebi+stamp+dp,color:C.alt,fmt:money(ex+sebi+stamp+dp)}],
   donutTop:"Charges",donutBot:shortI(tot),
   table:{title:"Charge by charge",cols:["Charge","Basis","Amount"],
    rows:[["Brokerage","2 orders",money(brokerage)],["STT / CTT",g==="del"?"0.1% both legs":g==="opt"?"0.1% of sell premium":g==="fut"?"0.02% sell":"0.025% sell",money(stt)],
     ["Exchange transaction",pct(R.ex*100,5)+" of turnover",money(ex)],["SEBI turnover fee","\u20B910 per crore",money(sebi)],
     ["Stamp duty",pct(R.stamp*100,4)+" on buy",money(stamp)],["GST","18% on brokerage + fees",money(gst)],
     ["DP charges",g==="del"?"per scrip on sell":"not applicable",money(dp)]],
    foot:["Total","",money(tot)]},
   formula:"Turnover "+money(tv)+". Rates are the standard NSE equity/derivative rates - exchanges revise them periodically, so treat this as a close estimate.",
   notes:["Charges are why frequent small trades rarely work: on intraday you must clear the break-even move twice a day just to stand still.",
